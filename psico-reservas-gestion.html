<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Reservas — Psicopedagógico</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--s:#1a2235;--s2:#212d42;--b:#2a3a52;
  --acc:#6366f1;--acc2:#a5b4fc;--red:#ef4444;--yellow:#f59e0b;--green:#10b981;--blue:#3b82f6;
  --text:#e2e8f0;--t2:#94a3b8;--t3:#64748b;
}
html,body{min-height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
body{padding:20px 16px 60px;max-width:960px;margin:0 auto}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:10px 16px;background:var(--s);border:1px solid var(--b);border-radius:10px}
.topbar-titulo{font-size:1rem;font-weight:800;color:var(--acc2)}
.topbar-user{font-size:0.78rem;color:var(--t2)}.topbar-user strong{color:var(--text)}
.btn-link{font-size:0.75rem;font-weight:600;color:var(--t3);border:1px solid var(--b);border-radius:6px;padding:5px 12px;text-decoration:none;transition:all .15s}
.btn-link:hover{border-color:var(--acc);color:var(--acc2)}
.btn-logout{font-size:0.75rem;font-weight:600;color:var(--t3);background:none;border:1px solid var(--b);border-radius:6px;padding:5px 12px;cursor:pointer}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:16px;text-align:center}
.kpi-val{font-size:1.8rem;font-weight:800;line-height:1}
.kpi-label{font-size:0.68rem;color:var(--t3);margin-top:5px;text-transform:uppercase;letter-spacing:.5px}

.filtros{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filtro-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--b);background:none;color:var(--t2);font-size:0.78rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.filtro-btn.activo{border-color:var(--acc);color:var(--acc2);background:rgba(99,102,241,.12)}
.filtro-btn:hover{border-color:var(--acc);color:var(--acc2)}

.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:20px;margin-bottom:16px}
.card-titulo{font-size:0.85rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}

table{width:100%;border-collapse:collapse;font-size:0.78rem}
thead th{padding:8px 10px;color:var(--t3);font-weight:600;text-align:left;border-bottom:1px solid var(--b)}
tbody td{padding:10px;border-bottom:1px solid rgba(42,58,82,.4);color:var(--t2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,.02)}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.7rem;font-weight:700}
.b-pendiente{background:rgba(245,158,11,.15);color:var(--yellow)}
.b-confirmada{background:rgba(16,185,129,.15);color:var(--green)}
.b-cancelada{background:rgba(239,68,68,.12);color:var(--red)}
.b-completada{background:rgba(99,102,241,.15);color:var(--acc2)}
.b-no_asistio{background:rgba(148,163,184,.15);color:var(--t2)}

.acciones{display:flex;gap:6px;flex-wrap:wrap}
.btn-accion{padding:4px 10px;border-radius:6px;border:1.5px solid;font-size:0.72rem;font-weight:700;cursor:pointer;background:none;font-family:'Inter',sans-serif;transition:opacity .15s}
.btn-accion:hover{opacity:.75}
.btn-confirmar{border-color:var(--green);color:var(--green)}
.btn-completar{border-color:var(--acc);color:var(--acc2)}
.btn-cancelar{border-color:var(--red);color:var(--red)}
.btn-noasistio{border-color:var(--t2);color:var(--t2)}
.btn-ficha{border-color:var(--acc2);color:var(--acc2)}

/* Barra de rango de fechas */
.rango-bar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;padding:14px 16px;background:var(--s);border:1px solid var(--b);border-radius:10px}
.rango-field{display:flex;flex-direction:column;gap:4px}
.rango-field label{font-size:0.66rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.rango-field input{background:var(--s2);border:1.5px solid var(--b);border-radius:7px;padding:8px 10px;color:var(--text);font-size:0.83rem;font-family:'Inter',sans-serif;outline:none}
.rango-field input:focus{border-color:var(--acc)}
.btn-rango{padding:9px 16px;background:var(--acc);color:#fff;border:none;border-radius:7px;font-size:0.8rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:opacity .15s}
.btn-rango:hover{opacity:.85}
.btn-rango-sec{padding:9px 16px;background:none;color:var(--t2);border:1.5px solid var(--b);border-radius:7px;font-size:0.8rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.btn-rango-sec:hover{border-color:var(--acc);color:var(--acc2)}

/* Barra de búsqueda de estudiante */
.busqueda-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;padding:10px 14px;background:var(--s);border:1px solid var(--b);border-radius:10px}
.busqueda-icon{font-size:0.95rem;color:var(--t3)}
.busqueda-input{flex:1;background:var(--s2);border:1.5px solid var(--b);border-radius:7px;padding:9px 12px;color:var(--text);font-size:0.85rem;font-family:'Inter',sans-serif;outline:none}
.busqueda-input:focus{border-color:var(--acc)}
.busqueda-input::placeholder{color:var(--t3)}

/* Pie de tabla: total + paginación */
.tabla-footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--b);flex-wrap:wrap;gap:10px}
.tabla-total{font-size:0.8rem;color:var(--t2);font-weight:600}
.paginacion{display:flex;align-items:center;gap:10px}
.pag-btn{padding:6px 12px;background:var(--s2);border:1.5px solid var(--b);border-radius:7px;color:var(--t2);font-size:0.8rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.pag-btn:hover:not(:disabled){border-color:var(--acc);color:var(--acc2)}
.pag-btn:disabled{opacity:.4;cursor:not-allowed}
.pag-info{font-size:0.8rem;color:var(--t3);font-weight:600}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-overlay.visible{display:flex}
.modal{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:24px;width:100%;max-width:640px;position:relative}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--b)}
.modal-nombre{font-size:1.1rem;font-weight:800;color:var(--text)}
.modal-sub{font-size:0.78rem;color:var(--t3);margin-top:3px}
.modal-close{background:none;border:1px solid var(--b);border-radius:6px;color:var(--t3);font-size:0.9rem;cursor:pointer;padding:5px 10px;line-height:1;font-weight:600}
.modal-close:hover{border-color:var(--red);color:var(--red)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-bottom:16px}
.f-item{min-width:0}
.f-label{font-size:0.66rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.f-val{font-size:0.86rem;color:var(--text);word-break:break-word}
.f-full{grid-column:1/-1}
.f-seccion-titulo{font-size:0.72rem;font-weight:700;color:var(--acc2);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px}

.empty{text-align:center;padding:32px;color:var(--t3);font-size:0.85rem}
.loading{text-align:center;padding:32px;color:var(--t3)}
</style>
<style id="ns-layout-pre">body{margin-left:240px!important}@media(max-width:780px){body{margin-left:0!important;padding-top:52px!important}}</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="font-size:1.4rem">🧠</div>
    <div class="topbar-titulo">Reservas de Sesiones</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="topbar-user" id="topbar-user"></div>
  </div>
</div>

<div class="rango-bar">
  <div class="rango-field">
    <label>Desde</label>
    <input type="date" id="fDesde">
  </div>
  <div class="rango-field">
    <label>Hasta</label>
    <input type="date" id="fHasta">
  </div>
  <button class="btn-rango" onclick="aplicarRango()">Aplicar</button>
  <button class="btn-rango-sec" onclick="limpiarRango()">Limpiar</button>
  <span style="width:1px;height:34px;background:var(--b);margin:0 2px"></span>
  <button class="btn-rango-sec" onclick="rangoRapido(0)">Hoy</button>
  <button class="btn-rango-sec" onclick="rangoRapido(1)">Hoy y ayer</button>
</div>

<div class="busqueda-bar">
  <span class="busqueda-icon">🔍</span>
  <input type="text" id="busquedaInput" class="busqueda-input"
         placeholder="Buscar estudiante por nombre, apellido o código..."
         oninput="onBusquedaInput()" autocomplete="off">
  <button class="btn-rango-sec" id="btnLimpiarBusqueda" style="display:none" onclick="limpiarBusqueda()">✕</button>
</div>

<div class="kpi-grid" id="kpis">
  <div class="kpi"><div class="kpi-val" style="color:var(--yellow)" id="kPendientes">—</div><div class="kpi-label">Pendientes</div></div>
  <div class="kpi"><div class="kpi-val" style="color:var(--green)" id="kConfirmadas">—</div><div class="kpi-label">Confirmadas</div></div>
  <div class="kpi"><div class="kpi-val" style="color:var(--acc2)" id="kCompletadas">—</div><div class="kpi-label">Completadas</div></div>
  <div class="kpi"><div class="kpi-val" style="color:var(--red)" id="kCanceladas">—</div><div class="kpi-label">Canceladas</div></div>
  <div class="kpi"><div class="kpi-val" style="color:var(--t2)" id="kNoAsistio">—</div><div class="kpi-label">No asistió</div></div>
</div>

<div class="card">
  <div class="card-titulo">📋 Reservas</div>
  <div class="filtros">
    <button class="filtro-btn activo" onclick="setFiltro('todos',this)">Todas</button>
    <button class="filtro-btn" onclick="setFiltro('pendiente',this)">Pendientes</button>
    <button class="filtro-btn" onclick="setFiltro('confirmada',this)">Confirmadas</button>
    <button class="filtro-btn" onclick="setFiltro('completada',this)">Completadas</button>
    <button class="filtro-btn" onclick="setFiltro('cancelada',this)">Canceladas</button>
    <button class="filtro-btn" onclick="setFiltro('no_asistio',this)">No asistió</button>
  </div>
  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th>Fecha</th><th>Horario</th><th>Estudiante</th><th>Código</th><th>Estado</th><th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaReservas">
        <tr><td colspan="6" class="loading">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
  <div class="tabla-footer">
    <div class="tabla-total" id="totalInfo">—</div>
    <div class="paginacion">
      <button class="pag-btn" id="btnPrev" onclick="cambiarPagina(-1)">‹ Anterior</button>
      <span class="pag-info" id="pagInfo">—</span>
      <button class="pag-btn" id="btnNext" onclick="cambiarPagina(1)">Siguiente ›</button>
    </div>
  </div>
</div>

<!-- Modal: Ficha de sesión -->
<div class="modal-overlay" id="modalFicha" onclick="if(event.target===this)cerrarFicha()">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div class="modal-nombre" id="fNombre">—</div>
        <div class="modal-sub" id="fSub">—</div>
      </div>
      <button class="modal-close" onclick="cerrarFicha()">✕ Cerrar</button>
    </div>
    <div id="fBody">
      <div class="loading">Cargando ficha...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/sidebar.js"></script>
<script>
const sb = supabase.createClient(
  'https://exjaxhrylfdwehzjfjut.supabase.co',
  'sb_publishable_EP2Y83o7nj7CGCUd0pH3VA_vSNkeg99'
);

let reservasPagina = [];
let filtroActual = 'todos';
let fechaDesde = '';
let fechaHasta = '';
let busqueda = '';
let busquedaTimer = null;
let paginaActual = 1;
let totalReservas = 0;
const PER_PAGE = 20;

const DIAS_ES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES_ES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function formatFecha(fechaStr) {
  const [y,m,d] = fechaStr.split('-').map(Number);
  const fecha = new Date(y, m-1, d);
  return `${DIAS_ES[fecha.getDay()]} ${d} ${MESES_ES[m-1]}`;
}

function formatHora(t) {
  if (!t) return '—';
  const [h, min] = t.substring(0,5).split(':').map(Number);
  const ampm = h >= 12 ? 'pm' : 'am';
  return `${h%12||12}:${String(min).padStart(2,'0')} ${ampm}`;
}

function badgeEstado(estado) {
  const map = {
    pendiente:  ['b-pendiente','Pendiente'],
    confirmada: ['b-confirmada','Confirmada'],
    cancelada:  ['b-cancelada','Cancelada'],
    completada: ['b-completada','Completada'],
    no_asistio: ['b-no_asistio','No asistió'],
  };
  const [cls,txt] = map[estado]||['','—'];
  return `<span class="badge ${cls}">${txt}</span>`;
}

function accionesHTML(r) {
  if (r.estado === 'completada') {
    return `<button class="btn-accion btn-ficha" onclick="verFicha('${r.id}')">📋 Ver ficha</button>`;
  }
  if (r.estado === 'cancelada' || r.estado === 'no_asistio') return '—';
  let btns = '';
  if (r.estado === 'pendiente') {
    btns += `<button class="btn-accion btn-confirmar" onclick="cambiarEstado('${r.id}','confirmada')">✓ Confirmar</button>`;
  }
  if (r.estado === 'confirmada' || r.estado === 'pendiente') {
    btns += `<button class="btn-accion btn-completar" onclick="cambiarEstado('${r.id}','completada')">✔ Completar</button>`;
    btns += `<button class="btn-accion btn-noasistio" onclick="cambiarEstado('${r.id}','no_asistio')">🚫 No asistió</button>`;
    btns += `<button class="btn-accion btn-cancelar" onclick="cambiarEstado('${r.id}','cancelada')">✕ Cancelar</button>`;
  }
  return `<div class="acciones">${btns}</div>`;
}

function renderTabla() {
  const tbody = document.getElementById('tablaReservas');
  if (!reservasPagina.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty">Sin reservas para este filtro</td></tr>`;
    return;
  }
  tbody.innerHTML = reservasPagina.map(r => `
    <tr>
      <td style="color:var(--text);font-weight:600">${formatFecha(r.fecha)}</td>
      <td>${formatHora(r.hora_inicio)} – ${formatHora(r.hora_fin)}</td>
      <td style="color:var(--text)">${r.nombre||'—'}</td>
      <td style="color:var(--t3);font-size:0.75rem">${r.codigo}</td>
      <td>${badgeEstado(r.estado)}</td>
      <td>${accionesHTML(r)}</td>
    </tr>`).join('');
}

function setFiltro(f, btn) {
  filtroActual = f;
  paginaActual = 1;
  document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('activo'));
  btn.classList.add('activo');
  cargarReservas();
}

function aplicarRango() {
  fechaDesde = document.getElementById('fDesde').value;
  fechaHasta = document.getElementById('fHasta').value;
  paginaActual = 1;
  cargarReservas();
}

function limpiarRango() {
  document.getElementById('fDesde').value = '';
  document.getElementById('fHasta').value = '';
  fechaDesde = '';
  fechaHasta = '';
  paginaActual = 1;
  cargarReservas();
}

// Atajos: diasAtras=0 → hoy; diasAtras=1 → hoy y ayer
function rangoRapido(diasAtras) {
  const hoyStr = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Lima' }); // YYYY-MM-DD
  const d = new Date(hoyStr + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() - diasAtras);
  const desde = d.toISOString().slice(0, 10);
  fechaDesde = desde;
  fechaHasta = hoyStr;
  document.getElementById('fDesde').value = desde;
  document.getElementById('fHasta').value = hoyStr;
  paginaActual = 1;
  cargarReservas();
}

function onBusquedaInput() {
  const val = document.getElementById('busquedaInput').value;
  document.getElementById('btnLimpiarBusqueda').style.display = val ? 'block' : 'none';
  clearTimeout(busquedaTimer);
  busquedaTimer = setTimeout(() => {
    busqueda = val.trim();
    paginaActual = 1;
    cargarReservas();
  }, 350);
}

function limpiarBusqueda() {
  document.getElementById('busquedaInput').value = '';
  document.getElementById('btnLimpiarBusqueda').style.display = 'none';
  busqueda = '';
  paginaActual = 1;
  cargarReservas();
}

function cambiarPagina(dir) {
  const totalPaginas = Math.max(1, Math.ceil(totalReservas / PER_PAGE));
  const nueva = Math.min(totalPaginas, Math.max(1, paginaActual + dir));
  if (nueva === paginaActual) return;
  paginaActual = nueva;
  cargarReservas();
}

function renderPaginacion() {
  const totalPaginas = Math.max(1, Math.ceil(totalReservas / PER_PAGE));
  document.getElementById('totalInfo').textContent =
    `${totalReservas} reserva${totalReservas !== 1 ? 's' : ''} en total`;
  document.getElementById('pagInfo').textContent = `Página ${paginaActual} de ${totalPaginas}`;
  document.getElementById('btnPrev').disabled = paginaActual <= 1;
  document.getElementById('btnNext').disabled = paginaActual >= totalPaginas;
}

async function cambiarEstado(id, estado) {
  try {
    const r = await fetch('/api/psico-reservas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion: 'estado', id, estado }),
    });
    const data = await r.json();
    if (data.ok) cargarReservas();
  } catch(e) { alert('Error: ' + e.message); }
}

function actualizarKpis(kpis) {
  kpis = kpis || {};
  document.getElementById('kPendientes').textContent  = kpis.pendiente  || 0;
  document.getElementById('kConfirmadas').textContent = kpis.confirmada || 0;
  document.getElementById('kCompletadas').textContent = kpis.completada || 0;
  document.getElementById('kCanceladas').textContent  = kpis.cancelada  || 0;
  document.getElementById('kNoAsistio').textContent   = kpis.no_asistio || 0;
}

async function cargarReservas() {
  const tbody = document.getElementById('tablaReservas');
  tbody.innerHTML = `<tr><td colspan="6" class="loading">Cargando...</td></tr>`;
  try {
    const params = new URLSearchParams({ accion: 'lista', paginado: '1', page: paginaActual });
    if (filtroActual !== 'todos') params.set('estado', filtroActual);
    if (fechaDesde) params.set('desde', fechaDesde);
    if (fechaHasta) params.set('hasta', fechaHasta);
    if (busqueda) params.set('q', busqueda);

    const r = await fetch(`/api/psico-reservas?${params.toString()}`);
    const data = await r.json();
    reservasPagina = data.reservas || [];
    totalReservas  = data.total || 0;
    actualizarKpis(data.kpis);
    renderTabla();
    renderPaginacion();
  } catch(e) {
    tbody.innerHTML =
      `<tr><td colspan="6" class="empty">Error al cargar: ${e.message}</td></tr>`;
  }
}

const ESTADO_TXT = {
  pendiente:'Pendiente', confirmada:'Confirmada', cancelada:'Cancelada',
  completada:'Completada', no_asistio:'No asistió', reprogramada:'Reprogramada',
};

function fItem(label, val) {
  return `<div class="f-item"><div class="f-label">${label}</div><div class="f-val">${val || '—'}</div></div>`;
}

async function verFicha(id) {
  const overlay = document.getElementById('modalFicha');
  const body = document.getElementById('fBody');
  document.getElementById('fNombre').textContent = 'Cargando...';
  document.getElementById('fSub').textContent = '';
  body.innerHTML = '<div class="loading">Cargando ficha...</div>';
  overlay.classList.add('visible');
  try {
    const r = await fetch(`/api/psico-reservas?accion=detalle&id=${id}`);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    const rv = data.reserva || {};
    const est = data.estudiante || {};

    document.getElementById('fNombre').textContent = rv.nombre || '—';
    document.getElementById('fSub').textContent =
      `${formatFecha(rv.fecha)} · ${formatHora(rv.hora_inicio)} – ${formatHora(rv.hora_fin)} · Sesión N° ${data.n_sesion}`;

    body.innerHTML = `
      <div class="f-grid">
        ${fItem('Código', rv.codigo)}
        ${fItem('Estado', ESTADO_TXT[rv.estado] || rv.estado)}
        ${fItem('Carrera', est.carrera)}
        ${fItem('Correo', rv.email || est.email)}
        ${fItem('Ciclo', rv.ciclo)}
        ${fItem('Turno', rv.turno)}
        ${fItem('Sección', rv.seccion)}
        ${fItem('Teléfono', rv.telefono || est.whatsapp)}
        ${fItem('¿Con quién vive?', rv.con_quien_vive)}
        ${fItem('Motivo de consulta', rv.motivo_consulta)}
      </div>
      <div class="f-seccion-titulo">📝 Registro de la sesión</div>
      <div class="f-grid">
        ${fItem('Profundidad del problema', rv.profundidad_problema)}
        ${fItem('Impacto profesional', rv.impacto_profesional)}
        ${fItem('Tipo de dificultad', rv.tipo_dificultad)}
        ${fItem('Nivel de compromiso', rv.nivel_compromiso)}
        <div class="f-full">${fItem('Problema hallado', rv.problema_hallado)}</div>
        <div class="f-full">${fItem('Observaciones', rv.notas)}</div>
      </div>
      <div class="f-seccion-titulo">📝 Anotaciones de la psicóloga</div>
      <div class="f-val" style="white-space:pre-wrap">${rv.anotaciones ? rv.anotaciones.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) : '—'}</div>`;
  } catch(e) {
    body.innerHTML = `<div class="empty">Error al cargar la ficha: ${e.message}</div>`;
  }
}

function cerrarFicha() {
  document.getElementById('modalFicha').classList.remove('visible');
}

async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/login'; return; }
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal.currentLevel !== 'aal2') { await sb.auth.signOut(); window.location.href = '/login'; return; }
  const r = await fetch('/api/staff-info', { headers: { 'Authorization': `Bearer ${session.access_token}` } });
  if (!r.ok) { window.location.href = '/login'; return; }
  const info = await r.json();
  if (info.rol !== 'director' && info.modulos && info.modulos.length > 0 && !info.modulos.includes('psico_reservas_gestion')) { window.location.href = '/ejecutivo'; return; }
  document.getElementById('topbar-user').innerHTML = `<strong>${info.nombre}</strong>`;
  cargarReservas();
}

initAuth();
</script>
