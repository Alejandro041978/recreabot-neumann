<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>Dashboard Psicopedagógico — Instituto Neumann</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--s:#1a2235;--s2:#212d42;--b:#2a3a52;
  --acc:#6366f1;--acc2:#a5b4fc;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;--green:#10b981;
  --text:#e2e8f0;--t2:#94a3b8;--t3:#64748b;
}
html,body{min-height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
body{padding:20px 16px 60px;max-width:1040px;margin:0 auto}

/* Topbar */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding:10px 16px;background:var(--s);border:1px solid var(--b);border-radius:10px;flex-wrap:wrap;gap:8px}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-titulo{font-size:1rem;font-weight:800;color:var(--acc2)}
.topbar-user{font-size:0.78rem;color:var(--t2)}.topbar-user strong{color:var(--text)}
.btn-nav{font-size:0.75rem;font-weight:600;color:var(--t3);border:1px solid var(--b);border-radius:6px;padding:5px 12px;text-decoration:none;transition:all .15s;white-space:nowrap}
.btn-nav:hover{border-color:var(--acc);color:var(--acc2)}
.btn-nav.activo{color:var(--acc2);background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.3)}
.btn-logout{font-size:0.75rem;font-weight:600;color:var(--t3);background:none;border:1px solid var(--b);border-radius:6px;padding:5px 12px;cursor:pointer;transition:all .15s}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

/* Grupos de KPIs */
.grupo{margin-bottom:24px}
.grupo-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.grupo-titulo{font-size:0.72rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1px}
.grupo-linea{flex:1;height:1px;background:var(--b)}

.kpi-grid{display:grid;gap:10px}
.kpi-grid-5{grid-template-columns:repeat(5,1fr)}
.kpi-grid-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:720px){.kpi-grid-5,.kpi-grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:400px){.kpi-grid-5,.kpi-grid-3{grid-template-columns:1fr}}

.kpi{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:16px 12px;text-align:center;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kpi-color, var(--b))}
.kpi-val{font-size:1.9rem;font-weight:800;color:var(--kpi-color, var(--acc2));line-height:1.1}
.kpi-label{font-size:0.66rem;color:var(--t3);margin-top:6px;text-transform:uppercase;letter-spacing:.5px}
.kpi-sub{font-size:0.7rem;color:var(--t3);margin-top:3px}

/* Panel doble */
.panel-grid{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:16px}
@media(max-width:640px){.panel-grid{grid-template-columns:1fr}}

.panel{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:20px}
.panel-titulo{font-size:0.82rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px;color:var(--text)}
.panel-titulo span.sub{font-size:0.72rem;color:var(--t3);font-weight:400;margin-left:auto}

/* Tabla */
table{width:100%;border-collapse:collapse;font-size:0.78rem}
thead th{padding:7px 10px;color:var(--t3);font-weight:600;text-align:left;border-bottom:1px solid var(--b);font-size:0.7rem;text-transform:uppercase;letter-spacing:.4px}
tbody td{padding:9px 10px;border-bottom:1px solid rgba(42,58,82,.4);color:var(--t2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(255,255,255,.02)}

/* Badges */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:0.68rem;font-weight:700}
.badge-green{background:rgba(16,185,129,.15);color:var(--green)}
.badge-yellow{background:rgba(245,158,11,.15);color:var(--yellow)}
.badge-blue{background:rgba(59,130,246,.15);color:var(--blue)}
.badge-red{background:rgba(239,68,68,.12);color:var(--red)}
.badge-purple{background:rgba(99,102,241,.15);color:var(--acc2)}
.badge-gray{background:rgba(100,116,139,.15);color:var(--t3)}

/* Panel charlas */
.charla-score{font-size:2.8rem;font-weight:800;text-align:center;padding:12px 0 4px;line-height:1}
.charla-sub{font-size:0.72rem;color:var(--t3);text-align:center;margin-bottom:18px}
.criterio-row{margin-bottom:10px}
.criterio-header{display:flex;justify-content:space-between;font-size:0.78rem;margin-bottom:5px}
.criterio-nombre{color:var(--t2)}.criterio-prom{color:var(--acc2);font-weight:700}
.barra-bg{background:var(--s2);border-radius:4px;height:7px}
.barra-fill{height:7px;border-radius:4px;transition:width .6s}

/* Panel satisfacción */
.sat-score{font-size:2.8rem;font-weight:800;text-align:center;padding:12px 0 4px;line-height:1}
.sat-sub{font-size:0.72rem;color:var(--t3);text-align:center;margin-bottom:8px}

/* Donut mini */
.donut-wrap{display:flex;justify-content:center;gap:20px;margin:14px 0}
.donut-item{text-align:center}
.donut-num{font-size:1.3rem;font-weight:800}
.donut-lbl{font-size:0.65rem;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}

/* Botón acción */
.btn-accion{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;background:var(--acc);color:#fff;font-weight:700;font-size:0.85rem;border-radius:10px;text-decoration:none;transition:opacity .15s}
.btn-accion:hover{opacity:.85}
</style>
<style id="ns-layout-pre">body{margin-left:240px!important}@media(max-width:780px){body{margin-left:0!important;padding-top:52px!important}}</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div style="font-size:1.4rem">🧠</div>
    <div class="topbar-titulo">Dashboard Psicopedagógico</div>
  </div>
  <div class="topbar-user" id="topbar-user"></div>
</div>

<!-- ══ GRUPO 1: Sesiones psicológicas ══ -->
<div class="grupo">
  <div class="grupo-header">
    <span class="grupo-titulo">📋 Sesiones psicológicas</span>
    <div class="grupo-linea"></div>
  </div>

  <!-- KPIs sesiones -->
  <div class="kpi-grid kpi-grid-5" id="kpisSesiones" style="margin-bottom:14px">
    <div class="kpi"><div class="kpi-val">…</div><div class="kpi-label">Cargando</div></div>
  </div>

  <!-- Tabla + satisfacción atenciones -->
  <div class="panel-grid">
    <div class="panel">
      <div class="panel-titulo">
        📋 Últimas sesiones
        <span class="sub">10 más recientes</span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Estudiante</th><th>Fecha</th><th>Sesión</th><th>Estado</th></tr></thead>
          <tbody id="tbodyRecientes">
            <tr><td colspan="4" style="text-align:center;color:var(--t3);padding:20px">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <div class="panel-titulo">⭐ Satisfacción — Sesiones</div>
      <div id="satPanel">
        <div style="text-align:center;color:var(--t3);padding:16px;font-size:0.82rem">Cargando...</div>
      </div>
    </div>
  </div>
</div>

<!-- ══ GRUPO 2: Charlas ══ -->
<div class="grupo">
  <div class="grupo-header">
    <span class="grupo-titulo">🎤 Charlas de salud</span>
    <div class="grupo-linea"></div>
  </div>

  <!-- KPIs charlas -->
  <div class="kpi-grid kpi-grid-3" id="kpisCharlas" style="margin-bottom:14px">
    <div class="kpi"><div class="kpi-val">…</div><div class="kpi-label">Cargando</div></div>
  </div>

  <!-- Detalle charlas -->
  <div class="panel" style="max-width:480px">
    <div class="panel-titulo">🎤 Evaluaciones de charlas</div>
    <div id="charlasPanel">
      <div style="text-align:center;color:var(--t3);padding:16px;font-size:0.82rem">Cargando...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/sidebar.js"></script>
<script>
const sb = supabase.createClient(
  'https://exjaxhrylfdwehzjfjut.supabase.co',
  'sb_publishable_EP2Y83o7nj7CGCUd0pH3VA_vSNkeg99'
);

function color(c) { return `style="--kpi-color:var(--${c})"` }

function badgeEstado(e) {
  const map = {
    'completada':   ['badge-green',  'Completada'],
    'no_asistio':   ['badge-red',    'No asistió'],
    'pendiente':    ['badge-blue',   'Pendiente'],
    'confirmada':   ['badge-purple', 'Confirmada'],
    'cancelada':    ['badge-yellow', 'Cancelada'],
    'reprogramada': ['badge-yellow', 'Reprogramada'],
  };
  const [cls, txt] = map[e] || ['badge-gray', e || '—'];
  return `<span class="badge ${cls}">${txt}</span>`;
}

function scoreColor(v) {
  return v >= 4 ? 'var(--green)' : v >= 3 ? 'var(--yellow)' : 'var(--red)';
}

async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/login'; return false; }
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal.currentLevel !== 'aal2') { await sb.auth.signOut(); window.location.href = '/login'; return false; }
  const r = await fetch('/api/staff-info', { headers: { 'Authorization': `Bearer ${session.access_token}` } });
  if (!r.ok) { window.location.href = '/login'; return false; }
  const info = await r.json();
  if (info.rol !== 'director' && info.modulos?.length > 0 && !info.modulos.includes('psico_dashboard')) {
    window.location.href = '/ejecutivo'; return false;
  }
  document.getElementById('topbar-user').innerHTML = `Bienvenido, <strong>${info.nombre}</strong> · <span style="color:var(--t3)">${info.rol}</span>`;
  return true;
}

async function cargarKpis() {
  try {
    const r = await fetch('/api/psicopedagogico?accion=kpis');
    const { reservas, charlas, eval_atenciones } = await r.json();

    // ── Cálculos sesiones ──
    const corte10    = new Date(); corte10.setDate(corte10.getDate() - 70);
    const completadas = reservas.filter(r => r.estado === 'completada');
    const ultimas10   = completadas.filter(r => new Date(r.fecha) >= corte10);
    const noAsistio   = reservas.filter(r => r.estado === 'no_asistio');
    const pendientes  = reservas.filter(r => r.estado === 'pendiente' || r.estado === 'confirmada');
    const canceladas  = reservas.filter(r => r.estado === 'cancelada');

    // ── Cálculos charlas ──
    const promCharla = charlas.length
      ? (charlas.reduce((s,c) => s+(c.p1+c.p2+c.p3)/3, 0) / charlas.length) : null;
    const promEval = eval_atenciones.length
      ? (eval_atenciones.reduce((s,e) => s+(e.p1+e.p2+e.p3)/3, 0) / eval_atenciones.length) : null;

    // ── KPIs sesiones ──
    document.getElementById('kpisSesiones').innerHTML = `
      <div class="kpi" ${color('green')}>
        <div class="kpi-val">${completadas.length}</div>
        <div class="kpi-label">Completadas</div>
      </div>
      <div class="kpi" ${color('blue')}>
        <div class="kpi-val">${ultimas10.length}</div>
        <div class="kpi-label">Últimas 10 sem.</div>
      </div>
      <div class="kpi" ${color('yellow')}>
        <div class="kpi-val">${pendientes.length}</div>
        <div class="kpi-label">Pendientes</div>
      </div>
      <div class="kpi" ${color('red')}>
        <div class="kpi-val">${noAsistio.length}</div>
        <div class="kpi-label">No asistió</div>
      </div>
      <div class="kpi" ${color('yellow')}>
        <div class="kpi-val">${canceladas.length}</div>
        <div class="kpi-label">Canceladas</div>
      </div>
      <div class="kpi">
        <div class="kpi-val">${reservas.filter(r=>r.estado==='reprogramada').length}</div>
        <div class="kpi-label">Reprogramadas</div>
      </div>
      <div class="kpi">
        <div class="kpi-val">${reservas.length}</div>
        <div class="kpi-label">Total registros</div>
      </div>
    `;

    // ── KPIs charlas ──
    document.getElementById('kpisCharlas').innerHTML = `
      <div class="kpi" ${color('acc2')}>
        <div class="kpi-val">${charlas.length}</div>
        <div class="kpi-label">Evaluaciones recibidas</div>
      </div>
    `;

    // ── Tabla últimas sesiones ──
    document.getElementById('tbodyRecientes').innerHTML = reservas.slice(0,10).map(a => `
      <tr>
        <td style="color:var(--text);font-weight:600">${a.nombre || a.codigo}</td>
        <td style="white-space:nowrap">${a.fecha || '—'}</td>
        <td style="color:var(--t3)">${a.n_sesion ? 'Nº '+a.n_sesion : '—'}</td>
        <td>${badgeEstado(a.estado)}</td>
      </tr>`).join('') ||
      `<tr><td colspan="4" style="text-align:center;color:var(--t3);padding:16px">Sin registros</td></tr>`;

    // ── Panel charlas ──
    if (!charlas.length) {
      document.getElementById('charlasPanel').innerHTML =
        '<div style="text-align:center;color:var(--t3);padding:14px;font-size:0.82rem">Sin evaluaciones aún</div>';
    } else {
      // Agrupar por charla (sesión / título) para separar métricas
      const grupos = {};
      charlas.forEach(c => {
        const key = (c.sesion_id != null && c.sesion_id !== '') ? 's'+c.sesion_id : 't:'+(c.titulo||'sin');
        if (!grupos[key]) grupos[key] = { titulo: c.titulo || 'Charla sin título', items: [] };
        grupos[key].items.push(c);
      });
      const lista = Object.values(grupos).sort((a,b) => b.items.length - a.items.length);
      document.getElementById('charlasPanel').innerHTML = lista.map(g => {
        const n = g.items.length;
        const p1 = g.items.reduce((s,c)=>s+c.p1,0)/n;
        const p2 = g.items.reduce((s,c)=>s+c.p2,0)/n;
        const p3 = g.items.reduce((s,c)=>s+c.p3,0)/n;
        const tot = (p1+p2+p3)/3;
        return `
          <div style="border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px">
              <div style="font-weight:700;font-size:0.9rem;color:var(--text)">${g.titulo}</div>
              <div style="font-weight:800;font-size:1.15rem;color:${scoreColor(tot)};white-space:nowrap">${tot.toFixed(2)}<span style="font-size:0.7rem;color:var(--t3)"> /5</span></div>
            </div>
            <div style="font-size:0.7rem;color:var(--t3);margin-bottom:10px">${n} evaluación${n>1?'es':''}</div>
            ${[['Relevancia',p1],['Claridad',p2],['Aplicabilidad',p3]].map(([nm,v])=>`
              <div class="criterio-row">
                <div class="criterio-header"><span class="criterio-nombre">${nm}</span><span class="criterio-prom">${v.toFixed(2)}</span></div>
                <div class="barra-bg"><div class="barra-fill" style="width:${(v/5)*100}%;background:${scoreColor(v)}"></div></div>
              </div>`).join('')}
          </div>`;
      }).join('');
    }

    // ── Panel satisfacción atenciones ──
    if (!eval_atenciones.length) {
      document.getElementById('satPanel').innerHTML =
        '<div style="text-align:center;color:var(--t3);padding:14px;font-size:0.82rem">Sin evaluaciones aún</div>';
    } else {
      const p1 = eval_atenciones.reduce((s,e)=>s+e.p1,0)/eval_atenciones.length;
      const p2 = eval_atenciones.reduce((s,e)=>s+e.p2,0)/eval_atenciones.length;
      const p3 = eval_atenciones.reduce((s,e)=>s+e.p3,0)/eval_atenciones.length;
      const tot = (p1+p2+p3)/3;
      document.getElementById('satPanel').innerHTML = `
        <div class="sat-score" style="color:${scoreColor(tot)}">${tot.toFixed(2)}<span style="font-size:1rem;color:var(--t3)"> / 5</span></div>
        <div class="sat-sub">${eval_atenciones.length} evaluaciones recibidas</div>
        ${[['Trato recibido',p1],['Utilidad',p2],['Recomendaría',p3]].map(([n,v])=>`
          <div class="criterio-row">
            <div class="criterio-header"><span class="criterio-nombre">${n}</span><span class="criterio-prom">${v.toFixed(2)}</span></div>
            <div class="barra-bg"><div class="barra-fill" style="width:${(v/5)*100}%;background:${scoreColor(v)}"></div></div>
          </div>`).join('')}`;
    }

  } catch(e) {
    document.getElementById('kpisSesiones').innerHTML =
      `<div style="color:var(--red);font-size:0.82rem;padding:12px">Error: ${e.message}</div>`;
  }
}

initAuth().then(ok => { if (ok) cargarKpis(); });
</script>
</body>
</html>
