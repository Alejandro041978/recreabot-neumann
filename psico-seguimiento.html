<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>Casos de Seguimiento — Psicopedagógico</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--s:#1a2235;--s2:#212d42;--b:#2a3a52;
  --acc:#6366f1;--acc2:#a5b4fc;--red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;--green:#10b981;
  --text:#e2e8f0;--t2:#94a3b8;--t3:#64748b;
}
html,body{min-height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
body{padding:20px 16px 60px;max-width:980px;margin:0 auto}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:10px 16px;background:var(--s);border:1px solid var(--b);border-radius:10px}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-icon{font-size:1.4rem}
.topbar-titulo{font-size:1rem;font-weight:800;color:var(--acc2)}
.topbar-user{font-size:0.78rem;color:var(--t2)}.topbar-user strong{color:var(--text)}

.seccion{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:20px;margin-bottom:16px}
.seccion-titulo{font-size:0.85rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.seccion-sub{font-size:0.72rem;color:var(--t3);font-weight:400}

.caso-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.caso-card{background:var(--s2);border:1.5px solid var(--b);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s}
.caso-card:hover{border-color:var(--acc)}
.caso-card.activo{border-color:var(--acc);background:rgba(99,102,241,.1)}
.caso-nombre{font-size:0.92rem;font-weight:700;color:var(--text);margin-bottom:4px}
.caso-meta{font-size:0.74rem;color:var(--t3)}
.caso-badge{display:inline-block;margin-top:8px;padding:2px 9px;border-radius:20px;font-size:0.68rem;font-weight:700;background:rgba(99,102,241,.15);color:var(--acc2)}

table{width:100%;border-collapse:collapse;font-size:0.78rem}
thead th{padding:8px 10px;color:var(--t3);font-weight:600;text-align:left;border-bottom:1px solid var(--b)}
tbody td{padding:9px 10px;border-bottom:1px solid rgba(42,58,82,.4);color:var(--t2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}

.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:0.7rem;font-weight:700}
.badge-green{background:rgba(16,185,129,.15);color:var(--green)}
.badge-yellow{background:rgba(245,158,11,.15);color:var(--yellow)}
.badge-red{background:rgba(239,68,68,.12);color:var(--red)}
.badge-purple{background:rgba(99,102,241,.15);color:var(--acc2)}
.badge-gray{background:rgba(148,163,184,.15);color:var(--t2)}

.form-field{margin-bottom:12px}
.form-field label{font-size:0.7rem;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
.form-field input,.form-field textarea{width:100%;background:var(--s2);border:1.5px solid var(--b);border-radius:7px;padding:9px 12px;color:var(--text);font-size:0.85rem;font-family:'Inter',sans-serif;outline:none}
.form-field input:focus,.form-field textarea:focus{border-color:var(--acc)}
.form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:560px){.form-row{grid-template-columns:1fr}}

.btn{padding:10px 18px;border-radius:8px;border:none;font-size:0.85rem;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:'Inter',sans-serif}
.btn-acc{background:var(--acc);color:#fff}.btn-acc:hover{opacity:.85}
.msg-ok{background:rgba(16,185,129,.12);border:1px solid var(--green);color:var(--green);padding:10px 14px;border-radius:8px;font-size:0.83rem;font-weight:600;margin-top:10px;display:none;text-align:center}
.msg-err{background:rgba(239,68,68,.12);border:1px solid var(--red);color:var(--red);padding:10px 14px;border-radius:8px;font-size:0.83rem;font-weight:600;margin-top:10px;display:none;text-align:center}
.empty{text-align:center;padding:26px;color:var(--t3);font-size:0.85rem}
</style>
<style id="ns-layout-pre">body{margin-left:240px!important}@media(max-width:780px){body{margin-left:0!important;padding-top:52px!important}}</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-icon">🔁</div>
    <div class="topbar-titulo">Casos de Seguimiento</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="topbar-user" id="topbar-user"></div>
  </div>
</div>

<!-- Lista de casos -->
<div class="seccion">
  <div class="seccion-titulo">
    <span>🔁 Estudiantes en seguimiento</span>
    <span class="seccion-sub" id="casos-sub"></span>
  </div>
  <div class="caso-grid" id="casosGrid">
    <div class="empty" style="grid-column:1/-1">Cargando...</div>
  </div>
</div>

<!-- Detalle del estudiante seleccionado -->
<div id="panelDetalle" style="display:none">
  <div class="seccion">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
      <div>
        <div id="detNombre" style="font-size:1.1rem;font-weight:800;color:var(--text)">—</div>
        <div id="detSub" style="font-size:0.78rem;color:var(--t3);margin-top:3px">—</div>
      </div>
      <button onclick="cerrarDetalle()" class="btn" style="background:none;color:var(--t3);border:1px solid var(--b);font-size:0.75rem;padding:5px 12px">✕ Cerrar</button>
    </div>

    <!-- Nueva cita -->
    <div style="background:var(--s2);border-radius:10px;padding:16px;margin-bottom:18px">
      <div style="font-size:0.82rem;font-weight:700;margin-bottom:12px;color:var(--acc2)">📅 Programar nueva cita</div>
      <div class="form-row">
        <div class="form-field" style="margin:0"><label>Fecha</label><input type="date" id="cFecha"></div>
        <div class="form-field" style="margin:0"><label>Hora inicio</label><input type="time" id="cInicio"></div>
        <div class="form-field" style="margin:0"><label>Hora fin</label><input type="time" id="cFin"></div>
      </div>
      <div class="form-field"><label>Motivo / nota (opcional)</label><input type="text" id="cMotivo" placeholder="Ej: seguimiento por ansiedad"></div>
      <button class="btn btn-acc" onclick="crearCita()">Crear cita</button>
      <div class="msg-ok" id="citaOk">✅ Cita creada</div>
      <div class="msg-err" id="citaErr"></div>
    </div>

    <!-- Historial de citas -->
    <div style="font-size:0.82rem;font-weight:700;margin-bottom:10px">🗂️ Historial de citas</div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Fecha</th><th>Horario</th><th>Estado</th><th>Motivo</th></tr></thead>
        <tbody id="tbodyHistorial"><tr><td colspan="4" class="empty">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/sidebar.js"></script>
<script>
const sb = supabase.createClient(
  'https://exjaxhrylfdwehzjfjut.supabase.co',
  'sb_publishable_EP2Y83o7nj7CGCUd0pH3VA_vSNkeg99'
);

const DIAS_ES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES_ES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
let estudianteSel = null;

function formatFecha(f) {
  if (!f) return '—';
  const [y,m,d] = f.split('-').map(Number);
  const fecha = new Date(y, m-1, d);
  return `${DIAS_ES[fecha.getDay()]} ${d} ${MESES_ES[m-1]} ${y}`;
}
function formatHora(t) {
  if (!t) return '—';
  const [h,min] = t.substring(0,5).split(':').map(Number);
  return `${h%12||12}:${String(min).padStart(2,'0')} ${h>=12?'pm':'am'}`;
}
function badgeEstado(e) {
  const map = { pendiente:['badge-yellow','Pendiente'], confirmada:['badge-green','Confirmada'],
    cancelada:['badge-red','Cancelada'], completada:['badge-purple','Completada'], no_asistio:['badge-gray','No asistió'] };
  const [c,t] = map[e] || ['','—'];
  return `<span class="badge ${c}">${t}</span>`;
}

async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/login'; return false; }
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal.currentLevel !== 'aal2') { await sb.auth.signOut(); window.location.href = '/login'; return false; }
  const r = await fetch('/api/staff-info', { headers: { 'Authorization': `Bearer ${session.access_token}` } });
  if (!r.ok) { window.location.href = '/login'; return false; }
  const info = await r.json();
  if (info.rol !== 'director' && info.modulos && info.modulos.length > 0 && !info.modulos.includes('psico_seguimiento')) {
    window.location.href = '/ejecutivo'; return false;
  }
  document.getElementById('topbar-user').innerHTML = `<strong>${info.nombre}</strong>`;
  return true;
}

async function cargarCasos() {
  try {
    const r = await fetch('/api/psico-reservas?accion=seguimiento-lista');
    const casos = await r.json();
    document.getElementById('casos-sub').textContent = casos.length ? `${casos.length} estudiante${casos.length>1?'s':''}` : '';
    const grid = document.getElementById('casosGrid');
    if (!casos.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Aún no hay estudiantes marcados como caso de seguimiento. Márcalos desde la ficha de una sesión.</div>';
      return;
    }
    grid.innerHTML = casos.map(c => `
      <div class="caso-card" data-cod="${c.codigo}" onclick='seleccionar(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
        <div class="caso-nombre">${c.nombre || c.codigo}</div>
        <div class="caso-meta">Código: ${c.codigo}</div>
        <div class="caso-meta">Última cita: ${formatFecha(c.ultima_fecha)}</div>
        <div class="caso-badge">${c.total_citas} cita${c.total_citas>1?'s':''}</div>
      </div>`).join('');
  } catch(e) {
    document.getElementById('casosGrid').innerHTML = `<div class="empty" style="grid-column:1/-1">Error: ${e.message}</div>`;
  }
}

async function seleccionar(caso) {
  estudianteSel = caso;
  document.querySelectorAll('.caso-card').forEach(c => c.classList.toggle('activo', c.dataset.cod === caso.codigo));
  document.getElementById('detNombre').textContent = caso.nombre || caso.codigo;
  document.getElementById('detSub').textContent = `Código: ${caso.codigo} · ${caso.total_citas} cita(s) registradas`;
  document.getElementById('cFecha').value = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Lima' });
  document.getElementById('cInicio').value = '';
  document.getElementById('cFin').value = '';
  document.getElementById('cMotivo').value = '';
  ['citaOk','citaErr'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('panelDetalle').style.display = 'block';
  document.getElementById('panelDetalle').scrollIntoView({ behavior:'smooth', block:'start' });
  await cargarHistorial(caso.codigo);
}

async function cargarHistorial(codigo) {
  const tbody = document.getElementById('tbodyHistorial');
  tbody.innerHTML = '<tr><td colspan="4" class="empty">Cargando...</td></tr>';
  try {
    const r = await fetch(`/api/psico-reservas?accion=historial&codigo=${encodeURIComponent(codigo)}`);
    const citas = await r.json();
    if (!citas.length) { tbody.innerHTML = '<tr><td colspan="4" class="empty">Sin citas</td></tr>'; return; }
    tbody.innerHTML = citas.map(c => `
      <tr>
        <td style="color:var(--text);font-weight:600">${formatFecha(c.fecha)}</td>
        <td>${formatHora(c.hora_inicio)} – ${formatHora(c.hora_fin)}</td>
        <td>${badgeEstado(c.estado)}</td>
        <td style="color:var(--t3)">${c.motivo_consulta || c.problema_hallado || '—'}</td>
      </tr>`).join('');
  } catch(e) {
    tbody.innerHTML = `<tr><td colspan="4" class="empty">Error al cargar</td></tr>`;
  }
}

async function crearCita() {
  if (!estudianteSel) return;
  const ok = document.getElementById('citaOk'), err = document.getElementById('citaErr');
  ok.style.display = 'none'; err.style.display = 'none';
  const fecha = document.getElementById('cFecha').value;
  const hora_inicio = document.getElementById('cInicio').value;
  const hora_fin = document.getElementById('cFin').value;
  if (!fecha || !hora_inicio || !hora_fin) { err.textContent = 'Completa fecha, hora inicio y hora fin'; err.style.display = 'block'; return; }
  if (hora_inicio >= hora_fin) { err.textContent = 'La hora de fin debe ser mayor que la de inicio'; err.style.display = 'block'; return; }
  try {
    const r = await fetch('/api/psico-reservas', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        accion: 'reservar-directa',
        codigo: estudianteSel.codigo,
        nombre: estudianteSel.nombre,
        fecha, hora_inicio, hora_fin,
        motivo_consulta: document.getElementById('cMotivo').value.trim() || null,
        seguimiento: true,
      }),
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'No se pudo crear la cita');
    ok.style.display = 'block'; setTimeout(() => ok.style.display = 'none', 3000);
    document.getElementById('cInicio').value = '';
    document.getElementById('cFin').value = '';
    document.getElementById('cMotivo').value = '';
    await cargarHistorial(estudianteSel.codigo);
    cargarCasos();
  } catch(e) { err.textContent = 'Error: ' + e.message; err.style.display = 'block'; }
}

function cerrarDetalle() {
  document.getElementById('panelDetalle').style.display = 'none';
  estudianteSel = null;
  document.querySelectorAll('.caso-card').forEach(c => c.classList.remove('activo'));
}

initAuth().then(ok => { if (ok) cargarCasos(); });
</script>
</body>
</html>
