<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Mes Calidad — Instituto Neumann</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--s:#1a2235;--s2:#212d42;--b:#2a3a52;
  --acc:#6366f1;--acc2:#a5b4fc;--red:#ef4444;--green:#10b981;--yellow:#f59e0b;
  --text:#e2e8f0;--t2:#94a3b8;--t3:#64748b;
}
html,body{min-height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
body{padding:20px 16px 60px;max-width:1100px;margin:0 auto}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:10px 16px;background:var(--s);border:1px solid var(--b);border-radius:10px}
.topbar-titulo{font-size:1rem;font-weight:800;color:var(--acc2)}
.topbar-user{font-size:0.78rem;color:var(--t2)}.topbar-user strong{color:var(--text)}
.btn-link{font-size:0.75rem;font-weight:600;color:var(--t3);border:1px solid var(--b);border-radius:6px;padding:5px 12px;text-decoration:none;transition:all .15s}
.btn-link:hover{border-color:var(--acc);color:var(--acc2)}
.btn-logout{font-size:0.75rem;font-weight:600;color:var(--t3);background:none;border:1px solid var(--b);border-radius:6px;padding:5px 12px;cursor:pointer}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.toolbar label{font-size:0.75rem;color:var(--t3);font-weight:600}
.toolbar select{background:var(--s);border:1.5px solid var(--b);border-radius:8px;padding:8px 12px;color:var(--text);font-size:0.83rem;font-family:'Inter',sans-serif;outline:none;min-width:260px}
.toolbar select:focus{border-color:var(--acc)}
.btn-refresh{padding:8px 14px;border-radius:8px;border:1.5px solid var(--b);background:var(--s2);color:var(--t2);font-size:0.8rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.btn-refresh:hover{border-color:var(--acc);color:var(--acc2)}

.periodo-info{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;display:none}
.periodo-info .pi-label{font-size:0.72rem;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.periodo-info .pi-val{font-size:0.9rem;font-weight:700;color:var(--text)}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:0.7rem;font-weight:700}
.badge-green{background:rgba(16,185,129,.15);color:var(--green)}
.badge-gray{background:rgba(42,58,82,.6);color:var(--t3)}

.resumen-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:16px 18px;text-align:center}
.stat-num{font-size:2rem;font-weight:800;margin-bottom:4px}
.stat-label{font-size:0.72rem;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat-green{color:var(--green)}.stat-red{color:var(--red)}.stat-yellow{color:var(--yellow)}.stat-acc{color:var(--acc2)}

.workers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}

.worker-card{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:22px;transition:border-color .2s}
.worker-card.con-bono{border-color:rgba(16,185,129,.4);background:linear-gradient(135deg,#1a2235 0%,rgba(16,185,129,.04) 100%)}
.worker-card.sin-bono{border-color:rgba(239,68,68,.2)}
.worker-card.pendiente{border-color:rgba(245,158,11,.2)}

.worker-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.worker-nombre{font-size:1rem;font-weight:800;color:var(--text)}
.worker-rol{font-size:0.75rem;color:var(--t3);margin-top:2px}
.bono-badge{padding:6px 14px;border-radius:20px;font-size:0.78rem;font-weight:800;text-align:center;white-space:nowrap}
.bono-verde{background:rgba(16,185,129,.18);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.bono-rojo{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.bono-gris{background:rgba(245,158,11,.12);color:var(--yellow);border:1px solid rgba(245,158,11,.25)}

.progress-global{margin-bottom:16px}
.progress-label{display:flex;justify-content:space-between;font-size:0.72rem;color:var(--t3);margin-bottom:4px}
.progress-bar{height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .4s}
.fill-green{background:var(--green)}.fill-red{background:var(--red)}.fill-yellow{background:var(--yellow)}

.kpis-list{display:flex;flex-direction:column;gap:8px}
.kpi-row{background:var(--s2);border-radius:10px;padding:12px 14px;border:1px solid var(--b)}
.kpi-row.cumple{border-color:rgba(16,185,129,.25)}
.kpi-row.no-cumple{border-color:rgba(239,68,68,.2)}
.kpi-row.pendiente-manual{border-color:rgba(245,158,11,.2)}

.kpi-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.kpi-nombre{font-size:0.8rem;font-weight:700;color:var(--text)}
.kpi-estado{font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:10px}
.estado-ok{background:rgba(16,185,129,.15);color:var(--green)}
.estado-fail{background:rgba(239,68,68,.12);color:var(--red)}
.estado-pend{background:rgba(245,158,11,.12);color:var(--yellow)}

.kpi-vals{display:flex;align-items:center;gap:12px;font-size:0.78rem;color:var(--t3)}
.kpi-val-actual{font-size:1.05rem;font-weight:800;color:var(--text)}
.kpi-val-actual.ok{color:var(--green)}
.kpi-val-actual.fail{color:var(--red)}
.kpi-val-sep{color:var(--t3);font-size:0.7rem}
.kpi-meta{color:var(--t3)}

.kpi-bar{height:4px;background:var(--b);border-radius:2px;overflow:hidden;margin-top:6px}
.kpi-bar-fill{height:100%;border-radius:2px}

.manual-input-wrap{margin-top:8px;display:flex;gap:8px;align-items:center}
.manual-input{background:var(--s);border:1.5px solid var(--b);border-radius:6px;padding:5px 8px;color:var(--text);font-size:0.82rem;font-family:'Inter',sans-serif;outline:none;width:100px}
.manual-input:focus{border-color:var(--acc)}
.btn-manual-save{padding:5px 10px;border-radius:6px;border:none;background:var(--acc);color:#fff;font-size:0.75rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.btn-manual-save:hover{opacity:.85}
.manual-saved{font-size:0.72rem;color:var(--green);display:none}

.empty-state{text-align:center;padding:60px 20px;color:var(--t3)}
.empty-icon{font-size:3rem;margin-bottom:12px}
.empty-title{font-size:1rem;font-weight:700;color:var(--t2);margin-bottom:6px}
.empty-sub{font-size:0.83rem}

.loading{text-align:center;padding:60px;color:var(--t3);font-size:0.88rem}
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="font-size:1.4rem">📊</div>
    <div class="topbar-titulo">Dashboard Mes Calidad</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="topbar-user" id="topbar-user"></div>
    <a href="/calidad-config" class="btn-link">⚙️ Configurar</a>
    <a href="/ejecutivo" class="btn-link">← Volver</a>
    <button class="btn-logout" id="btnLogout">Cerrar sesión</button>
  </div>
</div>

<div class="toolbar">
  <label>Periodo:</label>
  <select id="selectPeriodo" onchange="cargarDashboard()">
    <option value="">Selecciona un periodo...</option>
  </select>
  <button class="btn-refresh" onclick="cargarDashboard()">↻ Actualizar</button>
</div>

<div class="periodo-info" id="periodoInfo">
  <div>
    <div class="pi-label">Periodo</div>
    <div class="pi-val" id="piNombre">—</div>
  </div>
  <div>
    <div class="pi-label">Inicio</div>
    <div class="pi-val" id="piFechaInicio">—</div>
  </div>
  <div>
    <div class="pi-label">Fin</div>
    <div class="pi-val" id="piFechaFin">—</div>
  </div>
  <div>
    <div class="pi-label">Estado</div>
    <div class="pi-val" id="piEstado">—</div>
  </div>
</div>

<div id="resumenRow" class="resumen-row" style="display:none"></div>

<div id="mainContent">
  <div class="empty-state">
    <div class="empty-icon">📅</div>
    <div class="empty-title">Selecciona un periodo</div>
    <div class="empty-sub">Elige un periodo de calidad para ver el desempeño de los trabajadores</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient(
  'https://exjaxhrylfdwehzjfjut.supabase.co',
  'sb_publishable_EP2Y83o7nj7CGCUd0pH3VA_vSNkeg99'
);

let token = null;
let dashData = null;

function fmtFecha(d) {
  if (!d) return '—';
  const [y,m,dd] = d.split('-');
  return `${dd}/${m}/${y}`;
}

function pct(v, meta) {
  if (v === null || v === undefined || meta === 0) return 0;
  return Math.min(100, Math.round((v / meta) * 100));
}

async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/login'; return; }
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal.currentLevel !== 'aal2') { await sb.auth.signOut(); window.location.href = '/login'; return; }
  token = session.access_token;
  const r = await fetch('/api/staff-info', { headers: { 'Authorization': `Bearer ${token}` } });
  if (!r.ok) { window.location.href = '/login'; return; }
  const info = await r.json();
  if (info.rol !== 'director') { window.location.href = '/ejecutivo'; return; }
  document.getElementById('topbar-user').innerHTML = `<strong>${info.nombre}</strong>`;
  document.getElementById('btnLogout').addEventListener('click', async () => { await sb.auth.signOut(); window.location.href = '/login'; });
  await cargarPeriodos();
}

async function cargarPeriodos() {
  const r = await fetch('/api/calidad?accion=periodos', { headers: { 'Authorization': `Bearer ${token}` } });
  const periodos = await r.json();
  const sel = document.getElementById('selectPeriodo');
  sel.innerHTML = '<option value="">Selecciona un periodo...</option>' +
    periodos.map(p => `<option value="${p.id}"${p.activo?' selected':''}>${p.nombre} ${p.activo?'· Activo':''}</option>`).join('');
  // Auto-load active period
  const activo = periodos.find(p => p.activo);
  if (activo) { sel.value = activo.id; cargarDashboard(); }
}

async function cargarDashboard() {
  const periodoId = document.getElementById('selectPeriodo').value;
  if (!periodoId) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📅</div>
        <div class="empty-title">Selecciona un periodo</div>
        <div class="empty-sub">Elige un periodo de calidad para ver el desempeño de los trabajadores</div>
      </div>`;
    document.getElementById('periodoInfo').style.display = 'none';
    document.getElementById('resumenRow').style.display = 'none';
    return;
  }
  document.getElementById('mainContent').innerHTML = '<div class="loading">Calculando KPIs...</div>';
  const r = await fetch(`/api/calidad?accion=dashboard&periodo_id=${periodoId}`, {
    headers: { 'Authorization': `Bearer ${token}` },
  });
  dashData = await r.json();
  if (dashData.error) {
    document.getElementById('mainContent').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">${dashData.error}</div></div>`;
    return;
  }
  renderDashboard();
}

function renderDashboard() {
  const { periodo, trabajadores } = dashData;

  // Periodo info bar
  const pi = document.getElementById('periodoInfo');
  pi.style.display = 'flex';
  document.getElementById('piNombre').textContent = periodo.nombre;
  document.getElementById('piFechaInicio').textContent = fmtFecha(periodo.fecha_inicio);
  document.getElementById('piFechaFin').textContent = fmtFecha(periodo.fecha_fin);
  document.getElementById('piEstado').innerHTML = periodo.activo
    ? '<span class="badge badge-green">Activo</span>'
    : '<span class="badge badge-gray">Histórico</span>';

  // Stats summary
  const conBono = trabajadores.filter(t => t.con_bono).length;
  const sinBono = trabajadores.filter(t => !t.con_bono && !t.tiene_manuales_pendientes).length;
  const pendientes = trabajadores.filter(t => t.tiene_manuales_pendientes).length;
  const totalKpis = trabajadores.reduce((a, t) => a + t.total_kpis, 0);
  const kpisCumplidos = trabajadores.reduce((a, t) => a + t.kpis_cumplidos, 0);

  const resumen = document.getElementById('resumenRow');
  resumen.style.display = 'grid';
  resumen.innerHTML = `
    <div class="stat-card"><div class="stat-num stat-acc">${trabajadores.length}</div><div class="stat-label">Trabajadores</div></div>
    <div class="stat-card"><div class="stat-num stat-green">${conBono}</div><div class="stat-label">Con Bono ✅</div></div>
    <div class="stat-card"><div class="stat-num stat-red">${sinBono}</div><div class="stat-label">Sin Bono ✗</div></div>
    ${pendientes ? `<div class="stat-card"><div class="stat-num stat-yellow">${pendientes}</div><div class="stat-label">Pendiente manual</div></div>` : ''}
    <div class="stat-card"><div class="stat-num stat-acc">${totalKpis > 0 ? Math.round((kpisCumplidos/totalKpis)*100) : 0}%</div><div class="stat-label">KPIs cumplidos</div></div>
  `;

  if (!trabajadores.length) {
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🎯</div>
        <div class="empty-title">Sin KPIs configurados</div>
        <div class="empty-sub">Ve a <a href="/calidad-config" style="color:var(--acc2)">Configuración</a> para agregar KPIs a los trabajadores.</div>
      </div>`;
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'workers-grid';
  grid.innerHTML = trabajadores.map(t => renderWorkerCard(t)).join('');
  document.getElementById('mainContent').innerHTML = '';
  document.getElementById('mainContent').appendChild(grid);
}

function renderWorkerCard(t) {
  const { staff, kpis, con_bono, total_kpis, kpis_cumplidos, tiene_manuales_pendientes } = t;
  const pctGlobal = total_kpis > 0 ? Math.round((kpis_cumplidos / total_kpis) * 100) : 0;
  const cardClass = con_bono ? 'con-bono' : tiene_manuales_pendientes ? 'pendiente' : 'sin-bono';
  const bonoHtml = con_bono
    ? '<div class="bono-badge bono-verde">⭐ CON BONO</div>'
    : tiene_manuales_pendientes
      ? '<div class="bono-badge bono-gris">⏳ PENDIENTE</div>'
      : '<div class="bono-badge bono-rojo">✗ SIN BONO</div>';
  const fillClass = con_bono ? 'fill-green' : tiene_manuales_pendientes ? 'fill-yellow' : 'fill-red';

  const kpisHtml = kpis.map(k => {
    const esManual = k.fuente === 'manual';
    const pendManual = esManual && k.valor_obtenido === null;
    const rowClass = pendManual ? 'pendiente-manual' : k.cumple ? 'cumple' : 'no-cumple';
    const estadoHtml = pendManual
      ? '<span class="kpi-estado estado-pend">Pendiente</span>'
      : k.cumple
        ? '<span class="kpi-estado estado-ok">✓ Cumplido</span>'
        : '<span class="kpi-estado estado-fail">✗ No cumplido</span>';
    const valClass = pendManual ? '' : k.cumple ? 'ok' : 'fail';
    const valDisplay = k.valor_obtenido !== null ? k.valor_obtenido : '—';
    const pctKpi = pct(k.valor_obtenido, k.meta_valor);
    const barColor = pendManual ? 'background:var(--yellow)' : k.cumple ? 'background:var(--green)' : 'background:var(--red)';

    const manualHtml = esManual ? `
      <div class="manual-input-wrap">
        <input type="number" class="manual-input" id="manual_${staff.id}_${k.id}"
          value="${k.valor_obtenido !== null ? k.valor_obtenido : ''}"
          placeholder="Ingresar..." min="0" step="0.1">
        <button class="btn-manual-save" onclick="guardarManual(${staff.id},${k.id},'manual_${staff.id}_${k.id}','saved_${staff.id}_${k.id}')">Guardar</button>
        <span class="manual-saved" id="saved_${staff.id}_${k.id}">✓ Guardado</span>
      </div>` : '';

    return `
      <div class="kpi-row ${rowClass}">
        <div class="kpi-top">
          <div class="kpi-nombre">${k.nombre_kpi}</div>
          ${estadoHtml}
        </div>
        <div class="kpi-vals">
          <span class="kpi-val-actual ${valClass}">${valDisplay}${k.unidad?' '+k.unidad:''}</span>
          <span class="kpi-val-sep">de</span>
          <span class="kpi-meta">${k.meta_valor}${k.unidad?' '+k.unidad:''} mínimo</span>
        </div>
        ${!pendManual ? `<div class="kpi-bar"><div class="kpi-bar-fill" style="width:${pctKpi}%;${barColor}"></div></div>` : ''}
        ${manualHtml}
      </div>`;
  }).join('');

  return `
    <div class="worker-card ${cardClass}">
      <div class="worker-head">
        <div>
          <div class="worker-nombre">${staff.nombre}</div>
          <div class="worker-rol">${staff.rol || ''}</div>
        </div>
        ${bonoHtml}
      </div>
      <div class="progress-global">
        <div class="progress-label">
          <span>KPIs cumplidos</span>
          <span>${kpis_cumplidos} / ${total_kpis} (${pctGlobal}%)</span>
        </div>
        <div class="progress-bar"><div class="progress-fill ${fillClass}" style="width:${pctGlobal}%"></div></div>
      </div>
      <div class="kpis-list">${kpisHtml}</div>
    </div>`;
}

async function guardarManual(staffId, kpiId, inputId, savedId) {
  const periodoId = document.getElementById('selectPeriodo').value;
  const valor = document.getElementById(inputId).value;
  if (valor === '') return;
  const r = await fetch('/api/calidad', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
    body: JSON.stringify({ accion: 'valor-manual', periodo_id: periodoId, staff_id: staffId, kpi_id: kpiId, valor }),
  });
  const data = await r.json();
  if (data.ok) {
    const el = document.getElementById(savedId);
    el.style.display = 'inline';
    setTimeout(() => el.style.display = 'none', 2000);
    await cargarDashboard(); // refresh
  }
}

initAuth();
</script>
</body>
</html>
