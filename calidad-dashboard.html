<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Mes Calidad — Instituto Neumann</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--s:#1a2235;--s2:#212d42;--b:#2a3a52;
  --acc:#6366f1;--acc2:#a5b4fc;--red:#ef4444;--green:#10b981;--yellow:#f59e0b;
  --text:#e2e8f0;--t2:#94a3b8;--t3:#64748b;
}
html,body{min-height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
body{padding:20px 16px 60px;max-width:1100px;margin:0 auto}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:10px 16px;background:var(--s);border:1px solid var(--b);border-radius:10px}
.topbar-titulo{font-size:1rem;font-weight:800;color:var(--acc2)}
.topbar-user{font-size:0.78rem;color:var(--t2)}.topbar-user strong{color:var(--text)}
.btn-link{font-size:0.75rem;font-weight:600;color:var(--t3);border:1px solid var(--b);border-radius:6px;padding:5px 12px;text-decoration:none;transition:all .15s}
.btn-link:hover{border-color:var(--acc);color:var(--acc2)}
.btn-logout{font-size:0.75rem;font-weight:600;color:var(--t3);background:none;border:1px solid var(--b);border-radius:6px;padding:5px 12px;cursor:pointer}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.toolbar label{font-size:0.75rem;color:var(--t3);font-weight:600}
.toolbar select{background:var(--s);border:1.5px solid var(--b);border-radius:8px;padding:8px 12px;color:var(--text);font-size:0.83rem;font-family:'Inter',sans-serif;outline:none;min-width:260px}
.toolbar select:focus{border-color:var(--acc)}
.btn-refresh{padding:8px 14px;border-radius:8px;border:1.5px solid var(--b);background:var(--s2);color:var(--t2);font-size:0.8rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.btn-refresh:hover{border-color:var(--acc);color:var(--acc2)}
.btn-refresh.loading{opacity:.5;pointer-events:none}

.periodo-info{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:12px 16px;margin-bottom:20px;display:none;gap:20px;align-items:center;flex-wrap:wrap}
.pi-label{font-size:0.72rem;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.pi-val{font-size:0.9rem;font-weight:700;color:var(--text)}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:0.7rem;font-weight:700}
.badge-green{background:rgba(16,185,129,.15);color:var(--green)}
.badge-gray{background:rgba(42,58,82,.6);color:var(--t3)}

/* KPIs resumen */
.resumen-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;display:none}
.stat-card{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:16px 18px;text-align:center}
.stat-num{font-size:2rem;font-weight:800;margin-bottom:4px}
.stat-label{font-size:0.72rem;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat-green{color:var(--green)}.stat-red{color:var(--red)}.stat-yellow{color:var(--yellow)}.stat-acc{color:var(--acc2)}

/* Lista de trabajadores */
.workers-table{background:var(--s);border:1px solid var(--b);border-radius:16px;overflow:hidden}
.workers-table-header{display:grid;grid-template-columns:1fr 160px 120px 100px;padding:10px 20px;border-bottom:1px solid var(--b);font-size:0.72rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.worker-row{display:grid;grid-template-columns:1fr 160px 120px 100px;padding:14px 20px;border-bottom:1px solid rgba(42,58,82,.5);cursor:pointer;transition:background .15s;align-items:center}
.worker-row:last-child{border-bottom:none}
.worker-row:hover{background:rgba(99,102,241,.05)}
.worker-row.active{background:rgba(99,102,241,.1);border-left:3px solid var(--acc)}
.worker-nombre-col .nombre{font-size:0.88rem;font-weight:700;color:var(--text)}
.worker-nombre-col .rol{font-size:0.72rem;color:var(--t3);margin-top:2px}
.kpis-col{font-size:0.82rem;color:var(--t2)}
.kpis-col .pct{font-size:0.72rem;color:var(--t3);margin-top:2px}
.bono-badge{padding:4px 12px;border-radius:20px;font-size:0.72rem;font-weight:800;white-space:nowrap;display:inline-block}
.bono-verde{background:rgba(16,185,129,.18);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.bono-rojo{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25)}
.bono-gris{background:rgba(245,158,11,.12);color:var(--yellow);border:1px solid rgba(245,158,11,.25)}
.bono-pending{background:rgba(100,116,139,.15);color:var(--t3);border:1px solid var(--b)}
.updated-col{font-size:0.72rem;color:var(--t3)}

.progress-mini{height:4px;background:var(--b);border-radius:2px;overflow:hidden;margin-top:4px}
.progress-mini-fill{height:100%;border-radius:2px}

/* Panel de detalle */
.detalle-panel{background:var(--s2);border:1px solid var(--b);border-radius:16px;padding:24px;margin-top:16px;display:none}
.detalle-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.detalle-nombre{font-size:1.1rem;font-weight:800;color:var(--text)}
.detalle-rol{font-size:0.78rem;color:var(--t3);margin-top:3px}
.btn-cerrar{background:none;border:1px solid var(--b);border-radius:6px;color:var(--t3);font-size:0.75rem;font-weight:700;padding:5px 12px;cursor:pointer;font-family:'Inter',sans-serif}
.btn-cerrar:hover{border-color:var(--red);color:var(--red)}

.kpis-list{display:flex;flex-direction:column;gap:8px}
.kpi-row{background:var(--s);border-radius:10px;padding:12px 14px;border:1px solid var(--b)}
.kpi-row.cumple{border-color:rgba(16,185,129,.25)}
.kpi-row.no-cumple{border-color:rgba(239,68,68,.2)}
.kpi-row.pendiente-manual{border-color:rgba(245,158,11,.2)}
.kpi-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.kpi-nombre{font-size:0.8rem;font-weight:700;color:var(--text)}
.kpi-estado{font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:10px}
.estado-ok{background:rgba(16,185,129,.15);color:var(--green)}
.estado-fail{background:rgba(239,68,68,.12);color:var(--red)}
.estado-pend{background:rgba(245,158,11,.12);color:var(--yellow)}
.kpi-vals{display:flex;align-items:center;gap:12px;font-size:0.78rem;color:var(--t3)}
.kpi-val-actual{font-size:1.05rem;font-weight:800;color:var(--text)}
.kpi-val-actual.ok{color:var(--green)}.kpi-val-actual.fail{color:var(--red)}
.kpi-bar{height:4px;background:var(--b);border-radius:2px;overflow:hidden;margin-top:6px}
.kpi-bar-fill{height:100%;border-radius:2px}
.manual-input-wrap{margin-top:8px;display:flex;gap:8px;align-items:center}
.manual-input{background:var(--bg);border:1.5px solid var(--b);border-radius:6px;padding:5px 8px;color:var(--text);font-size:0.82rem;font-family:'Inter',sans-serif;outline:none;width:100px}
.manual-input:focus{border-color:var(--acc)}
.btn-manual-save{padding:5px 10px;border-radius:6px;border:none;background:var(--acc);color:#fff;font-size:0.75rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.btn-manual-save:hover{opacity:.85}
.manual-saved{font-size:0.72rem;color:var(--green);display:none}

.detalle-loading{text-align:center;padding:40px;color:var(--t3);font-size:0.85rem}
.detalle-updated{font-size:0.72rem;color:var(--t3);margin-bottom:16px}

.empty-state{text-align:center;padding:60px 20px;color:var(--t3)}
.empty-icon{font-size:3rem;margin-bottom:12px}
.empty-title{font-size:1rem;font-weight:700;color:var(--t2);margin-bottom:6px}
.empty-sub{font-size:0.83rem}
.loading{text-align:center;padding:60px;color:var(--t3);font-size:0.88rem}

.cron-bar{display:flex;align-items:center;gap:10px;background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.2);border-radius:8px;padding:8px 14px;margin-bottom:16px;font-size:0.78rem;color:var(--t3);display:none}
.cron-bar span{flex:1}
.btn-recalcular{padding:5px 12px;border-radius:6px;border:1px solid var(--acc);background:none;color:var(--acc2);font-size:0.75rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.btn-recalcular:hover{background:rgba(99,102,241,.1)}
</style>
<style id="ns-layout-pre">body{margin-left:240px!important}@media(max-width:780px){body{margin-left:0!important;padding-top:52px!important}}</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="font-size:1.4rem">⭐</div>
    <div class="topbar-titulo">Dashboard Mes Calidad</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="topbar-user" id="topbar-user"></div>
    <a href="/calidad-config" class="btn-link">⚙️ Configurar</a>
  </div>
</div>

<div class="toolbar">
  <label>Periodo:</label>
  <select id="selectPeriodo" onchange="cargarDashboard()">
    <option value="">Selecciona un periodo...</option>
  </select>
  <button class="btn-refresh" id="btnRefresh" onclick="cargarDashboard()">↻ Actualizar</button>
</div>

<div class="periodo-info" id="periodoInfo">
  <div><div class="pi-label">Periodo</div><div class="pi-val" id="piNombre">—</div></div>
  <div><div class="pi-label">Inicio</div><div class="pi-val" id="piFechaInicio">—</div></div>
  <div><div class="pi-label">Fin</div><div class="pi-val" id="piFechaFin">—</div></div>
  <div><div class="pi-label">Estado</div><div class="pi-val" id="piEstado">—</div></div>
</div>

<div id="cronBar" class="cron-bar">
  <span id="cronMsg"></span>
  <button class="btn-recalcular" onclick="recalcularAhora()">↻ Recalcular ahora</button>
</div>

<div id="resumenRow" class="resumen-row"></div>

<div id="mainContent">
  <div class="empty-state">
    <div class="empty-icon">📅</div>
    <div class="empty-title">Selecciona un periodo</div>
    <div class="empty-sub">Elige un periodo de calidad para ver el desempeño del equipo</div>
  </div>
</div>

<div class="detalle-panel" id="detallePanel">
  <div class="detalle-header">
    <div>
      <div class="detalle-nombre" id="detalleNombre">—</div>
      <div class="detalle-rol" id="detalleRol">—</div>
    </div>
    <button class="btn-cerrar" onclick="cerrarDetalle()">✕ Cerrar</button>
  </div>
  <div class="detalle-updated" id="detalleUpdated"></div>
  <div class="kpis-list" id="detalleKpis">
    <div class="detalle-loading">Calculando KPIs en tiempo real…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/sidebar.js"></script>
<script>
const sb = supabase.createClient(
  'https://exjaxhrylfdwehzjfjut.supabase.co',
  'sb_publishable_EP2Y83o7nj7CGCUd0pH3VA_vSNkeg99'
);

let token = null;
  // Mantener el token de sesion fresco cuando Supabase lo renueva (evita 'Sesion invalida' en formularios largos)
  sb.auth.onAuthStateChange((_e, s) => { if (s && s.access_token) token = s.access_token; });
let periodoActual = null;
let staffDetalleActual = null;

function fmtFecha(d) {
  if (!d) return '—';
  const [y,m,dd] = d.split('-');
  return `${dd}/${m}/${y}`;
}

function fmtTs(ts) {
  if (!ts) return 'nunca';
  const d = new Date(ts);
  return d.toLocaleDateString('es-PE', { day:'2-digit', month:'short', year:'numeric' }) +
    ' ' + d.toLocaleTimeString('es-PE', { hour:'2-digit', minute:'2-digit' });
}

function pct(v, meta) {
  if (v === null || v === undefined || !meta) return 0;
  return Math.min(100, Math.round((v / meta) * 100));
}

async function getToken() {
  const { data: { session } } = await sb.auth.getSession();
  token = session?.access_token || token;
  return token;
}

async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/login'; return; }
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal.currentLevel !== 'aal2') { await sb.auth.signOut(); window.location.href = '/login'; return; }
  token = session.access_token;
  const r = await fetch('/api/staff-info', { headers: { 'Authorization': `Bearer ${await getToken()}` } });
  if (!r.ok) { window.location.href = '/login'; return; }
  const info = await r.json();
  if (info.rol !== 'director' && info.modulos && info.modulos.length > 0 && !info.modulos.includes('calidad_dashboard')) { window.location.href = '/ejecutivo'; return; }
  document.getElementById('topbar-user').innerHTML = `<strong>${info.nombre}</strong>`;
  await cargarPeriodos();
}

async function cargarPeriodos() {
  const r = await fetch('/api/calidad?accion=periodos', { headers: { 'Authorization': `Bearer ${await getToken()}` } });
  const periodos = await r.json();
  const sel = document.getElementById('selectPeriodo');
  sel.innerHTML = '<option value="">Selecciona un periodo...</option>' +
    periodos.map(p => `<option value="${p.id}"${p.activo?' selected':''}>${p.nombre}${p.activo?' · Activo':''}</option>`).join('');
  const activo = periodos.find(p => p.activo);
  if (activo) { sel.value = activo.id; cargarDashboard(); }
}

async function cargarDashboard() {
  const periodoId = document.getElementById('selectPeriodo').value;
  cerrarDetalle();
  if (!periodoId) {
    document.getElementById('periodoInfo').style.display = 'none';
    document.getElementById('resumenRow').style.display = 'none';
    document.getElementById('cronBar').style.display = 'none';
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📅</div>
        <div class="empty-title">Selecciona un periodo</div>
        <div class="empty-sub">Elige un periodo de calidad para ver el desempeño del equipo</div>
      </div>`;
    return;
  }

  document.getElementById('mainContent').innerHTML = '<div class="loading">Cargando…</div>';
  const btn = document.getElementById('btnRefresh');
  btn.classList.add('loading');

  const [periodoRes, resumenRes] = await Promise.all([
    fetch(`/api/calidad?accion=periodos`, { headers: { 'Authorization': `Bearer ${await getToken()}` } }),
    fetch(`/api/calidad?accion=resumen&periodo_id=${periodoId}`, { headers: { 'Authorization': `Bearer ${await getToken()}` } }),
  ]);

  const periodos = await periodoRes.json();
  const resumen  = await resumenRes.json();
  btn.classList.remove('loading');

  periodoActual = periodos.find(p => p.id == periodoId);
  if (!periodoActual) return;

  // Periodo info
  const pi = document.getElementById('periodoInfo');
  pi.style.display = 'flex';
  document.getElementById('piNombre').textContent = periodoActual.nombre;
  document.getElementById('piFechaInicio').textContent = fmtFecha(periodoActual.fecha_inicio);
  document.getElementById('piFechaFin').textContent = fmtFecha(periodoActual.fecha_fin);
  document.getElementById('piEstado').innerHTML = periodoActual.activo
    ? '<span class="badge badge-green">Activo</span>'
    : '<span class="badge badge-gray">Histórico</span>';

  if (!resumen.length) {
    document.getElementById('resumenRow').style.display = 'none';
    document.getElementById('cronBar').style.display = 'none';
    document.getElementById('mainContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🎯</div>
        <div class="empty-title">Sin datos aún</div>
        <div class="empty-sub">El cron corre cada noche a las 2am. Puedes forzar el cálculo con el botón de abajo o <a href="/calidad-config" style="color:var(--acc2)">configura KPIs</a> primero.</div>
      </div>`;
    if (periodoActual.activo) {
      const cb = document.getElementById('cronBar');
      cb.style.display = 'flex';
      document.getElementById('cronMsg').textContent = 'Sin datos calculados aún para este periodo.';
    }
    return;
  }

  // Stats resumen
  const conBono  = resumen.filter(r => r.tiene_bono).length;
  const sinBono  = resumen.filter(r => !r.tiene_bono).length;
  const totalKpis = resumen.reduce((a, r) => a + r.kpis_total, 0);
  const kpisCump  = resumen.reduce((a, r) => a + r.kpis_cumplidos, 0);
  const pctGlobal = totalKpis > 0 ? Math.round((kpisCump / totalKpis) * 100) : 0;

  const rr = document.getElementById('resumenRow');
  rr.style.display = 'grid';
  rr.innerHTML = `
    <div class="stat-card"><div class="stat-num stat-acc">${resumen.length}</div><div class="stat-label">Trabajadores</div></div>
    <div class="stat-card"><div class="stat-num stat-green">${conBono}</div><div class="stat-label">Con Bono ✅</div></div>
    <div class="stat-card"><div class="stat-num stat-red">${sinBono}</div><div class="stat-label">Sin Bono ✗</div></div>
    <div class="stat-card"><div class="stat-num stat-acc">${pctGlobal}%</div><div class="stat-label">KPIs cumplidos</div></div>
  `;

  // Última actualización del cron
  const ultimaAct = resumen.reduce((a, r) => r.updated_at > a ? r.updated_at : a, '');
  const cb = document.getElementById('cronBar');
  if (periodoActual.activo) {
    cb.style.display = 'flex';
    document.getElementById('cronMsg').textContent = `Última actualización automática: ${fmtTs(ultimaAct)}`;
  } else {
    cb.style.display = 'none';
  }

  // Lista de trabajadores
  document.getElementById('mainContent').innerHTML = `
    <div class="workers-table">
      <div class="workers-table-header">
        <div>Trabajador</div>
        <div>KPIs cumplidos</div>
        <div>Bono</div>
        <div>Actualizado</div>
      </div>
      ${resumen.map(r => {
        const nombre = r.staff?.nombre || '—';
        const rol    = r.staff?.roles?.nombre || '';
        const pctW   = r.kpis_total > 0 ? Math.round((r.kpis_cumplidos / r.kpis_total) * 100) : 0;
        const fillColor = r.tiene_bono ? 'var(--green)' : 'var(--red)';
        const bonoHtml  = r.tiene_bono
          ? '<span class="bono-badge bono-verde">⭐ CON BONO</span>'
          : '<span class="bono-badge bono-rojo">✗ SIN BONO</span>';
        const updated = r.updated_at ? fmtTs(r.updated_at).split(' ')[0] : '—';
        return `
          <div class="worker-row" id="row_${r.staff_id}" onclick="verDetalle(${r.staff_id}, '${nombre}', '${rol}', '${r.updated_at||''}')">
            <div class="worker-nombre-col">
              <div class="nombre">${nombre}</div>
              <div class="rol">${rol}</div>
            </div>
            <div class="kpis-col">
              ${r.kpis_cumplidos} / ${r.kpis_total}
              <div class="progress-mini"><div class="progress-mini-fill" style="width:${pctW}%;background:${fillColor}"></div></div>
              <div class="pct">${pctW}%</div>
            </div>
            <div>${bonoHtml}</div>
            <div class="updated-col">${updated}</div>
          </div>`;
      }).join('')}
    </div>`;
}

async function verDetalle(staffId, nombre, rol, updatedAt) {
  // Marcar fila activa
  document.querySelectorAll('.worker-row').forEach(r => r.classList.remove('active'));
  document.getElementById(`row_${staffId}`)?.classList.add('active');

  staffDetalleActual = staffId;

  // Mostrar panel con loading
  const panel = document.getElementById('detallePanel');
  panel.style.display = 'block';
  document.getElementById('detalleNombre').textContent = nombre;
  document.getElementById('detalleRol').textContent = rol;
  document.getElementById('detalleUpdated').textContent = updatedAt
    ? `Resumen calculado el ${fmtTs(updatedAt)} · Detalle en tiempo real`
    : 'Detalle en tiempo real';
  document.getElementById('detalleKpis').innerHTML = '<div class="detalle-loading">Calculando KPIs en tiempo real…</div>';
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  const periodoId = document.getElementById('selectPeriodo').value;
  const r = await fetch(`/api/calidad?accion=detalle&periodo_id=${periodoId}&staff_id=${staffId}`, {
    headers: { 'Authorization': `Bearer ${await getToken()}` },
  });
  const data = await r.json();
  if (data.error) {
    document.getElementById('detalleKpis').innerHTML = `<div class="detalle-loading">Error: ${data.error}</div>`;
    return;
  }
  renderDetalle(data);
}

function renderDetalle({ kpis }) {
  if (!kpis?.length) {
    document.getElementById('detalleKpis').innerHTML = '<div class="detalle-loading">Sin KPIs configurados para este trabajador.</div>';
    return;
  }
  const periodoId = document.getElementById('selectPeriodo').value;
  document.getElementById('detalleKpis').innerHTML = kpis.map(k => {
    const esManual = k.fuente === 'manual';
    const pendManual = esManual && k.valor_obtenido === null;
    const rowClass = pendManual ? 'pendiente-manual' : k.cumple ? 'cumple' : 'no-cumple';
    const estadoHtml = pendManual
      ? '<span class="kpi-estado estado-pend">Pendiente</span>'
      : k.cumple
        ? '<span class="kpi-estado estado-ok">✓ Cumplido</span>'
        : '<span class="kpi-estado estado-fail">✗ No cumplido</span>';
    const valClass = pendManual ? '' : k.cumple ? 'ok' : 'fail';
    const valDisplay = k.valor_obtenido !== null ? k.valor_obtenido : '—';
    const pctK = pct(k.valor_obtenido, k.meta_valor);
    const barColor = pendManual ? 'var(--yellow)' : k.cumple ? 'var(--green)' : 'var(--red)';
    const manualHtml = esManual ? `
      <div class="manual-input-wrap">
        <input type="number" class="manual-input" id="manual_${k.id}"
          value="${k.valor_obtenido !== null ? k.valor_obtenido : ''}"
          placeholder="Ingresar..." min="0" step="0.1">
        <button class="btn-manual-save" onclick="guardarManual(${periodoId},${staffDetalleActual},${k.id})">Guardar</button>
        <span class="manual-saved" id="saved_${k.id}">✓ Guardado</span>
      </div>` : '';
    return `
      <div class="kpi-row ${rowClass}">
        <div class="kpi-top">
          <div class="kpi-nombre">${k.nombre_kpi}</div>
          ${estadoHtml}
        </div>
        <div class="kpi-vals">
          <span class="kpi-val-actual ${valClass}">${valDisplay}${k.unidad?' '+k.unidad:''}</span>
          <span style="color:var(--t3);font-size:0.7rem">de</span>
          <span style="color:var(--t3);font-size:0.78rem">${k.meta_valor}${k.unidad?' '+k.unidad:''} mínimo</span>
        </div>
        ${!pendManual ? `<div class="kpi-bar"><div class="kpi-bar-fill" style="width:${pctK}%;background:${barColor}"></div></div>` : ''}
        ${manualHtml}
      </div>`;
  }).join('');
}

async function guardarManual(periodoId, staffId, kpiId) {
  const valor = document.getElementById(`manual_${kpiId}`).value;
  if (valor === '') return;
  const r = await fetch('/api/calidad', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${await getToken()}` },
    body: JSON.stringify({ accion: 'valor-manual', periodo_id: periodoId, staff_id: staffId, kpi_id: kpiId, valor }),
  });
  const data = await r.json();
  if (data.ok) {
    const el = document.getElementById(`saved_${kpiId}`);
    el.style.display = 'inline';
    setTimeout(() => el.style.display = 'none', 2000);
    verDetalle(staffId, document.getElementById('detalleNombre').textContent,
      document.getElementById('detalleRol').textContent, '');
  }
}

async function recalcularAhora() {
  const btn = document.querySelector('.btn-recalcular');
  btn.textContent = 'Calculando…';
  btn.disabled = true;
  try {
    const r = await fetch(`/api/calidad-cron?secret=${encodeURIComponent('recreabot-neumann-2026')}`);
    const data = await r.json();
    if (data.ok) {
      await cargarDashboard();
    }
  } finally {
    btn.textContent = '↻ Recalcular ahora';
    btn.disabled = false;
  }
}

function cerrarDetalle() {
  document.getElementById('detallePanel').style.display = 'none';
  document.querySelectorAll('.worker-row').forEach(r => r.classList.remove('active'));
  staffDetalleActual = null;
}

initAuth();
</script>
</body>
</html>
