<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>Supervisión de Cafetería — Instituto Neumann</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--s:#1a2235;--s2:#212d42;--b:#2a3a52;
  --acc:#f59e0b;--acc2:#fbbf24;--red:#ef4444;--green:#10b981;--yellow:#f59e0b;
  --text:#e2e8f0;--t2:#94a3b8;--t3:#64748b;
}
html,body{min-height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
body{padding:20px 16px 60px;max-width:820px;margin:0 auto}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:10px 16px;background:var(--s);border:1px solid var(--b);border-radius:10px}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-icon{font-size:1.4rem}
.topbar-titulo{font-size:1rem;font-weight:800;color:var(--acc2)}
.topbar-user{font-size:0.78rem;color:var(--t2)}.topbar-user strong{color:var(--text)}

.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:20px;margin-bottom:16px}
.dim-titulo{font-size:0.85rem;font-weight:700;color:var(--acc2);margin-bottom:14px;display:flex;align-items:center;gap:8px}

.item{padding:12px 0;border-bottom:1px solid rgba(42,58,82,.5)}
.item:last-child{border-bottom:none}
.item-txt{font-size:0.86rem;color:var(--text);margin-bottom:9px;line-height:1.45}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:96px}
.opt input{display:none}
.opt label{display:block;text-align:center;padding:7px 8px;border:1.5px solid var(--b);border-radius:8px;font-size:0.78rem;font-weight:600;color:var(--t2);cursor:pointer;transition:all .12s;background:var(--s2)}
.opt input:checked + label{border-color:var(--acc);color:#fff}
.opt.v2 input:checked + label{background:rgba(16,185,129,.25);border-color:var(--green);color:#6ee7b7}
.opt.v1 input:checked + label{background:rgba(245,158,11,.25);border-color:var(--yellow);color:#fcd34d}
.opt.v0 input:checked + label{background:rgba(239,68,68,.2);border-color:var(--red);color:#fca5a5}

.obs{width:100%;background:var(--s2);border:1.5px solid var(--b);border-radius:8px;padding:9px 12px;color:var(--text);font-size:0.83rem;font-family:'Inter',sans-serif;outline:none;margin-top:12px;resize:vertical}
.obs:focus{border-color:var(--acc)}

.plazo{background:rgba(245,158,11,.12);border:1px solid var(--acc);color:var(--acc2);padding:10px 14px;border-radius:8px;font-size:0.82rem;font-weight:600;margin-bottom:16px;text-align:center}
.btn{padding:12px 22px;border-radius:9px;border:none;font-size:0.9rem;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:'Inter',sans-serif}
.btn-acc{background:var(--acc);color:#111}.btn-acc:hover{opacity:.88}

.msg-ok{background:rgba(16,185,129,.12);border:1px solid var(--green);color:var(--green);padding:10px 14px;border-radius:8px;font-size:0.85rem;font-weight:600;margin-top:12px;display:none;text-align:center}
.msg-err{background:rgba(239,68,68,.12);border:1px solid var(--red);color:var(--red);padding:10px 14px;border-radius:8px;font-size:0.85rem;font-weight:600;margin-top:12px;display:none;text-align:center}
.info{text-align:center;padding:36px 20px;color:var(--t3);font-size:0.9rem}
.info-big{font-size:2.4rem;margin-bottom:10px}

table{width:100%;border-collapse:collapse;font-size:0.8rem}
thead th{padding:9px 10px;color:var(--t3);font-weight:600;text-align:left;border-bottom:1px solid var(--b)}
tbody td{padding:9px 10px;border-bottom:1px solid rgba(42,58,82,.4);color:var(--t2)}
tbody tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:0.7rem;font-weight:700}
.badge-green{background:rgba(16,185,129,.15);color:var(--green)}
.badge-yellow{background:rgba(245,158,11,.15);color:var(--yellow)}
.badge-red{background:rgba(239,68,68,.12);color:var(--red)}
.badge-gray{background:rgba(148,163,184,.15);color:var(--t2)}
</style>
<style id="ns-layout-pre">body{margin-left:240px!important}@media(max-width:780px){body{margin-left:0!important;padding-top:52px!important}}</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-icon">🍽️</div>
    <div class="topbar-titulo">Supervisión de Cafetería</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="topbar-user" id="topbar-user"></div>
  </div>
</div>

<div id="contenido"><div class="info">Cargando...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/sidebar.js"></script>
<script>
const sb = supabase.createClient(
  'https://exjaxhrylfdwehzjfjut.supabase.co',
  'sb_publishable_EP2Y83o7nj7CGCUd0pH3VA_vSNkeg99'
);
let token = null;

const DIMENSIONES = [
  { titulo: '🧼 Salubridad', items: [
    'Manipula los alimentos con higiene (guantes/utensilios limpios, higiene personal).',
    'Conserva los alimentos a temperatura adecuada (refrigeración / calor).',
    'Superficies y utensilios de preparación limpios y desinfectados.',
    'Insumos con fecha de vencimiento vigente y en buen estado.',
    'Dispone de agua y lavado de manos para el personal.',
  ], obs: 'obs_salubridad' },
  { titulo: '📦 Orden', items: [
    'Áreas de preparación y almacén ordenadas y sin obstrucciones.',
    'Manejo correcto de residuos (tachos con tapa, segregación).',
    'Insumos almacenados y rotulados adecuadamente.',
    'Área de atención al público limpia y ordenada.',
  ], obs: 'obs_orden' },
  { titulo: '💲 Precios', items: [
    'Los precios exhibidos coinciden con los del contrato de concesión.',
    'No cobra sobreprecios ni productos fuera de lo autorizado.',
    'La lista de precios está visible para los estudiantes.',
  ], obs: 'obs_precios' },
];

async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/login'; return false; }
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal.currentLevel !== 'aal2') { await sb.auth.signOut(); window.location.href = '/login'; return false; }
  token = session.access_token;
  const r = await fetch('/api/staff-info', { headers: { 'Authorization': `Bearer ${token}` } });
  if (!r.ok) { window.location.href = '/login'; return false; }
  const info = await r.json();
  if (info.rol !== 'director' && info.modulos && info.modulos.length > 0 && !info.modulos.includes('supervision_cafeteria')) {
    window.location.href = '/ejecutivo'; return false;
  }
  document.getElementById('topbar-user').innerHTML = `<strong>${info.nombre}</strong>`;
  return true;
}

function fmtVence(iso) {
  return new Date(iso).toLocaleString('es-PE', { timeZone: 'America/Lima', hour: '2-digit', minute: '2-digit', hour12: true });
}

let itemIndex = 0;
function itemHtml(txt) {
  const i = itemIndex++;
  return `
    <div class="item">
      <div class="item-txt">${i + 1}. ${txt}</div>
      <div class="opts">
        <div class="opt v2"><input type="radio" name="q${i + 1}" id="q${i + 1}_2" value="2"><label for="q${i + 1}_2">✓ Cumple</label></div>
        <div class="opt v1"><input type="radio" name="q${i + 1}" id="q${i + 1}_1" value="1"><label for="q${i + 1}_1">~ Parcial</label></div>
        <div class="opt v0"><input type="radio" name="q${i + 1}" id="q${i + 1}_0" value="0"><label for="q${i + 1}_0">✕ No cumple</label></div>
      </div>
    </div>`;
}

function renderForm(p) {
  itemIndex = 0;
  const dims = DIMENSIONES.map(d => `
    <div class="card">
      <div class="dim-titulo">${d.titulo}</div>
      ${d.items.map(itemHtml).join('')}
      <textarea class="obs" id="${d.obs}" rows="2" placeholder="Observaciones de esta sección (opcional)"></textarea>
    </div>`).join('');
  document.getElementById('contenido').innerHTML = `
    <div class="plazo">⏱️ Tienes hasta las <strong>${fmtVence(p.vence_en)}</strong> para completar esta supervisión.</div>
    ${dims}
    <div class="card">
      <div class="dim-titulo">📝 Observación general</div>
      <textarea class="obs" id="obs_general" rows="3" placeholder="Comentario general de la supervisión (opcional)" style="margin-top:0"></textarea>
    </div>
    <button class="btn btn-acc" style="width:100%" onclick="enviar(${p.id})">Enviar supervisión</button>
    <div class="msg-ok" id="msgOk"></div>
    <div class="msg-err" id="msgErr"></div>`;
}

async function enviar(id) {
  const ok = document.getElementById('msgOk'), err = document.getElementById('msgErr');
  ok.style.display = 'none'; err.style.display = 'none';
  const respuestas = {};
  for (let i = 1; i <= 12; i++) {
    const sel = document.querySelector(`input[name="q${i}"]:checked`);
    if (!sel) { err.textContent = `Responde la pregunta ${i}`; err.style.display = 'block'; window.scrollTo({top:0,behavior:'smooth'}); return; }
    respuestas['q' + i] = sel.value;
  }
  try {
    const r = await fetch('/api/supervision-cafeteria', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({
        accion: 'responder', id, respuestas,
        obs_salubridad: document.getElementById('obs_salubridad').value.trim() || null,
        obs_orden: document.getElementById('obs_orden').value.trim() || null,
        obs_precios: document.getElementById('obs_precios').value.trim() || null,
        obs_general: document.getElementById('obs_general').value.trim() || null,
      }),
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'Error al enviar');
    document.getElementById('contenido').innerHTML = `
      <div class="card"><div class="info">
        <div class="info-big">✅</div>
        <div style="font-size:1.1rem;font-weight:800;color:var(--green);margin-bottom:6px">Supervisión registrada</div>
        <div>Puntaje: <strong style="color:var(--text)">${data.puntaje}/24</strong> · ${data.porcentaje}%</div>
      </div></div>`;
    cargarHistorial(true);
  } catch(e) { err.textContent = 'Error: ' + e.message; err.style.display = 'block'; }
}

function badgePct(pct) {
  const cls = pct >= 80 ? 'badge-green' : pct >= 60 ? 'badge-yellow' : 'badge-red';
  return `<span class="badge ${cls}">${pct}%</span>`;
}

async function cargarHistorial(append) {
  try {
    const r = await fetch('/api/supervision-cafeteria?accion=historial', { headers: { 'Authorization': `Bearer ${token}` } });
    const items = await r.json();
    const html = `
      <div class="card">
        <div class="dim-titulo">🗂️ Historial de supervisiones</div>
        <div style="overflow-x:auto"><table>
          <thead><tr><th>Semana</th><th>Estado</th><th>Puntaje</th><th>Resultado</th></tr></thead>
          <tbody>${
            (Array.isArray(items) && items.length) ? items.map(s => `
              <tr>
                <td style="color:var(--text)">${s.semana}</td>
                <td>${s.estado === 'completada' ? '<span class="badge badge-green">Completada</span>' : '<span class="badge badge-gray">Cerrada (no realizada)</span>'}</td>
                <td>${s.estado === 'completada' ? `${s.puntaje}/24` : '—'}</td>
                <td>${s.estado === 'completada' ? badgePct(s.porcentaje) : '—'}</td>
              </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--t3);padding:16px">Sin supervisiones registradas</td></tr>'
          }</tbody>
        </table></div>
      </div>`;
    if (append) document.getElementById('contenido').insertAdjacentHTML('beforeend', html);
    else document.getElementById('contenido').innerHTML = html;
  } catch(e) {
    document.getElementById('contenido').innerHTML = `<div class="info">Error al cargar: ${e.message}</div>`;
  }
}

async function cargar() {
  try {
    const r = await fetch('/api/supervision-cafeteria?accion=pendiente', { headers: { 'Authorization': `Bearer ${token}` } });
    const { pendiente } = await r.json();
    if (pendiente) { renderForm(pendiente); }
    else {
      document.getElementById('contenido').innerHTML = `
        <div class="card"><div class="info">
          <div class="info-big">☕</div>
          <div>No hay ninguna supervisión pendiente en este momento.</div>
          <div style="font-size:0.8rem;margin-top:6px">Recibirás un correo cuando te corresponda realizar la próxima.</div>
        </div></div>`;
      cargarHistorial(true);
    }
  } catch(e) {
    document.getElementById('contenido').innerHTML = `<div class="info">Error: ${e.message}</div>`;
  }
}

initAuth().then(ok => { if (ok) cargar(); });
</script>
</body>
</html>
