<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RecreaBot — Neumann</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:       #0f1117;
  --surface:  #1a2235;
  --surface2: #212d42;
  --border:   #2a3a52;
  --accent:   #3b82f6;
  --accent2:  #60a5fa;
  --green:    #10b981;
  --text:     #e2e8f0;
  --text2:    #94a3b8;
  --text3:    #64748b;
}

html, body {
  height: 100%; height: 100dvh;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

/* ── LAYOUT ── */
.app {
  display: flex; flex-direction: column;
  height: 100%; height: 100dvh;
  max-width: 480px; margin: 0 auto;
  position: relative;
}

/* ── HEADER ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}
.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; flex-shrink: 0;
}
.header-info { flex: 1; min-width: 0; }
.header-name { font-size: 0.95rem; font-weight: 600; }
.header-status { font-size: 0.72rem; color: var(--green); display: flex; align-items: center; gap: 4px; margin-top: 1px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.area-badge {
  padding: 4px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600;
  background: rgba(59,130,246,0.15); color: var(--accent2);
  border: 1px solid rgba(59,130,246,0.3);
  white-space: nowrap;
}

/* ── MENSAJES ── */
.messages {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 16px 14px; display: flex; flex-direction: column; gap: 10px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.msg { display: flex; flex-direction: column; gap: 3px; max-width: 82%; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.bot  { align-self: flex-start; align-items: flex-start; }

.bubble {
  padding: 10px 14px; border-radius: 18px;
  font-size: 0.88rem; line-height: 1.55; word-break: break-word;
}
.msg.user .bubble {
  background: var(--accent);
  color: white;
  border-bottom-right-radius: 5px;
}
.msg.bot .bubble {
  background: var(--surface);
  color: var(--text);
  border-bottom-left-radius: 5px;
  border: 1px solid var(--border);
}
.msg-time { font-size: 0.65rem; color: var(--text3); padding: 0 4px; }

/* typing */
.typing-dots { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); animation: bounce 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

/* ── CHIPS DE RESPUESTA RÁPIDA ── */
.chips-wrap {
  padding: 8px 14px 4px;
  display: flex; gap: 7px; flex-wrap: wrap;
  flex-shrink: 0;
}
.chip {
  padding: 7px 13px; border-radius: 20px; font-size: 0.78rem; font-weight: 500;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text2); cursor: pointer; white-space: nowrap;
  transition: all 0.15s; user-select: none;
}
.chip:active, .chip:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent2); }

/* ── INPUT ── */
.input-area {
  padding: 10px 14px 14px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: flex-end;
  flex-shrink: 0;
}
.input-box {
  flex: 1; background: var(--surface);
  border: 1px solid var(--border); border-radius: 22px;
  padding: 10px 16px; color: var(--text);
  font-size: 0.9rem; font-family: 'Inter', sans-serif;
  outline: none; resize: none;
  min-height: 42px; max-height: 100px;
  line-height: 1.4;
  -webkit-appearance: none;
}
.input-box:focus { border-color: var(--accent); }
.input-box::placeholder { color: var(--text3); }

.send-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--accent); border: none;
  color: white; font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.15s;
  -webkit-appearance: none;
}
.send-btn:active { background: #2563eb; transform: scale(0.95); }
.send-btn:disabled { opacity: 0.4; }

/* ── SCROLLBAR ── */
.messages::-webkit-scrollbar { width: 3px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="avatar">🎮</div>
    <div class="header-info">
      <div class="header-name">RecreaBot</div>
      <div class="header-status"><span class="status-dot"></span> En línea · Neumann</div>
    </div>
    <div class="area-badge" id="area-badge">Recreación</div>
  </div>

  <!-- MENSAJES -->
  <div class="messages" id="messages"></div>

  <!-- CHIPS -->
  <div class="chips-wrap" id="chips"></div>

  <!-- INPUT -->
  <div class="input-area">
    <textarea class="input-box" id="input" placeholder="Escribe un mensaje..." rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
      oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="send()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
// ── CARGAR CONFIGURACIÓN DE HORARIOS ──
let SLOTS_CONFIG = {};
async function cargarConfig() {
  try {
    const r = await fetch('/api/config');
    SLOTS_CONFIG = await r.json();
  } catch(e) {
    // Config por defecto si falla
    const s2h = ['8-10am','10am-12pm','12-2pm','2-4pm','4-6pm','6-8pm','8-10pm'];
    const s1h = ['8-9am','9-10am','10-11am','11am-12pm','12-1pm','1-2pm','2-3pm','3-4pm','4-5pm','5-6pm','6-7pm','7-8pm','8-9pm','9-10pm'];
    SLOTS_CONFIG = {
      'Canchita A':{ slots:s2h, activa:true },
      'Canchita B':{ slots:s2h, activa:true },
      'Taka Taka': { slots:s1h, activa:true },
      'Ajedrez':   { slots:s1h, activa:true },
      'Sapito':    { slots:s1h, activa:true },
    };
  }
}

function getSlotsParaArea(area) {
  const cfg = SLOTS_CONFIG[area];
  if (!cfg) return [];
  // activa puede ser booleano o string "TRUE"/"FALSE" desde Sheets
  const activa = cfg.activa === true || String(cfg.activa).toUpperCase() === 'TRUE';
  if (!activa) return [];
  // slots puede ser array o string separado por comas
  if (Array.isArray(cfg.slots)) return cfg.slots;
  if (typeof cfg.slots === 'string') return cfg.slots.split(',').map(s => s.trim()).filter(Boolean);
  return [];
}

// ── DETECTAR ÁREA DESDE URL ──
const params  = new URLSearchParams(window.location.search);
const AREA    = params.get('area') || '';
const AREAS   = ['Canchita A','Canchita B','Taka Taka','Ajedrez','Sapito'];
const CARRERAS = ['Administración','Contabilidad'];

// Badge del header
const badge = document.getElementById('area-badge');
if (AREA) {
  const emojis = {'Canchita A':'⚽','Canchita B':'⚽','Taka Taka':'🏓','Ajedrez':'♟️','Sapito':'🐸'};
  badge.textContent = (emojis[AREA]||'🎮') + ' ' + AREA;
  badge.style.background = 'rgba(16,185,129,0.15)';
  badge.style.borderColor = 'rgba(16,185,129,0.3)';
  badge.style.color = '#6ee7b7';
}

// ── ESTADO ──
let history  = [];
let busy     = false;
let registro = { area: AREA, codigo:'', carrera:'', participantes:'', fecha_reserva:'', horario:'', estado:'ok', problema:'', calificacion:'' };
let pasoActual = AREA ? 'codigo' : 'area';
let estudianteActual = null; // datos del estudiante identificado // flujo: area → codigo → carrera → participantes → horario → estado → guardar

// ── EXTRACCIÓN PRECISA — solo analiza el mensaje del estudiante en cada paso ──
function actualizarRegistro(msgEstudiante) {
  const t  = msgEstudiante.trim();
  const tl = t.toLowerCase();

  // Detectar área siempre — no solo cuando pasoActual === 'area'
  if (!registro.area || pasoActual === 'area') {
    for (const a of AREAS) {
      if (tl.includes(a.toLowerCase())) {
        registro.area = a;
        if (pasoActual === 'area') pasoActual = 'codigo';
        break;
      }
    }
  }

  if (pasoActual === 'codigo') {
    const m = t.match(/^(\d{4,10})$/) || t.match(/\b(\d{4,10})\b/);
    if (m) { registro.codigo = m[1]; pasoActual = 'carrera'; }
  } else if (pasoActual === 'carrera') {
    if (tl.includes('admin')) { registro.carrera = 'Administración'; pasoActual = 'participantes'; }
    else if (tl.includes('contab')) { registro.carrera = 'Contabilidad'; pasoActual = 'participantes'; }
  } else if (pasoActual === 'participantes') {
    if (tl === '6 o más' || tl === '6+' || tl.includes('6 o más')) {
      registro.participantes = '6+'; pasoActual = 'horario';
    } else {
      const solo  = t.match(/^([1-9])$/);
      const frase = t.match(/somos\s+([1-9])/i) || t.match(/([1-9])\s+person/i);
      const num   = solo ? solo[1] : (frase ? frase[1] : null);
      if (num) { registro.participantes = num; pasoActual = 'horario'; }
    }
  } else if (pasoActual === 'horario') {
    const mapa = [
      { keys: ['7-9am','7am'], val: '7-9am' },
      { keys: ['9-11am','9am'], val: '9-11am' },
      { keys: ['11am-1pm','11am'], val: '11am-1pm' },
      { keys: ['1-3pm','1pm'], val: '1-3pm' },
      { keys: ['3-5pm','3pm'], val: '3-5pm' },
      { keys: ['5-7pm','5pm'], val: '5-7pm' },
    ];
    const limpio = tl.replace(/\s/g,'');
    for (const entry of mapa) {
      if (entry.keys.some(k => limpio.includes(k))) {
        registro.horario = entry.val; pasoActual = 'estado'; break;
      }
    }
  } else if (pasoActual === 'estado') {
    if (tl.includes('problema') || tl.includes('dañado') || tl.includes('roto') || tl.includes('falta')) {
      registro.estado = 'problema'; pasoActual = 'guardar';
    } else {
      registro.estado = 'ok'; pasoActual = 'guardar';
    }
  }
}

function registroCompleto() {
  return registro.codigo && registro.carrera && registro.area && registro.participantes && registro.horario;
}

// ── EXTRAE DATOS DEL RESUMEN QUE GENERA CLAUDE ──
function extraerDeResumen(texto) {
  const t  = texto;
  const tl = texto.toLowerCase();
  const reg = { area: AREA, codigo:'', carrera:'', participantes:'', horario:'', estado:'ok', problema:'', calificacion:'' };

  // Código — buscar "Código: XXXXXX"
  const cod = t.match(/[Cc][oó]digo[:\s]+([0-9]{4,10})/);
  if (cod) reg.codigo = cod[1];

  // Carrera
  if (tl.includes('administración') || tl.includes('administracion')) reg.carrera = 'Administración';
  else if (tl.includes('contabilidad')) reg.carrera = 'Contabilidad';

  // Área — buscar "Área: Canchita A" o similar
  for (const a of AREAS) {
    if (tl.includes(a.toLowerCase())) { reg.area = a; break; }
  }

  // Participantes — buscar "Participantes: 5" o "5 personas"
  const part = t.match(/[Pp]articipantes?[:\s]+([0-9]+|6\+|6 o más)/);
  const partB = t.match(/([0-9]+)\s+persona/);
  if (part) reg.participantes = part[1];
  else if (partB) reg.participantes = partB[1];

  // Fecha de reserva — usar fecha del navegador del estudiante (siempre correcta)
  const hoyCliente = new Date();
  const DIAS_ES  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const DIAS_SIN = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
  if (tl.includes('hoy')) {
    reg.fecha_reserva = hoyCliente.toLocaleDateString('es-PE');
  } else if (tl.includes('mañana') || tl.includes('manana')) {
    const m = new Date(hoyCliente); m.setDate(m.getDate() + 1);
    reg.fecha_reserva = m.toLocaleDateString('es-PE');
  } else {
    for (let i = 0; i < DIAS_ES.length; i++) {
      if (tl.includes(DIAS_ES[i]) || tl.includes(DIAS_SIN[i])) {
        const f = new Date(hoyCliente);
        const diff = (i - f.getDay() + 7) % 7 || 7;
        f.setDate(f.getDate() + diff);
        reg.fecha_reserva = f.toLocaleDateString('es-PE');
        break;
      }
    }
    const fm = texto.match(/(\d{1,2})[\/\-](\d{1,2})/);
    if (fm && !reg.fecha_reserva) reg.fecha_reserva = fm[0];
  }

  // Horario — buscar slot exacto o normalizar desde formato del bot
  const TODOS_SLOTS = [
    '8-10am','10am-12pm','12-2pm','2-4pm','4-6pm','6-8pm','8-10pm',
    '8-9am','9-10am','10-11am','11am-12pm','12-1pm','1-2pm',
    '2-3pm','3-4pm','4-5pm','5-6pm','6-7pm','7-8pm','8-9pm','9-10pm',
    '7-9am','9-11am','11am-1pm','1-3pm','3-5pm','5-7pm',
  ];

  // 1. Buscar slot exacto en el texto
  for (const slot of TODOS_SLOTS) {
    if (tl.includes(slot.toLowerCase())) { reg.horario = slot; break; }
  }

  // 2. Si no encontró, buscar línea "Horario: X" y normalizar
  if (!reg.horario) {
    const lineaHorario = texto.match(/[Hh]orario[:\s]+([^\n]+)/);
    if (lineaHorario) {
      const h = lineaHorario[1].trim();
      // Extraer horas de inicio del formato "8:00 AM - 9:00 AM" o "8 AM" etc.
      const match = h.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm|AM|PM|a\.m\.|p\.m\.)/i);
      if (match) {
        let hora = parseInt(match[1]);
        const ampm = match[3].toLowerCase().replace(/\./g,'');
        if ((ampm === 'pm' || ampm === 'pm') && hora !== 12) hora += 12;
        if ((ampm === 'am' || ampm === 'am') && hora === 12) hora = 0;
        // Mapear hora de inicio al slot de 1h o 2h según el área
        const es2h = ['Canchita A','Canchita B'].includes(reg.area || AREA || '');
        if (es2h) {
          if      (hora === 8)  reg.horario = '8-10am';
          else if (hora === 10) reg.horario = '10am-12pm';
          else if (hora === 12) reg.horario = '12-2pm';
          else if (hora === 14) reg.horario = '2-4pm';
          else if (hora === 16) reg.horario = '4-6pm';
          else if (hora === 18) reg.horario = '6-8pm';
          else if (hora === 20) reg.horario = '8-10pm';
        } else {
          // Slots de 1 hora
          const slots1h = ['8-9am','9-10am','10-11am','11am-12pm','12-1pm','1-2pm',
                           '2-3pm','3-4pm','4-5pm','5-6pm','6-7pm','7-8pm','8-9pm','9-10pm'];
          const horaBase = hora >= 12 ? hora : hora;
          if (hora <= 7)  reg.horario = '8-9am';    // redondear a primer slot
          else if (hora === 8)  reg.horario = '8-9am';
          else if (hora === 9)  reg.horario = '9-10am';
          else if (hora === 10) reg.horario = '10-11am';
          else if (hora === 11) reg.horario = '11am-12pm';
          else if (hora === 12) reg.horario = '12-1pm';
          else if (hora === 13) reg.horario = '1-2pm';
          else if (hora === 14) reg.horario = '2-3pm';
          else if (hora === 15) reg.horario = '3-4pm';
          else if (hora === 16) reg.horario = '4-5pm';
          else if (hora === 17) reg.horario = '5-6pm';
          else if (hora === 18) reg.horario = '6-7pm';
          else if (hora === 19) reg.horario = '7-8pm';
          else if (hora === 20) reg.horario = '8-9pm';
          else if (hora === 21) reg.horario = '9-10pm';
        }
      }
    }
  }

  // Estado — siempre ok (el estudiante no ha usado el área aún)
  reg.estado = 'ok';

  // Solo guardar si tenemos al menos código y área
  if (!reg.codigo || !reg.area) return null;
  return reg;
}

// ── BUSCAR ESTUDIANTE POR CÓDIGO ──
async function buscarEstudiante(codigo) {
  try {
    const r = await fetch(`/api/estudiantes?codigo=${codigo.trim()}`);
    return await r.json();
  } catch(e) {
    return { encontrado: false };
  }
}

// ── ENVIAR EMAIL DE EVALUACIÓN ──
async function enviarEmailEvaluacion(estudiante, reserva) {
  if (!estudiante || !estudiante.email) return;
  try {
    await fetch('/api/evaluacion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ estudiante, reserva }),
    });
    console.log('Email de evaluación enviado a', estudiante.email);
  } catch(e) {
    console.warn('No se pudo enviar email de evaluación:', e.message);
  }
}

// ── GUARDAR EN GOOGLE SHEETS ──
async function guardarEnSheets(reg) {
  try {
    const res = await fetch('/api/sheets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ registro: { ...reg, ts: new Date().toISOString() } }),
    });
    const d = await res.json();
    console.log('Sheets response:', d);
    return d;
  } catch(e) {
    console.warn('No se pudo guardar en Sheets:', e.message);
    return null;
  }
}



// ── MENSAJE INICIAL ──
const bienvenida = AREA
  ? `👋 Hola, soy RecreaBot del Instituto Superior Neumann.\n\n¡Vas a usar ${AREA}! Para registrar tu uso necesito algunos datos rápidos.\n\n¿Cuál es tu código de estudiante?`
  : `👋 Hola, soy RecreaBot del Instituto Superior Neumann.\n\nPuedo registrar tu uso de las áreas recreativas, consultar disponibilidad o reportar un problema.\n\n¿Qué área quieres usar hoy?`;

// ── CHIPS INICIALES ──
const chipsIniciales = AREA
  ? ['Tengo mi código', 'Ver disponibilidad', 'Reportar problema']
  : ['⚽ Canchita A', '⚽ Canchita B', '🏓 Taka Taka', '♟️ Ajedrez', '🐸 Sapito'];

// ── RENDER MENSAJE ──
function addMsg(role, text) {
  const wrap = document.getElementById('messages');
  const time = new Date().toLocaleTimeString('es-PE', {hour:'2-digit', minute:'2-digit'});
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="bubble">${text.replace(/\n/g,'<br>')}</div>
    <div class="msg-time">${time}</div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function addTyping() {
  const wrap = document.getElementById('messages');
  const div  = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typing';
  div.innerHTML = `<div class="bubble"><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}
function removeTyping() { document.getElementById('typing')?.remove(); }

// ── CHIPS ──
function setChips(list) {
  const wrap = document.getElementById('chips');
  wrap.innerHTML = list.map(c =>
    `<button class="chip" onclick="chipSend('${c}')">${c}</button>`
  ).join('');
}
function chipSend(text) { document.getElementById('input').value = text; send(); }

// ── AUTO RESIZE TEXTAREA ──
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ── SYSTEM PROMPT ──
function buildSystem() {
  // Usar área del QR, o la que el estudiante eligió en la conversación
  const areaActual = AREA || registro.area || '';
  const slotsArea  = areaActual ? getSlotsParaArea(areaActual) : [];
  const slotsTexto = slotsArea.length ? slotsArea.join(', ') : 'sin slots aún — pregunta primero qué área quiere el estudiante';
  const estudianteInfo = estudianteActual
    ? `ESTUDIANTE IDENTIFICADO: ${estudianteActual.nombre} ${estudianteActual.apellido} — ${estudianteActual.carrera} — código ${estudianteActual.codigo}`
    : 'Estudiante aún no identificado — pedir código';
  const hoyStr = new Date().toLocaleDateString('es-PE', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  return `Eres RecreaBot, asistente del Instituto Superior Neumann para reservas de áreas recreativas.

FECHA HOY: ${hoyStr}
ÁREA ACTUAL: ${areaActual || 'no especificada — pregunta al estudiante'}
ÁREAS DISPONIBLES: Canchita A, Canchita B, Taka Taka, Ajedrez, Sapito.
${estudianteInfo}
SLOTS DISPONIBLES PARA ${areaActual || 'el área elegida'}: ${slotsTexto}
IMPORTANTE: Ofrece ÚNICAMENTE esos slots. Si el estudiante pide otro horario, muéstrale la lista.

FLUJO — sigue este orden:
1. Si el área viene del QR, no la preguntes
2. Pide CÓDIGO DE ESTUDIANTE (solo números)
3. Si el estudiante fue identificado, salúdalo por nombre y NO preguntes carrera
4. Pide NÚMERO DE PARTICIPANTES (1 a 6+)
5. Pide la FECHA (hoy, mañana, o día de la semana)
6. Muestra los slots y pide elegir uno de la lista exacta
7. Confirma el resumen y cierra

REGLAS:
- Respuestas cortas — máximo 3 líneas — estamos en móvil
- NO preguntes por el estado del equipo ni las instalaciones — el estudiante aún no las ha usado y evaluará por email después
- Cuando confirmes SIEMPRE escribe el resumen con este formato EXACTO:
  Código: XXXXXX
  Carrera: Administración o Contabilidad
  Área: nombre exacto
  Participantes: número
  Fecha: fecha exacta o día
  Horario: escribe el slot EXACTAMENTE como está en la lista (ej: 8-9am NO "8:00 AM - 9:00 AM")
- Luego en línea nueva escribe exactamente: [REGISTRO COMPLETO ✅]
- Si el estudiante da todos los datos en un mensaje, extrae y confirma sin más preguntas
- No uses markdown, asteriscos ni guiones`;
}

// ── ENVIAR MENSAJE ──
async function send() {
  // Asegurar que la config está cargada
  if (Object.keys(SLOTS_CONFIG).length === 0) await cargarConfig();
  const input = document.getElementById('input');
  const text  = input.value.trim();
  if (!text || busy) return;

  input.value = ''; input.style.height = 'auto';
  busy = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('chips').innerHTML = '';

  addMsg('user', text);
  history.push({ role: 'user', content: text });

  // Verificar código siempre que el mensaje sea solo números (4-10 dígitos)
  // independientemente del paso actual
  const esCodigo = text.trim().match(/^\d{4,10}$/);
  if (esCodigo && !estudianteActual) {
    addTyping();
    const est = await buscarEstudiante(text.trim());
    removeTyping();
    if (est.encontrado && est.activo) {
      // ✅ Válido — registrar estudiante y continuar con Claude
      estudianteActual = est;
      registro.codigo  = est.codigo;
      registro.carrera = est.carrera;
      pasoActual = 'participantes';
      history[history.length - 1].content =
        `Mi código es ${est.codigo}. Soy ${est.nombre} ${est.apellido} de ${est.carrera}.`;
    } else if (est.encontrado && !est.activo) {
      // 🔒 Inactivo — bloquear
      addMsg('bot', `Lo siento ${est.nombre || ''}, tu código (${text.trim()}) está inactivo en el sistema. Consulta con secretaría para habilitarlo. 🔒`);
      history.pop();
      document.getElementById('send-btn').disabled = false;
      busy = false; return;
    } else {
      // ❌ No encontrado — bloquear
      addMsg('bot', `El código ${text.trim()} no está registrado en el Instituto Superior Neumann. ❌\n\nVerifica que sea correcto o consulta con secretaría. Puedes intentarlo de nuevo.`);
      history.pop();
      document.getElementById('send-btn').disabled = false;
      busy = false; return;
    }
  }

  // Actualizar registro ANTES de buildSystem — el área ya estará disponible
  actualizarRegistro(text);

  addTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system:     buildSystem(),
        messages:   history,
        max_tokens: 300,
      }),
    });

    const data = await res.json();
    removeTyping();

    if (data.content && data.content[0]) {
      const reply = data.content[0].text;
      history.push({ role: 'assistant', content: reply });
      addMsg('bot', reply);
      updateChips(reply, text);
      // Extraer datos directamente del resumen que Claude generó
      if (reply.includes('[REGISTRO COMPLETO')) {
        const reg = extraerDeResumen(reply);
        if (reg) {
          const resultado = await guardarEnSheets(reg);
          if (resultado && resultado.ok) {
            const confirmDiv = document.createElement('div');
            confirmDiv.style.cssText = 'text-align:center;padding:8px;font-size:0.72rem;color:#10b981;background:rgba(16,185,129,0.1);border-radius:8px;margin:4px 14px;';
            confirmDiv.textContent = '✅ Guardado en Google Sheets';
            document.getElementById('messages').appendChild(confirmDiv);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
          }
          // Enviar email con datos extraídos del resumen — reg tiene área, horario, fecha correctos
          console.log("EMAIL — estudiante:", estudianteActual?.email, "reg:", JSON.stringify(reg));
          if (estudianteActual && estudianteActual.email) {
            await enviarEmailEvaluacion(estudianteActual, reg);
          }
        }
        estudianteActual = null;
        registro   = { area: AREA, codigo:'', carrera:'', participantes:'', fecha_reserva:'', horario:'', estado:'ok', problema:'', calificacion:'' };
        pasoActual = AREA ? 'codigo' : 'area';
      }
    } else {
      addMsg('bot', '⚠️ No pude responder. Intenta de nuevo.');
    }
  } catch(e) {
    removeTyping();
    addMsg('bot', '⚠️ Sin conexión. Verifica tu internet e intenta de nuevo.');
  }

  busy = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('input').focus();
}

// ── CHIPS DINÁMICOS SEGÚN CONTEXTO ──
function updateChips(reply, userMsg) {
  const r = reply.toLowerCase();
  let chips = [];

  if (r.includes('código')) {
    chips = ['No tengo mi código', 'Soy de Administración', 'Soy de Contabilidad'];
  } else if (r.includes('carrera')) {
    chips = ['Administración', 'Contabilidad'];
  } else if (r.includes('participante') || r.includes('cuántos')) {
    chips = ['1', '2', '3', '4', '5', '6 o más'];
  } else if (r.includes('horario')) {
    chips = ['7-9am', '9-11am', '11am-1pm', '1-3pm', '3-5pm', '5-7pm'];
  } else if (r.includes('estado') || r.includes('buen estado') || r.includes('equipo')) {
    chips = ['✅ Todo bien', '⚠️ Hay un problema'];
  } else if (r.includes('registro completo') || r.includes('confirmado')) {
    chips = ['Registrar otro uso', 'Reportar problema', 'Ver otras áreas'];
  } else if (r.includes('qué área') || r.includes('qué deseas')) {
    chips = ['⚽ Canchita A', '⚽ Canchita B', '🏓 Taka Taka', '♟️ Ajedrez', '🐸 Sapito'];
  }

  if (chips.length) setChips(chips);
}

// ── INIT ──
window.addEventListener('load', async () => {
  await cargarConfig();
  // Mensaje de bienvenida con pequeño delay para sensación natural
  setTimeout(() => {
    addTyping();
    setTimeout(() => {
      removeTyping();
      addMsg('bot', bienvenida);
      setChips(chipsIniciales);
    }, 800);
  }, 300);

  // Focus en input solo en desktop
  if (window.innerWidth > 480) {
    document.getElementById('input').focus();
  }
});
