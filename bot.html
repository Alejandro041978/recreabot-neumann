<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Asistente Neumann</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:       #0f1117;
  --surface:  #1a2235;
  --surface2: #212d42;
  --border:   #2a3a52;
  --accent:   #3b82f6;
  --accent2:  #60a5fa;
  --green:    #10b981;
  --text:     #e2e8f0;
  --text2:    #94a3b8;
  --text3:    #64748b;
}

html, body {
  height: 100%; height: 100dvh;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

.app {
  display: flex; flex-direction: column;
  height: 100%; height: 100dvh;
  max-width: 480px; margin: 0 auto;
  position: relative;
}

.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}
.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; flex-shrink: 0;
}
.header-info { flex: 1; min-width: 0; }
.header-name { font-size: 0.95rem; font-weight: 600; }
.header-status { font-size: 0.72rem; color: var(--green); display: flex; align-items: center; gap: 4px; margin-top: 1px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.area-badge {
  padding: 4px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600;
  background: rgba(59,130,246,0.15); color: var(--accent2);
  border: 1px solid rgba(59,130,246,0.3);
  white-space: nowrap;
}

.messages {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 16px 14px; display: flex; flex-direction: column; gap: 10px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.msg { display: flex; flex-direction: column; gap: 3px; max-width: 82%; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.bot  { align-self: flex-start; align-items: flex-start; }

.bubble {
  padding: 10px 14px; border-radius: 18px;
  font-size: 0.88rem; line-height: 1.55; word-break: break-word;
}
.msg.user .bubble {
  background: var(--accent);
  color: white;
  border-bottom-right-radius: 5px;
}
.msg.bot .bubble {
  background: var(--surface);
  color: var(--text);
  border-bottom-left-radius: 5px;
  border: 1px solid var(--border);
}
.msg-time { font-size: 0.65rem; color: var(--text3); padding: 0 4px; }

.typing-dots { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); animation: bounce 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

.chips-wrap {
  padding: 8px 14px 4px;
  display: flex; gap: 7px; flex-wrap: wrap;
  flex-shrink: 0;
}
.chip {
  padding: 7px 13px; border-radius: 20px; font-size: 0.78rem; font-weight: 500;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text2); cursor: pointer; white-space: nowrap;
  transition: all 0.15s; user-select: none;
}
.chip:active, .chip:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent2); }

.input-area {
  padding: 10px 14px 14px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: flex-end;
  flex-shrink: 0;
}
.input-box {
  flex: 1; background: var(--surface);
  border: 1px solid var(--border); border-radius: 22px;
  padding: 10px 16px; color: var(--text);
  font-size: 0.9rem; font-family: 'Inter', sans-serif;
  outline: none; resize: none;
  min-height: 42px; max-height: 100px;
  line-height: 1.4;
  -webkit-appearance: none;
}
.input-box:focus { border-color: var(--accent); }
.input-box::placeholder { color: var(--text3); }

.send-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--accent); border: none;
  color: white; font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.15s;
  -webkit-appearance: none;
}
.send-btn:active { background: #2563eb; transform: scale(0.95); }
.send-btn:disabled { opacity: 0.4; }

.messages::-webkit-scrollbar { width: 3px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="avatar">🎓</div>
    <div class="header-info">
      <div class="header-name">Asistente Neumann</div>
      <div class="header-status"><span class="status-dot"></span> En línea · Instituto Superior Neumann</div>
    </div>
    <div class="area-badge" id="area-badge">Campus</div>
  </div>

  <div class="messages" id="messages"></div>
  <div class="chips-wrap" id="chips"></div>

  <div class="input-area">
    <textarea class="input-box" id="input" placeholder="Escribe un mensaje..." rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
      oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="send()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
// ── CONFIG DE HORARIOS ──
let SLOTS_CONFIG = {};
async function cargarConfig() {
  try {
    const r = await fetch('/api/config');
    SLOTS_CONFIG = await r.json();
  } catch(e) {
    const s2h = ['8-10am','10am-12pm','12-2pm','2-4pm','4-6pm','6-8pm','8-10pm'];
    const s1h = ['8-9am','9-10am','10-11am','11am-12pm','12-1pm','1-2pm','2-3pm','3-4pm','4-5pm','5-6pm','6-7pm','7-8pm','8-9pm','9-10pm'];
    SLOTS_CONFIG = {
      'Canchita A':{ slots:s2h, activa:true }, 'Canchita B':{ slots:s2h, activa:true },
      'Taka Taka': { slots:s1h, activa:true }, 'Ajedrez':   { slots:s1h, activa:true },
      'Sapito':    { slots:s1h, activa:true },
    };
  }
}

function getSlotsParaArea(area) {
  const cfg = SLOTS_CONFIG[area];
  if (!cfg) return [];
  const activa = cfg.activa === true || String(cfg.activa).toUpperCase() === 'TRUE';
  if (!activa) return [];
  if (Array.isArray(cfg.slots)) return cfg.slots;
  if (typeof cfg.slots === 'string') return cfg.slots.split(',').map(s => s.trim()).filter(Boolean);
  return [];
}

// ── PARÁMETROS URL ──
const params  = new URLSearchParams(window.location.search);
const AREA    = params.get('area') || '';
const AREAS   = ['Canchita A','Canchita B','Taka Taka','Ajedrez','Sapito'];

// Badge del header
const badge = document.getElementById('area-badge');
if (AREA) {
  const emojis = {'Canchita A':'⚽','Canchita B':'⚽','Taka Taka':'🏓','Ajedrez':'♟️','Sapito':'🐸'};
  badge.textContent = (emojis[AREA]||'🎮') + ' ' + AREA;
  badge.style.background = 'rgba(16,185,129,0.15)';
  badge.style.borderColor = 'rgba(16,185,129,0.3)';
  badge.style.color = '#6ee7b7';
}

// ── ESTADO ──
let history  = [];
let busy     = false;
let modulo   = AREA ? 'reserva' : null; // 'reserva' | 'asistencia' | 'cultura' | null
let registro = { area: AREA, codigo:'', carrera:'', participantes:'', fecha_reserva:'', horario:'', estado:'ok', problema:'', calificacion:'' };
let pasoActual = AREA ? 'codigo' : 'codigo'; // siempre pide código primero
let estudianteActual = null;

// ── EXTRACCIÓN DE DATOS DE RESERVA ──
function actualizarRegistro(msgEstudiante) {
  const t  = msgEstudiante.trim();
  const tl = t.toLowerCase();

  if (!registro.area || pasoActual === 'area') {
    for (const a of AREAS) {
      if (tl.includes(a.toLowerCase())) {
        registro.area = a;
        if (pasoActual === 'area') pasoActual = 'participantes';
        break;
      }
    }
  }

  if (pasoActual === 'participantes') {
    if (tl === '6 o más' || tl === '6+' || tl.includes('6 o más')) {
      registro.participantes = '6+'; pasoActual = 'horario';
    } else {
      const solo  = t.match(/^([1-9])$/);
      const frase = t.match(/somos\s+([1-9])/i) || t.match(/([1-9])\s+person/i);
      const num   = solo ? solo[1] : (frase ? frase[1] : null);
      if (num) { registro.participantes = num; pasoActual = 'horario'; }
    }
  } else if (pasoActual === 'horario') {
    const slots = getSlotsParaArea(registro.area || AREA);
    const limpio = tl.replace(/\s/g,'');
    for (const slot of slots) {
      if (limpio.includes(slot.toLowerCase().replace(/\s/g,''))) {
        registro.horario = slot; pasoActual = 'estado'; break;
      }
    }
  } else if (pasoActual === 'estado') {
    if (tl.includes('problema') || tl.includes('dañado') || tl.includes('roto') || tl.includes('falta')) {
      registro.estado = 'problema';
    } else {
      registro.estado = 'ok';
    }
    pasoActual = 'guardar';
  }
}

function extraerDeResumen(texto) {
  const t  = texto;
  const tl = texto.toLowerCase();
  const reg = { area: AREA, codigo:'', carrera:'', participantes:'', horario:'', estado:'ok', problema:'', calificacion:'' };

  const cod = t.match(/[Cc][oó]digo[:\s]+([0-9]{4,10})/);
  if (cod) reg.codigo = cod[1];

  if (tl.includes('administración de negocios') || tl.includes('administracion de negocios')) reg.carrera = 'Administración de Negocios Internacionales';
  else if (tl.includes('administración') || tl.includes('administracion')) reg.carrera = 'Administración de Negocios Internacionales';
  else if (tl.includes('contabilidad')) reg.carrera = 'Contabilidad';

  for (const a of AREAS) {
    if (tl.includes(a.toLowerCase())) { reg.area = a; break; }
  }

  const part = t.match(/[Pp]articipantes?[:\s]+([0-9]+|6\+|6 o más)/);
  const partB = t.match(/([0-9]+)\s+persona/);
  if (part) reg.participantes = part[1];
  else if (partB) reg.participantes = partB[1];

  const hoyCliente = new Date();
  if (tl.includes('hoy')) {
    reg.fecha_reserva = hoyCliente.toLocaleDateString('es-PE');
  } else if (tl.includes('mañana') || tl.includes('manana')) {
    const m = new Date(hoyCliente); m.setDate(m.getDate() + 1);
    reg.fecha_reserva = m.toLocaleDateString('es-PE');
  } else {
    const DIAS_ES  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    const DIAS_SIN = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
    for (let i = 0; i < DIAS_ES.length; i++) {
      if (tl.includes(DIAS_ES[i]) || tl.includes(DIAS_SIN[i])) {
        const f = new Date(hoyCliente);
        const diff = (i - f.getDay() + 7) % 7 || 7;
        f.setDate(f.getDate() + diff);
        reg.fecha_reserva = f.toLocaleDateString('es-PE'); break;
      }
    }
    const fm = texto.match(/(\d{1,2})[\/\-](\d{1,2})/);
    if (fm && !reg.fecha_reserva) reg.fecha_reserva = fm[0];
  }

  const TODOS_SLOTS = [
    '8-10am','10am-12pm','12-2pm','2-4pm','4-6pm','6-8pm','8-10pm',
    '8-9am','9-10am','10-11am','11am-12pm','12-1pm','1-2pm',
    '2-3pm','3-4pm','4-5pm','5-6pm','6-7pm','7-8pm','8-9pm','9-10pm',
  ];
  for (const slot of TODOS_SLOTS) {
    if (tl.includes(slot.toLowerCase())) { reg.horario = slot; break; }
  }
  if (!reg.horario) {
    const lineaHorario = texto.match(/[Hh]orario[:\s]+([^\n]+)/);
    if (lineaHorario) {
      const h = lineaHorario[1].trim();
      const match = h.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm|AM|PM)/i);
      if (match) {
        let hora = parseInt(match[1]);
        const ampm = match[3].toLowerCase();
        if (ampm === 'pm' && hora !== 12) hora += 12;
        if (ampm === 'am' && hora === 12) hora = 0;
        const es2h = ['Canchita A','Canchita B'].includes(reg.area || AREA || '');
        if (es2h) {
          if      (hora === 8)  reg.horario = '8-10am';
          else if (hora === 10) reg.horario = '10am-12pm';
          else if (hora === 12) reg.horario = '12-2pm';
          else if (hora === 14) reg.horario = '2-4pm';
          else if (hora === 16) reg.horario = '4-6pm';
          else if (hora === 18) reg.horario = '6-8pm';
          else if (hora === 20) reg.horario = '8-10pm';
        } else {
          if      (hora === 8)  reg.horario = '8-9am';
          else if (hora === 9)  reg.horario = '9-10am';
          else if (hora === 10) reg.horario = '10-11am';
          else if (hora === 11) reg.horario = '11am-12pm';
          else if (hora === 12) reg.horario = '12-1pm';
          else if (hora === 13) reg.horario = '1-2pm';
          else if (hora === 14) reg.horario = '2-3pm';
          else if (hora === 15) reg.horario = '3-4pm';
          else if (hora === 16) reg.horario = '4-5pm';
          else if (hora === 17) reg.horario = '5-6pm';
          else if (hora === 18) reg.horario = '6-7pm';
          else if (hora === 19) reg.horario = '7-8pm';
          else if (hora === 20) reg.horario = '8-9pm';
          else if (hora === 21) reg.horario = '9-10pm';
        }
      }
    }
  }

  reg.estado = 'ok';
  if (!reg.codigo || !reg.area) return null;
  return reg;
}

// ── BUSCAR ESTUDIANTE ──
async function buscarEstudiante(codigo) {
  try {
    const r = await fetch(`/api/estudiantes?codigo=${codigo.trim()}`);
    return await r.json();
  } catch(e) { return { encontrado: false }; }
}

// ── CONSULTAR ASISTENCIA DEL ALUMNO ──
async function fetchAsistenciaAlumno(codigo) {
  try {
    const r = await fetch(`/api/asistencia?accion=alumno&codigo=${codigo}`);
    return await r.json();
  } catch(e) { return null; }
}

function formatearAsistenciaParaClaude(data) {
  if (!data || !data.dias || data.dias.length === 0) {
    return 'Sin registros de asistencia en los últimos 30 días.';
  }
  const lineas = data.dias.slice(0, 20).map(d => {
    let linea = `• ${d.fecha}`;
    if (d.entrada) linea += ` — ingresó ${d.entrada}`;
    if (d.salida)  linea += `, salió ${d.salida}`;
    return linea;
  });
  return `Días presentes (últimos 30 días): ${data.total_dias}\n\nRegistros recientes:\n${lineas.join('\n')}`;
}

// ── ENVIAR EMAIL EVALUACIÓN ──
async function registrarInteraccionCultura() {
  try {
    await fetch('/api/cultura?accion=interaccion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codigo: estudianteActual?.codigo || null }),
    });
  } catch(e) {}
}

async function enviarEmailEvaluacion(estudiante, reserva) {
  if (!estudiante || !estudiante.email) return;
  try {
    await fetch('/api/evaluacion', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accion: 'email-confirmacion', estudiante, reserva }),
    });
  } catch(e) { console.warn('Email eval:', e.message); }
}

// ── GUARDAR RESERVA ──
async function guardarEnSheets(reg) {
  try {
    const res = await fetch('/api/sheets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ registro: { ...reg, ts: new Date().toISOString() } }),
    });
    return await res.json();
  } catch(e) { return null; }
}

// ── DETECTAR INTENCIÓN DE CONSULTA ──
function esConsultaAsistencia(texto) {
  const tl = texto.toLowerCase();
  const keywords = ['asistencia','vine','llegué','llegue','asistí','asisti','falté','falte',
    'mis días','mis dias','cuándo vine','cuando vine','cuántos días','cuantos dias',
    'ingresé','ingrese','mis marcaciones','mis registros','cuánto he ido','cuanto he ido',
    'he faltado','veces que vine','registro de entrada'];
  return keywords.some(k => tl.includes(k));
}

function esConsultaReserva(texto) {
  const tl = texto.toLowerCase();
  const keywords = ['reservar','cancha','canchita','taka','ajedrez','sapito','reserva',
    'quiero jugar','usar el área','usar el area','área recreativa','area recreativa'];
  return keywords.some(k => tl.includes(k));
}

function esConsultaCultura(texto) {
  const tl = texto.toLowerCase();
  // Keywords generales
  const keywords = ['museo','museos','cultura','cultural','arte','visita virtual',
    'recorrido virtual','exposición','exposicion','louvre','prado','hermitage',
    'vaticano','sipán','sipan','chan chan','pachacamac','inca','tawantinsuyu',
    'actividad cultural','actividades culturales','historia','arqueología','arqueologia',
    'pintura','escultura','precolombino','virtual','recorrido'];
  if (keywords.some(k => tl.includes(k))) return true;
  // También si el módulo ya es cultura, todo mensaje es cultural
  if (modulo === 'cultura') return true;
  return false;
}

// ── SYSTEM PROMPT ──
function buildSystem(asistenciaData = null) {
  const areaActual  = AREA || registro.area || '';
  const slotsArea   = areaActual ? getSlotsParaArea(areaActual) : [];
  const slotsTexto  = slotsArea.length ? slotsArea.join(', ') : 'pregunta primero qué área quiere';
  const hoyStr = new Date().toLocaleDateString('es-PE', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  // Si no hay estudiante identificado, solo pedir código
  if (!estudianteActual) {
    return `Eres el Asistente Digital del Instituto Superior Neumann.
REGLA ABSOLUTA: Antes de hacer CUALQUIER cosa debes identificar al estudiante.
NO respondas preguntas, NO des recomendaciones, NO des información de ningún tipo.
Tu ÚNICA respuesta permitida es pedir el código de estudiante de forma amable.
Sin importar lo que escriba el estudiante, responde SOLO pidiendo su código.`;
  }

  const estudianteInfo = `ESTUDIANTE IDENTIFICADO:
  Nombre: ${estudianteActual.nombre} ${estudianteActual.apellido}
  Carrera: ${estudianteActual.carrera}
  Código: ${estudianteActual.codigo}
  REGLA: Usa EXACTAMENTE este nombre. Nunca lo cambies.`;

  let sys = `Eres el Asistente Digital del Instituto Superior Neumann. Ayudas a los estudiantes con tres servicios:

1. RESERVAS DE ÁREAS RECREATIVAS
2. CONSULTA DE ASISTENCIA AL CAMPUS
3. ORIENTACIÓN CULTURAL — museos virtuales que pueden visitar desde casa

FECHA HOY: ${hoyStr}
${estudianteInfo}

MÓDULO ACTIVO: ${modulo === 'asistencia' ? 'Consulta de asistencia' : modulo === 'reserva' ? 'Reserva de área recreativa' : 'Por determinar según lo que pida el estudiante'}

REGLAS GENERALES:
- Respuestas cortas — máximo 3 líneas — estamos en móvil
- No uses markdown, asteriscos ni guiones
- El estudiante ya fue verificado — no le pidas su código de nuevo`;

  if (!modulo && estudianteActual) {
    sys += `\n\nSi el estudiante quiere reservar un área, guíalo por el flujo de reservas.
Si quiere consultar su asistencia, muéstrale sus registros.
Si quiere información cultural o de museos, ofrécele el servicio de museos virtuales.
Si no está claro qué quiere, pregúntale amablemente.`;
  }

  if (modulo === 'reserva' || AREA) {
    sys += `

FLUJO DE RESERVA:
ÁREA ACTUAL: ${areaActual || 'no especificada — pregunta al estudiante'}
ÁREAS DISPONIBLES: Canchita A, Canchita B, Taka Taka, Ajedrez, Sapito
SLOTS PARA ${areaActual || 'el área elegida'}: ${slotsTexto}

Pasos:
1. Si el área viene del QR, no la preguntes
2. Pide NÚMERO DE PARTICIPANTES (1 a 6+)
3. Pide la FECHA (hoy, mañana o día de la semana)
4. Muestra slots y pide elegir uno de la lista exacta
5. Confirma con el formato EXACTO:
   Código: XXXXXX
   Carrera: Administración de Negocios Internacionales o Contabilidad
   Área: nombre exacto
   Participantes: número
   Fecha: fecha exacta
   Horario: slot exacto (ej: 8-9am)
   [REGISTRO COMPLETO ✅]
- Ofrece ÚNICAMENTE los slots listados arriba`;
  }

  if (asistenciaData) {
    sys += `

DATOS DE ASISTENCIA DEL ESTUDIANTE (usa esto para responder):
${asistenciaData}

Presenta estos datos de forma conversacional y amigable. Resalta el total de días presentes y los registros más recientes. Si el estudiante pregunta algo específico (ej: "¿vine el lunes?"), búscalo en los registros y responde directamente.`;
  }

  return sys;
}

// ── MENSAJE INICIAL ──
const bienvenida = AREA
  ? `👋 Hola, soy el Asistente del Instituto Neumann.\n\n¡Vas a usar ${AREA}! Para registrar necesito tu código de estudiante.`
  : `👋 Hola, soy el Asistente del Instituto Neumann.\n\n¿En qué te puedo ayudar hoy?\n\n📅 Reservar un área recreativa\n📊 Consultar tu asistencia al campus\n🏛️ Visitar museos virtuales\n\nPrimero dime tu código de estudiante.`;

const chipsIniciales = ['Tengo mi código', 'Reservar área', 'Ver mi asistencia', 'Museos virtuales'];

// ── RENDER ──
function linkify(text) {
  return text
    .replace(/\n/g, '<br>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:#60a5fa;text-decoration:underline">$1</a>');
}

function addMsg(role, text) {
  const wrap = document.getElementById('messages');
  const time = new Date().toLocaleTimeString('es-PE', {hour:'2-digit', minute:'2-digit'});
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="bubble">${linkify(text)}</div><div class="msg-time">${time}</div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function addTyping() {
  const wrap = document.getElementById('messages');
  const div  = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typing';
  div.innerHTML = `<div class="bubble"><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}
function removeTyping() { document.getElementById('typing')?.remove(); }

function setChips(list) {
  const wrap = document.getElementById('chips');
  wrap.innerHTML = list.map(c =>
    `<button class="chip" onclick="chipSend('${c.replace(/'/g,"\\'")}'">${c}</button>`
  ).join('');
}
function chipSend(text) { document.getElementById('input').value = text; send(); }

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ── LLAMADA A CLAUDE ──
async function callClaude(systemPrompt) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ system: systemPrompt, messages: history, max_tokens: 350 }),
  });
  const data = await res.json();
  return data.content?.[0]?.text || null;
}

// ── ENVIAR MENSAJE ──
async function send() {
  if (Object.keys(SLOTS_CONFIG).length === 0) await cargarConfig();
  const input = document.getElementById('input');
  const text  = input.value.trim();
  if (!text || busy) return;

  input.value = ''; input.style.height = 'auto';
  busy = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('chips').innerHTML = '';

  addMsg('user', text);
  history.push({ role: 'user', content: text });

  const tl = text.toLowerCase();

  // ── PASO 1: Identificar estudiante ──
  if (!estudianteActual) {
    const codigoMatch = text.trim().match(/^\d{4,10}$/) || text.trim().match(/\b(\d{4,10})\b/);
    const codigoExtraido = codigoMatch ? (codigoMatch[1] || codigoMatch[0]) : null;

    if (codigoExtraido) {
      addTyping();
      const est = await buscarEstudiante(codigoExtraido);
      removeTyping();

      if (est.encontrado && est.activo) {
        estudianteActual = est;
        registro.codigo  = est.codigo;
        registro.carrera = est.carrera;
        history[history.length - 1].content =
          `Mi código es ${est.codigo}. Soy ${est.nombre} ${est.apellido} de ${est.carrera}.`;

        // Si hay área por QR, ir directo a reserva
        if (AREA) {
          modulo = 'reserva';
          pasoActual = 'participantes';
        } else {
          // Detectar intención del mensaje original
          if (esConsultaAsistencia(text)) {
            modulo = 'asistencia';
          } else if (esConsultaReserva(text)) {
            modulo = 'reserva';
            pasoActual = 'area';
          } else if (esConsultaCultura(text)) {
            modulo = 'cultura';
          }
          // Si no hay intención clara, Claude preguntará
        }
      } else if (est.encontrado && !est.activo) {
        addMsg('bot', `Lo siento ${est.nombre || ''}, tu código está inactivo. Consulta con secretaría para habilitarlo. 🔒`);
        history.pop();
        busy = false; document.getElementById('send-btn').disabled = false; return;
      } else {
        addMsg('bot', `El código ${codigoExtraido} no está registrado en el Instituto Superior Neumann. ❌\n\nVerifica que sea correcto o consulta con secretaría.`);
        history.pop();
        busy = false; document.getElementById('send-btn').disabled = false; return;
      }
    }
  } else {
    // Estudiante ya identificado — detectar cambio de módulo
    if (esConsultaAsistencia(tl) && modulo !== 'asistencia') {
      modulo = 'asistencia';
    } else if (esConsultaReserva(tl) && modulo !== 'reserva') {
      modulo = 'reserva';
      if (!registro.area && !AREA) pasoActual = 'area';
    } else if (esConsultaCultura(tl) && modulo !== 'cultura') {
      modulo = 'cultura';
    }
  }

  // ── Módulo cultura: redirigir a la landing page ──
  if (modulo === 'cultura' && estudianteActual) {
    registrarInteraccionCultura();
    const urlCultura = 'https://recreabot-neumann.vercel.app/cultura';
    addMsg('bot', `🏛️ Tenemos 24 museos virtuales disponibles — arte, historia y arqueología peruana e internacional.\n\nExplóralos en nuestra galería:\n👉 ${urlCultura}`);
    history.push({ role: 'assistant', content: `Te comparto el catálogo de museos virtuales: ${urlCultura}` });
    setChips(['📅 Reservar área', '📊 Ver mi asistencia']);
    modulo = null;
    busy = false; document.getElementById('send-btn').disabled = false; return;
  }

  // ── PASO 2: Si es consulta de asistencia, obtener datos primero ──
  let asistenciaData = null;
  if (modulo === 'asistencia' && estudianteActual) {
    addTyping();
    const data = await fetchAsistenciaAlumno(estudianteActual.codigo);
    removeTyping();
    asistenciaData = formatearAsistenciaParaClaude(data);
  }

  // ── PASO 3: Actualizar registro si es módulo reserva ──
  if (modulo === 'reserva' && estudianteActual) {
    actualizarRegistro(text);
  }

  addTyping();
  try {
    const reply = await callClaude(buildSystem(asistenciaData));
    removeTyping();

    if (reply) {
      history.push({ role: 'assistant', content: reply });
      addMsg('bot', reply);
      updateChips(reply);

      // Guardar reserva si Claude confirmó
      if (reply.includes('[REGISTRO COMPLETO')) {
        const reg = extraerDeResumen(reply);
        if (reg) {
          const resultado = await guardarEnSheets(reg);
          if (resultado && resultado.ok) {
            const confirmDiv = document.createElement('div');
            confirmDiv.style.cssText = 'text-align:center;padding:8px;font-size:0.72rem;color:#10b981;background:rgba(16,185,129,0.1);border-radius:8px;margin:4px 14px;';
            confirmDiv.textContent = '✅ Reserva registrada correctamente';
            document.getElementById('messages').appendChild(confirmDiv);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
          }
          if (estudianteActual && estudianteActual.email) {
            await enviarEmailEvaluacion(estudianteActual, reg);
          }
        }
        // Reset para nueva reserva o nueva intención
        registro   = { area: AREA, codigo: estudianteActual?.codigo || '', carrera: estudianteActual?.carrera || '', participantes:'', fecha_reserva:'', horario:'', estado:'ok', problema:'', calificacion:'' };
        pasoActual = AREA ? 'participantes' : 'area';
        modulo     = null;
      }
    } else {
      addMsg('bot', '⚠️ No pude responder. Intenta de nuevo.');
    }
  } catch(e) {
    removeTyping();
    addMsg('bot', '⚠️ Sin conexión. Verifica tu internet e intenta de nuevo.');
  }

  busy = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('input').focus();
}

// ── CHIPS DINÁMICOS ──
function updateChips(reply) {
  const r = reply.toLowerCase();
  let chips = [];

  if (!estudianteActual) {
    chips = ['Tengo mi código', 'Reservar área', 'Ver mi asistencia'];
  } else if (r.includes('qué necesitas') || r.includes('en qué te puedo') || r.includes('qué deseas') || (!modulo && estudianteActual)) {
    chips = ['📅 Reservar área', '📊 Ver mi asistencia'];
  } else if (r.includes('participante') || r.includes('cuántos')) {
    chips = ['1', '2', '3', '4', '5', '6 o más'];
  } else if (r.includes('horario') || r.includes('slot')) {
    const slots = getSlotsParaArea(registro.area || AREA);
    chips = slots.slice(0, 6);
  } else if (r.includes('registro completo') || r.includes('confirmado')) {
    chips = ['📅 Hacer otra reserva', '📊 Ver mi asistencia'];
  } else if (r.includes('qué área') || r.includes('área deseas')) {
    chips = ['⚽ Canchita A', '⚽ Canchita B', '🏓 Taka Taka', '♟️ Ajedrez', '🐸 Sapito'];
  } else if (r.includes('días') || r.includes('asistencia')) {
    chips = ['📅 Hacer una reserva'];
  }

  if (chips.length) setChips(chips);
}

// ── INIT ──
window.addEventListener('load', async () => {
  await cargarConfig();
  setTimeout(() => {
    addTyping();
    setTimeout(() => {
      removeTyping();
      addMsg('bot', bienvenida);
      setChips(chipsIniciales);
    }, 800);
  }, 300);

  if (window.innerWidth > 480) document.getElementById('input').focus();
});
</script>
