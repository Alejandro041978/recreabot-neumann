<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RecreaBot — Neumann</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:       #0f1117;
  --surface:  #1a2235;
  --surface2: #212d42;
  --border:   #2a3a52;
  --accent:   #3b82f6;
  --accent2:  #60a5fa;
  --green:    #10b981;
  --text:     #e2e8f0;
  --text2:    #94a3b8;
  --text3:    #64748b;
}

html, body {
  height: 100%; height: 100dvh;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

/* ── LAYOUT ── */
.app {
  display: flex; flex-direction: column;
  height: 100%; height: 100dvh;
  max-width: 480px; margin: 0 auto;
  position: relative;
}

/* ── HEADER ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}
.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; flex-shrink: 0;
}
.header-info { flex: 1; min-width: 0; }
.header-name { font-size: 0.95rem; font-weight: 600; }
.header-status { font-size: 0.72rem; color: var(--green); display: flex; align-items: center; gap: 4px; margin-top: 1px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.area-badge {
  padding: 4px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600;
  background: rgba(59,130,246,0.15); color: var(--accent2);
  border: 1px solid rgba(59,130,246,0.3);
  white-space: nowrap;
}

/* ── MENSAJES ── */
.messages {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 16px 14px; display: flex; flex-direction: column; gap: 10px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.msg { display: flex; flex-direction: column; gap: 3px; max-width: 82%; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.bot  { align-self: flex-start; align-items: flex-start; }

.bubble {
  padding: 10px 14px; border-radius: 18px;
  font-size: 0.88rem; line-height: 1.55; word-break: break-word;
}
.msg.user .bubble {
  background: var(--accent);
  color: white;
  border-bottom-right-radius: 5px;
}
.msg.bot .bubble {
  background: var(--surface);
  color: var(--text);
  border-bottom-left-radius: 5px;
  border: 1px solid var(--border);
}
.msg-time { font-size: 0.65rem; color: var(--text3); padding: 0 4px; }

/* typing */
.typing-dots { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); animation: bounce 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

/* ── CHIPS DE RESPUESTA RÁPIDA ── */
.chips-wrap {
  padding: 8px 14px 4px;
  display: flex; gap: 7px; flex-wrap: wrap;
  flex-shrink: 0;
}
.chip {
  padding: 7px 13px; border-radius: 20px; font-size: 0.78rem; font-weight: 500;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text2); cursor: pointer; white-space: nowrap;
  transition: all 0.15s; user-select: none;
}
.chip:active, .chip:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent2); }

/* ── INPUT ── */
.input-area {
  padding: 10px 14px 14px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; align-items: flex-end;
  flex-shrink: 0;
}
.input-box {
  flex: 1; background: var(--surface);
  border: 1px solid var(--border); border-radius: 22px;
  padding: 10px 16px; color: var(--text);
  font-size: 0.9rem; font-family: 'Inter', sans-serif;
  outline: none; resize: none;
  min-height: 42px; max-height: 100px;
  line-height: 1.4;
  -webkit-appearance: none;
}
.input-box:focus { border-color: var(--accent); }
.input-box::placeholder { color: var(--text3); }

.send-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--accent); border: none;
  color: white; font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.15s;
  -webkit-appearance: none;
}
.send-btn:active { background: #2563eb; transform: scale(0.95); }
.send-btn:disabled { opacity: 0.4; }

/* ── SCROLLBAR ── */
.messages::-webkit-scrollbar { width: 3px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="avatar">🎮</div>
    <div class="header-info">
      <div class="header-name">RecreaBot</div>
      <div class="header-status"><span class="status-dot"></span> En línea · Neumann</div>
    </div>
    <div class="area-badge" id="area-badge">Recreación</div>
  </div>

  <!-- MENSAJES -->
  <div class="messages" id="messages"></div>

  <!-- CHIPS -->
  <div class="chips-wrap" id="chips"></div>

  <!-- INPUT -->
  <div class="input-area">
    <textarea class="input-box" id="input" placeholder="Escribe un mensaje..." rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
      oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="send()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script>
// ── DETECTAR ÁREA DESDE URL ──
const params  = new URLSearchParams(window.location.search);
const AREA    = params.get('area') || '';
const AREAS   = ['Canchita A','Canchita B','Taka Taka','Ajedrez','Sapito'];
const CARRERAS = ['Administración','Contabilidad'];

// Badge del header
const badge = document.getElementById('area-badge');
if (AREA) {
  const emojis = {'Canchita A':'⚽','Canchita B':'⚽','Taka Taka':'🏓','Ajedrez':'♟️','Sapito':'🐸'};
  badge.textContent = (emojis[AREA]||'🎮') + ' ' + AREA;
  badge.style.background = 'rgba(16,185,129,0.15)';
  badge.style.borderColor = 'rgba(16,185,129,0.3)';
  badge.style.color = '#6ee7b7';
}

// ── ESTADO ──
let history  = [];
let busy     = false;
let registro = { area: AREA, codigo:'', carrera:'', participantes:'', horario:'', estado:'ok', problema:'', calificacion:'' };

// ── GUARDAR EN GOOGLE SHEETS ──
async function guardarEnSheets(reg) {
  try {
    const res = await fetch('/api/sheets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ registro: { ...reg, ts: new Date().toISOString() } }),
    });
    const d = await res.json();
    if (d.ok) console.log('Guardado en Sheets:', d.fila);
  } catch(e) {
    console.warn('No se pudo guardar en Sheets:', e.message);
  }
}

// ── EXTRAER DATOS DEL HISTORIAL ──
function extraerDatosRegistro() {
  const texto = history.map(m => m.content).join(' ');
  const tl    = texto.toLowerCase();
  const codMatch = texto.match(/\b(\d{4,10})\b/);
  if (codMatch) registro.codigo = codMatch[1];
  if (tl.includes('administración') || tl.includes('administracion')) registro.carrera = 'Administración';
  else if (tl.includes('contabilidad')) registro.carrera = 'Contabilidad';
  const partMatch = tl.match(/\bsomos (\d+)\b|\b(\d+) (persona|participante|jugador)/);
  if (partMatch) registro.participantes = partMatch[1] || partMatch[2];
  if (tl.includes('6 o más') || tl.includes('6+')) registro.participantes = '6+';
  ['7-9am','9-11am','11am-1pm','1-3pm','3-5pm','5-7pm'].forEach(h => {
    if (tl.includes(h.toLowerCase())) registro.horario = h;
  });
  if (tl.includes('hay un problema') || tl.includes('problema')) registro.estado = 'problema';
}

// ── MENSAJE INICIAL ──
const bienvenida = AREA
  ? `👋 Hola, soy RecreaBot del Instituto Superior Neumann.\n\n¡Vas a usar ${AREA}! Para registrar tu uso necesito algunos datos rápidos.\n\n¿Cuál es tu código de estudiante?`
  : `👋 Hola, soy RecreaBot del Instituto Superior Neumann.\n\nPuedo registrar tu uso de las áreas recreativas, consultar disponibilidad o reportar un problema.\n\n¿Qué área quieres usar hoy?`;

// ── CHIPS INICIALES ──
const chipsIniciales = AREA
  ? ['Tengo mi código', 'Ver disponibilidad', 'Reportar problema']
  : ['⚽ Canchita A', '⚽ Canchita B', '🏓 Taka Taka', '♟️ Ajedrez', '🐸 Sapito'];

// ── RENDER MENSAJE ──
function addMsg(role, text) {
  const wrap = document.getElementById('messages');
  const time = new Date().toLocaleTimeString('es-PE', {hour:'2-digit', minute:'2-digit'});
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="bubble">${text.replace(/\n/g,'<br>')}</div>
    <div class="msg-time">${time}</div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}

function addTyping() {
  const wrap = document.getElementById('messages');
  const div  = document.createElement('div');
  div.className = 'msg bot'; div.id = 'typing';
  div.innerHTML = `<div class="bubble"><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}
function removeTyping() { document.getElementById('typing')?.remove(); }

// ── CHIPS ──
function setChips(list) {
  const wrap = document.getElementById('chips');
  wrap.innerHTML = list.map(c =>
    `<button class="chip" onclick="chipSend('${c}')">${c}</button>`
  ).join('');
}
function chipSend(text) { document.getElementById('input').value = text; send(); }

// ── AUTO RESIZE TEXTAREA ──
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ── SYSTEM PROMPT ──
function buildSystem() {
  return `Eres RecreaBot, el asistente de IA del Instituto Superior Neumann para áreas recreativas.

ÁREA ACTUAL (desde QR escaneado): ${AREA || 'no especificada, pregunta al estudiante'}
ÁREAS DISPONIBLES: Canchita A, Canchita B, Taka Taka, Ajedrez, Sapito.
CARRERAS: Administración, Contabilidad.

FLUJO DE REGISTRO (sigue este orden):
1. Si el área ya está definida (viene del QR), no la preguntes — ya la sabes
2. Pide el CÓDIGO DE ESTUDIANTE (solo números, 4-10 dígitos)
3. Pide la CARRERA (Administración o Contabilidad)
4. Pide el NÚMERO DE PARTICIPANTES (1 a 6+)
5. Pide el HORARIO aproximado (7-9am / 9-11am / 11am-1pm / 1-3pm / 3-5pm / 5-7pm)
6. Pregunta si el EQUIPO ESTÁ EN BUEN ESTADO
7. Confirma el registro con todos los datos

REGLAS:
- Responde SIEMPRE en español, tono amigable y joven
- Respuestas CORTAS (máximo 3 líneas) — estamos en móvil
- Cuando confirmes el registro escribe al final: [REGISTRO COMPLETO ✅]
- Cuando registres incidencia escribe al final: [INCIDENCIA REGISTRADA 🔧]
- Si preguntan por disponibilidad: todas las áreas están disponibles salvo que haya incidencia
- Motiva el uso de Ajedrez y Sapito si el estudiante duda (tienen muy poca demanda)
- No uses markdown, no uses asteriscos, no uses listas con guiones`;
}

// ── ENVIAR MENSAJE ──
async function send() {
  const input = document.getElementById('input');
  const text  = input.value.trim();
  if (!text || busy) return;

  input.value = ''; input.style.height = 'auto';
  busy = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('chips').innerHTML = '';

  addMsg('user', text);
  history.push({ role: 'user', content: text });
  addTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system:     buildSystem(),
        messages:   history,
        max_tokens: 300,
      }),
    });

    const data = await res.json();
    removeTyping();

    if (data.content && data.content[0]) {
      const reply = data.content[0].text;
      history.push({ role: 'assistant', content: reply });
      addMsg('bot', reply);
      updateChips(reply, text);
      // Si el bot confirmó el registro, extrae datos y guarda en Sheets
      if (reply.includes('[REGISTRO COMPLETO')) {
        extraerDatosRegistro();
        await guardarEnSheets(registro);
        // Reset para el próximo registro
        registro = { area: AREA, codigo:'', carrera:'', participantes:'', horario:'', estado:'ok', problema:'', calificacion:'' };
      }
      // Si es incidencia, guarda con estado=problema
      if (reply.includes('[INCIDENCIA REGISTRADA')) {
        extraerDatosRegistro();
        registro.estado = 'problema';
        await guardarEnSheets(registro);
      }
    } else {
      addMsg('bot', '⚠️ No pude responder. Intenta de nuevo.');
    }
  } catch(e) {
    removeTyping();
    addMsg('bot', '⚠️ Sin conexión. Verifica tu internet e intenta de nuevo.');
  }

  busy = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('input').focus();
}

// ── CHIPS DINÁMICOS SEGÚN CONTEXTO ──
function updateChips(reply, userMsg) {
  const r = reply.toLowerCase();
  let chips = [];

  if (r.includes('código')) {
    chips = ['No tengo mi código', 'Soy de Administración', 'Soy de Contabilidad'];
  } else if (r.includes('carrera')) {
    chips = ['Administración', 'Contabilidad'];
  } else if (r.includes('participante') || r.includes('cuántos')) {
    chips = ['1', '2', '3', '4', '5', '6 o más'];
  } else if (r.includes('horario')) {
    chips = ['7-9am', '9-11am', '11am-1pm', '1-3pm', '3-5pm', '5-7pm'];
  } else if (r.includes('estado') || r.includes('buen estado') || r.includes('equipo')) {
    chips = ['✅ Todo bien', '⚠️ Hay un problema'];
  } else if (r.includes('registro completo') || r.includes('confirmado')) {
    chips = ['Registrar otro uso', 'Reportar problema', 'Ver otras áreas'];
  } else if (r.includes('qué área') || r.includes('qué deseas')) {
    chips = ['⚽ Canchita A', '⚽ Canchita B', '🏓 Taka Taka', '♟️ Ajedrez', '🐸 Sapito'];
  }

  if (chips.length) setChips(chips);
}

// ── INIT ──
window.addEventListener('load', () => {
  // Mensaje de bienvenida con pequeño delay para sensación natural
  setTimeout(() => {
    addTyping();
    setTimeout(() => {
      removeTyping();
      addMsg('bot', bienvenida);
      setChips(chipsIniciales);
    }, 800);
  }, 300);

  // Focus en input solo en desktop
  if (window.innerWidth > 480) {
    document.getElementById('input').focus();
  }
});
</script>
</body>
</html>
