<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración Mes Calidad — Instituto Neumann</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--s:#1a2235;--s2:#212d42;--b:#2a3a52;
  --acc:#6366f1;--acc2:#a5b4fc;--red:#ef4444;--green:#10b981;--yellow:#f59e0b;
  --text:#e2e8f0;--t2:#94a3b8;--t3:#64748b;
}
html,body{min-height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
body{padding:20px 16px 60px;max-width:960px;margin:0 auto}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:10px 16px;background:var(--s);border:1px solid var(--b);border-radius:10px}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-titulo{font-size:1rem;font-weight:800;color:var(--acc2)}
.topbar-user{font-size:0.78rem;color:var(--t2)}.topbar-user strong{color:var(--text)}
.btn-link{font-size:0.75rem;font-weight:600;color:var(--t3);border:1px solid var(--b);border-radius:6px;padding:5px 12px;text-decoration:none;transition:all .15s}
.btn-link:hover{border-color:var(--acc);color:var(--acc2)}
.btn-logout{font-size:0.75rem;font-weight:600;color:var(--t3);background:none;border:1px solid var(--b);border-radius:6px;padding:5px 12px;cursor:pointer}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--s);border:1px solid var(--b);border-radius:10px;padding:4px}
.tab{flex:1;padding:8px;text-align:center;font-size:0.83rem;font-weight:700;color:var(--t3);border-radius:7px;cursor:pointer;transition:all .15s;border:none;background:none;font-family:'Inter',sans-serif}
.tab.activo{background:var(--acc);color:#fff}
.tab:not(.activo):hover{color:var(--text);background:var(--s2)}

.panel{display:none}.panel.activo{display:block}

.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:20px;margin-bottom:16px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card-titulo{font-size:0.88rem;font-weight:700}

table{width:100%;border-collapse:collapse;font-size:0.78rem}
thead th{padding:8px 10px;color:var(--t3);font-weight:600;text-align:left;border-bottom:1px solid var(--b)}
tbody td{padding:10px;border-bottom:1px solid rgba(42,58,82,.4);color:var(--t2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}

.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:0.7rem;font-weight:700}
.badge-green{background:rgba(16,185,129,.15);color:var(--green)}
.badge-gray{background:rgba(42,58,82,.6);color:var(--t3)}

.btn{padding:8px 16px;border-radius:8px;border:none;font-size:0.82rem;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:'Inter',sans-serif}
.btn-acc{background:var(--acc);color:#fff}.btn-acc:hover{opacity:.85}
.btn-sec{background:var(--s2);color:var(--t2);border:1px solid var(--b)}.btn-sec:hover{border-color:var(--acc);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:0.73rem}
.btn-edit{background:none;color:var(--acc2);border:1.5px solid var(--b);border-radius:6px;padding:4px 10px;font-size:0.73rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}.btn-edit:hover{border-color:var(--acc)}
.btn-del{background:none;color:var(--red);border:1.5px solid rgba(239,68,68,.3);border-radius:6px;padding:4px 10px;font-size:0.73rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}.btn-del:hover{border-color:var(--red)}
.btn-toggle{background:none;color:var(--t3);border:1.5px solid var(--b);border-radius:6px;padding:4px 10px;font-size:0.73rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}.btn-toggle:hover{border-color:var(--green);color:var(--green)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.form-field label{font-size:0.7rem;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
.form-field input,.form-field select,.form-field textarea{width:100%;background:var(--s2);border:1.5px solid var(--b);border-radius:7px;padding:8px 10px;color:var(--text);font-size:0.83rem;font-family:'Inter',sans-serif;outline:none}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--acc)}
.form-field select option{background:var(--s2)}
.form-field.full{grid-column:1/-1}
.form-check{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:0.82rem;color:var(--t2)}
.form-check input{width:16px;height:16px;accent-color:var(--acc);cursor:pointer}

.msg-ok{background:rgba(16,185,129,.12);border:1px solid var(--green);color:var(--green);padding:10px 14px;border-radius:8px;font-size:0.83rem;font-weight:600;margin-top:10px;display:none;text-align:center}
.msg-err{background:rgba(239,68,68,.12);border:1px solid var(--red);color:var(--red);padding:10px 14px;border-radius:8px;font-size:0.83rem;font-weight:600;margin-top:10px;display:none;text-align:center}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:center;justify-content:center}
.modal-overlay.visible{display:flex}
.modal{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:28px;width:100%;max-width:500px;position:relative;max-height:90vh;overflow-y:auto}
.modal-titulo{font-size:0.95rem;font-weight:800;margin-bottom:20px;color:var(--acc2)}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--t3);font-size:1.2rem;cursor:pointer}
.modal-close:hover{color:var(--text)}

.staff-selector{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.staff-selector select{background:var(--s2);border:1.5px solid var(--b);border-radius:7px;padding:7px 10px;color:var(--text);font-size:0.83rem;font-family:'Inter',sans-serif;outline:none;min-width:220px}
.staff-selector select:focus{border-color:var(--acc)}

.fuente-desc{font-size:0.72rem;color:var(--t3);margin-top:4px;padding:4px 8px;background:var(--s2);border-radius:5px;display:none}

.empty{text-align:center;padding:24px;color:var(--t3);font-size:0.83rem}
</style>
<style id="ns-layout-pre">body{margin-left:240px!important}@media(max-width:780px){body{margin-left:0!important;padding-top:52px!important}}</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div style="font-size:1.4rem">⭐</div>
    <div class="topbar-titulo">Mes Calidad — Configuración</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="topbar-user" id="topbar-user"></div>
    <a href="/calidad-dashboard" class="btn-link">📊 Dashboard</a>
  </div>
</div>

<div class="tabs">
  <button class="tab activo" onclick="cambiarTab('periodos',this)">📅 Periodos de Calidad</button>
  <button class="tab" onclick="cambiarTab('kpis',this)">🎯 KPIs por Trabajador</button>
</div>

<!-- ── PANEL: PERIODOS ── -->
<div id="panel-periodos" class="panel activo">
  <div class="card">
    <div class="card-head">
      <div class="card-titulo">Periodos registrados</div>
      <button class="btn btn-acc btn-sm" onclick="abrirModalPeriodo()">+ Nuevo periodo</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Nombre</th><th>Inicio</th><th>Fin</th><th>Estado</th><th></th></tr></thead>
        <tbody id="tbodyPeriodos"><tr><td colspan="5" class="empty">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ── PANEL: KPIs ── -->
<div id="panel-kpis" class="panel">
  <div class="card">
    <div class="card-head">
      <div class="card-titulo">KPIs bonificables</div>
      <button class="btn btn-acc btn-sm" id="btnNuevoKpi" onclick="abrirModalKpi()" disabled>+ Agregar KPI</button>
    </div>
    <div class="staff-selector">
      <label style="font-size:0.75rem;color:var(--t3);font-weight:600">Trabajador:</label>
      <select id="selectStaff" onchange="cargarKpis()">
        <option value="">Selecciona un trabajador...</option>
      </select>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>KPI</th><th>Fuente</th><th>Meta</th><th>Unidad</th><th>Activo</th><th></th></tr></thead>
        <tbody id="tbodyKpis"><tr><td colspan="6" class="empty">Selecciona un trabajador</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL: Periodo -->
<div class="modal-overlay" id="modalPeriodo">
  <div class="modal">
    <button class="modal-close" onclick="cerrarModal('modalPeriodo')">✕</button>
    <div class="modal-titulo" id="modalPeriodoTitulo">Nuevo periodo de calidad</div>
    <div class="form-grid">
      <div class="form-field full">
        <label>Nombre del periodo</label>
        <input type="text" id="pNombre" placeholder="Ej: Calidad Julio 2026">
      </div>
      <div class="form-field">
        <label>Fecha inicio</label>
        <input type="date" id="pInicio">
      </div>
      <div class="form-field">
        <label>Fecha fin</label>
        <input type="date" id="pFin">
      </div>
      <div class="form-field full">
        <label class="form-check">
          <input type="checkbox" id="pActivo">
          Marcar como periodo activo
        </label>
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-sec" onclick="cerrarModal('modalPeriodo')">Cancelar</button>
      <button class="btn btn-acc" onclick="guardarPeriodo()">Guardar</button>
    </div>
    <div class="msg-ok" id="periodoOk"></div>
    <div class="msg-err" id="periodoErr"></div>
  </div>
</div>

<!-- MODAL: KPI -->
<div class="modal-overlay" id="modalKpi">
  <div class="modal">
    <button class="modal-close" onclick="cerrarModal('modalKpi')">✕</button>
    <div class="modal-titulo" id="modalKpiTitulo">Agregar KPI</div>
    <div class="form-grid">
      <div class="form-field full">
        <label>Nombre del KPI</label>
        <input type="text" id="kNombre" placeholder="Ej: Atenciones registradas">
      </div>
      <div class="form-field full">
        <label>Descripción (opcional)</label>
        <input type="text" id="kDesc" placeholder="Ej: Nº de atenciones registradas en el periodo">
      </div>
      <div class="form-field full">
        <label>Fuente de datos</label>
        <select id="kFuente" onchange="mostrarDescFuente()">
          <option value="">Selecciona...</option>
          <optgroup label="── Salud / Tópico ──">
            <option value="salud_atenciones">Atenciones de salud</option>
            <option value="salud_charlas">Charlas de salud (cantidad impartidas)</option>
            <option value="salud_charlas_participantes">Participantes en charlas de salud</option>
            <option value="salud_satisfaccion">Satisfacción atenciones (promedio)</option>
            <option value="salud_charlas_satisfaccion">Satisfacción charlas salud (promedio)</option>
          </optgroup>
          <optgroup label="── Psicopedagógico ──">
            <optgroup label="── Zoho Desk ──">
              <option value="zoho_tickets_resueltos">Tickets resueltos (Zoho Desk)</option>
              <option value="zoho_tickets_recibidos">Tickets recibidos (Zoho Desk)</option>
              <option value="zoho_primera_respuesta">Tiempo primera respuesta hrs (Zoho Desk)</option>
              <option value="zoho_csat">Satisfacción CSAT agente (Zoho Desk)</option>
            </optgroup>
            <optgroup label="── Psicopedagógico ──">
            <option value="psico_sesiones">Sesiones psicopedagógicas completadas</option>
            <option value="psico_satisfaccion">Satisfacción sesiones psico (promedio)</option>
            <option value="psico_asistencia">% Asistencia a sesiones psico</option>
            <option value="psico_charlas">Charlas psicopedagógicas</option>
            <option value="psico_charlas_satisfaccion">Satisfacción charlas psico (promedio)</option>
          </optgroup>
          <optgroup label="── Otro ──">
            <option value="manual">Ingreso manual</option>
          </optgroup>
        </select>
        <div class="fuente-desc" id="fuenteDesc"></div>
      </div>
      <div class="form-field">
        <label>Meta (valor mínimo)</label>
        <input type="number" id="kMeta" min="0" step="0.1" placeholder="Ej: 20">
      </div>
      <div class="form-field">
        <label>Unidad</label>
        <input type="text" id="kUnidad" placeholder="Ej: atenciones, /5">
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-sec" onclick="cerrarModal('modalKpi')">Cancelar</button>
      <button class="btn btn-acc" onclick="guardarKpi()">Guardar KPI</button>
    </div>
    <div class="msg-ok" id="kpiOk"></div>
    <div class="msg-err" id="kpiErr"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/sidebar.js"></script>
<script>
const sb = supabase.createClient(
  'https://exjaxhrylfdwehzjfjut.supabase.co',
  'sb_publishable_EP2Y83o7nj7CGCUd0pH3VA_vSNkeg99'
);

let token = null;
  // Mantener el token de sesion fresco cuando Supabase lo renueva (evita 'Sesion invalida' en formularios largos)
  sb.auth.onAuthStateChange((_e, s) => { if (s && s.access_token) token = s.access_token; });
async function getToken() {
  const { data: { session } } = await sb.auth.getSession();
  token = session?.access_token || token;
  return token;
}
let periodos = [];
let kpisActuales = [];
let editandoPeriodoId = null;
let editandoKpiId = null;

const FUENTE_DESC = {
  salud_atenciones:          'Cuenta automáticamente las atenciones registradas en el módulo de Salud durante el periodo.',
  salud_charlas:             'Cuenta automáticamente las charlas de salud impartidas (QRs generados) durante el periodo.',
  salud_charlas_participantes:'Cuenta las encuestas respondidas en charlas de salud — equivale al nº de participantes.',
  salud_satisfaccion:        'Calcula el promedio de calificaciones de evaluaciones de atención de salud.',
  salud_charlas_satisfaccion:'Calcula el promedio de calificaciones de evaluaciones de charlas de salud.',
  zoho_tickets_resueltos:    'Cuenta los tickets cerrados asignados a este agente en Zoho Desk durante el periodo.',
  zoho_tickets_recibidos:    'Cuenta el total de tickets recibidos asignados a este agente en Zoho Desk durante el periodo.',
  zoho_csat:                 'Promedio de satisfacción del cliente (CSAT) del agente en Zoho Desk, convertido a escala 1-5.',
  psico_sesiones:            'Cuenta automáticamente las sesiones psicopedagógicas con estado "completada" durante el periodo.',
  psico_satisfaccion:        'Calcula el promedio de satisfacción de las evaluaciones de sesiones psicopedagógicas (escala 1-5).',
  psico_asistencia:          'Calcula el % de asistencia: sesiones completadas ÷ (completadas + no asistió) × 100.',
  psico_charlas:             'Cuenta automáticamente las charlas psicopedagógicas realizadas durante el periodo.',
  psico_charlas_satisfaccion:'Calcula el promedio de calificaciones de evaluaciones de charlas psicopedagógicas.',
  manual:                    'El director ingresa el valor manualmente en el dashboard de desempeño.',
};

function fmtFecha(d) {
  if (!d) return '—';
  const [y,m,dd] = d.split('-');
  return `${dd}/${m}/${y}`;
}

// ── Auth ──
async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/login'; return; }
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal.currentLevel !== 'aal2') { await sb.auth.signOut(); window.location.href = '/login'; return; }
  token = session.access_token;
  const r = await fetch('/api/staff-info', { headers: { 'Authorization': `Bearer ${await getToken()}` } });
  if (!r.ok) { window.location.href = '/login'; return; }
  const info = await r.json();
  if (info.rol !== 'director' && info.modulos && info.modulos.length > 0 && !info.modulos.includes('calidad_config')) { window.location.href = '/ejecutivo'; return; }
  document.getElementById('topbar-user').innerHTML = `<strong>${info.nombre}</strong>`;
  await Promise.all([cargarPeriodos(), cargarStaff()]);
}

// ── Tabs ──
function cambiarTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('activo'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('activo'));
  btn.classList.add('activo');
  document.getElementById(`panel-${tab}`).classList.add('activo');
}

// ── PERIODOS ──
async function cargarPeriodos() {
  const r = await fetch('/api/calidad?accion=periodos', { headers: { 'Authorization': `Bearer ${await getToken()}` } });
  periodos = await r.json();
  renderPeriodos();
}

function renderPeriodos() {
  const tbody = document.getElementById('tbodyPeriodos');
  if (!periodos.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty">Sin periodos registrados</td></tr>'; return; }
  tbody.innerHTML = periodos.map(p => `
    <tr>
      <td style="color:var(--text);font-weight:600">${p.nombre}</td>
      <td>${fmtFecha(p.fecha_inicio)}</td>
      <td>${fmtFecha(p.fecha_fin)}</td>
      <td>${p.activo
        ? '<span class="badge badge-green">Activo</span>'
        : '<span class="badge badge-gray">Histórico</span>'}</td>
      <td style="display:flex;gap:6px">
        <button class="btn-edit" onclick="abrirModalPeriodo('${p.id}')">Editar</button>
        ${!p.activo ? `<button class="btn-toggle" onclick="activarPeriodo('${p.id}')">Activar</button>` : ''}
      </td>
    </tr>`).join('');
}

function abrirModalPeriodo(id) {
  editandoPeriodoId = id || null;
  const p = id ? periodos.find(x => x.id === id) : null;
  document.getElementById('modalPeriodoTitulo').textContent = p ? 'Editar periodo' : 'Nuevo periodo de calidad';
  document.getElementById('pNombre').value = p?.nombre || '';
  document.getElementById('pInicio').value = p?.fecha_inicio || '';
  document.getElementById('pFin').value = p?.fecha_fin || '';
  document.getElementById('pActivo').checked = p?.activo || false;
  document.getElementById('periodoOk').style.display = 'none';
  document.getElementById('periodoErr').style.display = 'none';
  document.getElementById('modalPeriodo').classList.add('visible');
}

async function activarPeriodo(id) {
  await fetch('/api/calidad', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${await getToken()}` },
    body: JSON.stringify({ accion: 'periodo', id, activo: true }),
  });
  await cargarPeriodos();
}

async function guardarPeriodo() {
  const ok = document.getElementById('periodoOk');
  const err = document.getElementById('periodoErr');
  ok.style.display = 'none'; err.style.display = 'none';
  const nombre = document.getElementById('pNombre').value.trim();
  const fecha_inicio = document.getElementById('pInicio').value;
  const fecha_fin = document.getElementById('pFin').value;
  const activo = document.getElementById('pActivo').checked;
  if (!nombre || !fecha_inicio || !fecha_fin) {
    err.textContent = 'Completa todos los campos'; err.style.display = 'block'; return;
  }
  const method = editandoPeriodoId ? 'PUT' : 'POST';
  const body = editandoPeriodoId
    ? { accion: 'periodo', id: editandoPeriodoId, nombre, fecha_inicio, fecha_fin, activo }
    : { accion: 'periodo', nombre, fecha_inicio, fecha_fin, activo };
  const r = await fetch('/api/calidad', {
    method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${await getToken()}` },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!data.ok) { err.textContent = data.error || 'Error'; err.style.display = 'block'; return; }
  ok.textContent = editandoPeriodoId ? '✅ Periodo actualizado' : '✅ Periodo creado';
  ok.style.display = 'block';
  await cargarPeriodos();
  setTimeout(() => cerrarModal('modalPeriodo'), 1500);
}

// ── KPIs ──
async function cargarStaff() {
  const r = await fetch('/api/calidad?accion=staff', { headers: { 'Authorization': `Bearer ${await getToken()}` } });
  const staff = await r.json();
  const sel = document.getElementById('selectStaff');
  sel.innerHTML = '<option value="">Selecciona un trabajador...</option>' +
    staff.map(s => `<option value="${s.id}">${s.nombre} · ${s.roles?.nombre || ''}</option>`).join('');
}

async function cargarKpis() {
  const staffId = document.getElementById('selectStaff').value;
  document.getElementById('btnNuevoKpi').disabled = !staffId;
  if (!staffId) {
    document.getElementById('tbodyKpis').innerHTML = '<tr><td colspan="6" class="empty">Selecciona un trabajador</td></tr>';
    return;
  }
  const r = await fetch(`/api/calidad?accion=kpis&staff_id=${staffId}`, { headers: { 'Authorization': `Bearer ${await getToken()}` } });
  kpisActuales = await r.json();
  renderKpis();
}

const FUENTE_LABEL = {
  salud_atenciones:'Atenciones salud', salud_charlas:'Charlas impartidas', salud_charlas_participantes:'Participantes charlas',
  salud_satisfaccion:'Satisfacción atenc.', salud_charlas_satisfaccion:'Satisfacción charlas salud',
  zoho_tickets_resueltos:'Tickets resueltos Zoho', zoho_tickets_recibidos:'Tickets recibidos Zoho', zoho_csat:'CSAT Zoho',
  psico_sesiones:'Sesiones psico', psico_satisfaccion:'Satisfacción sesiones psico', psico_asistencia:'% Asistencia psico', psico_charlas:'Charlas psico',
  psico_charlas_satisfaccion:'Satisfacción charlas psico', manual:'Manual',
};

function renderKpis() {
  const tbody = document.getElementById('tbodyKpis');
  if (!kpisActuales.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">Sin KPIs configurados</td></tr>'; return; }
  tbody.innerHTML = kpisActuales.map(k => `
    <tr>
      <td style="color:var(--text);font-weight:600">${k.nombre_kpi}</td>
      <td style="font-size:0.75rem;color:var(--t3)">${FUENTE_LABEL[k.fuente]||k.fuente}</td>
      <td style="font-weight:700;color:var(--acc2)">${k.meta_valor}</td>
      <td style="color:var(--t3)">${k.unidad||'—'}</td>
      <td>
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" ${k.activo?'checked':''} style="accent-color:var(--acc)"
            onchange="toggleKpi(${k.id},this.checked)"> <span style="font-size:0.75rem;color:var(--t3)">${k.activo?'Sí':'No'}</span>
        </label>
      </td>
      <td style="display:flex;gap:6px">
        <button class="btn-edit" onclick="abrirModalKpi(${k.id})">Editar</button>
        <button class="btn-del" onclick="eliminarKpi(${k.id})">Eliminar</button>
      </td>
    </tr>`).join('');
}

async function toggleKpi(id, activo) {
  await fetch('/api/calidad', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${await getToken()}` },
    body: JSON.stringify({ accion: 'kpi', id, activo }),
  });
}

function mostrarDescFuente() {
  const val = document.getElementById('kFuente').value;
  const el = document.getElementById('fuenteDesc');
  if (val && FUENTE_DESC[val]) { el.textContent = FUENTE_DESC[val]; el.style.display = 'block'; }
  else { el.style.display = 'none'; }
}

function abrirModalKpi(id) {
  editandoKpiId = id || null;
  const k = id ? kpisActuales.find(x => x.id === id) : null;
  document.getElementById('modalKpiTitulo').textContent = k ? 'Editar KPI' : 'Agregar KPI';
  document.getElementById('kNombre').value = k?.nombre_kpi || '';
  document.getElementById('kDesc').value = k?.descripcion || '';
  document.getElementById('kFuente').value = k?.fuente || '';
  document.getElementById('kMeta').value = k?.meta_valor ?? '';
  document.getElementById('kUnidad').value = k?.unidad || '';
  document.getElementById('kpiOk').style.display = 'none';
  document.getElementById('kpiErr').style.display = 'none';
  mostrarDescFuente();
  document.getElementById('modalKpi').classList.add('visible');
}

async function guardarKpi() {
  const ok = document.getElementById('kpiOk');
  const err = document.getElementById('kpiErr');
  ok.style.display = 'none'; err.style.display = 'none';
  const staffId = document.getElementById('selectStaff').value;
  const nombre_kpi = document.getElementById('kNombre').value.trim();
  const descripcion = document.getElementById('kDesc').value.trim();
  const fuente = document.getElementById('kFuente').value;
  const meta_valor = document.getElementById('kMeta').value;
  const unidad = document.getElementById('kUnidad').value.trim();
  if (!nombre_kpi || !fuente || meta_valor === '') {
    err.textContent = 'Completa nombre, fuente y meta'; err.style.display = 'block'; return;
  }
  const method = editandoKpiId ? 'PUT' : 'POST';
  const body = editandoKpiId
    ? { accion: 'kpi', id: editandoKpiId, nombre_kpi, descripcion, fuente, meta_valor, unidad }
    : { accion: 'kpi', staff_id: staffId, nombre_kpi, descripcion, fuente, meta_valor, unidad };
  const r = await fetch('/api/calidad', {
    method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${await getToken()}` },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!data.ok) { err.textContent = data.error || 'Error'; err.style.display = 'block'; return; }
  ok.textContent = editandoKpiId ? '✅ KPI actualizado' : '✅ KPI agregado';
  ok.style.display = 'block';
  await cargarKpis();
  setTimeout(() => cerrarModal('modalKpi'), 1500);
}

async function eliminarKpi(id) {
  if (!confirm('¿Eliminar este KPI?')) return;
  await fetch(`/api/calidad?accion=kpi&id=${id}`, {
    method: 'DELETE', headers: { 'Authorization': `Bearer ${await getToken()}` },
  });
  await cargarKpis();
}

function cerrarModal(id) { document.getElementById(id).classList.remove('visible'); }
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('visible'); });
});

initAuth();
</script>
</body>
</html>
