<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>Museos Virtuales — Instituto Neumann</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--s:#1a2235;--s2:#212d42;--b:#2a3a52;
  --text:#e2e8f0;--t2:#94a3b8;--t3:#64748b;
  --acc:#8b5cf6;--acc2:#a78bfa;--green:#10b981;
}
html,body{min-height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}

/* HERO */
.hero{
  background:linear-gradient(135deg,#1a1040 0%,#0f1117 50%,#1a2235 100%);
  padding:60px 24px 48px;text-align:center;
  border-bottom:1px solid var(--b);
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(139,92,246,.15) 0%,transparent 70%);
}
.hero-badge{
  display:inline-block;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);
  color:var(--acc2);font-size:.72rem;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;padding:5px 14px;border-radius:20px;margin-bottom:20px;
}
.hero h1{font-size:2.4rem;font-weight:800;line-height:1.15;margin-bottom:12px;position:relative}
.hero h1 span{color:var(--acc2)}
.hero p{font-size:1rem;color:var(--t2);max-width:520px;margin:0 auto;line-height:1.7;position:relative}

/* FILTROS */
.filtros{display:flex;gap:10px;justify-content:center;padding:28px 24px 0;flex-wrap:wrap}
.filtro-btn{
  padding:7px 18px;border-radius:20px;font-size:.8rem;font-weight:600;
  cursor:pointer;border:1px solid var(--b);background:var(--s);color:var(--t2);
  transition:all .15s;font-family:'Inter',sans-serif;
}
.filtro-btn:hover,.filtro-btn.active{border-color:var(--acc);color:var(--acc2);background:rgba(139,92,246,.1)}

/* GRID */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:20px;padding:24px;max-width:1200px;margin:0 auto;
}

/* CARD */
.card{
  background:var(--s);border:1px solid var(--b);border-radius:16px;
  overflow:hidden;transition:transform .2s,border-color .2s;display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-3px);border-color:var(--acc)}

.card-img{
  width:100%;height:180px;object-fit:cover;display:block;
  background:var(--s2);
}
.card-img-placeholder{
  width:100%;height:180px;background:linear-gradient(135deg,var(--s2),var(--b));
  display:flex;align-items:center;justify-content:center;font-size:3rem;
}

.card-body{padding:18px 18px 14px;flex:1;display:flex;flex-direction:column}
.card-cat{
  font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  margin-bottom:8px;
}
.cat-peru{color:var(--green)}.cat-internacional{color:var(--acc2)}
.card-nombre{font-size:.95rem;font-weight:700;margin-bottom:8px;line-height:1.3}
.card-desc{font-size:.78rem;color:var(--t2);line-height:1.6;flex:1;margin-bottom:16px}

.card-btn{
  display:block;text-align:center;background:var(--acc);color:white;
  padding:10px 16px;border-radius:10px;text-decoration:none;font-size:.82rem;
  font-weight:600;transition:background .15s;
}
.card-btn:hover{background:var(--acc2);color:#1a1040}

/* STATS */
.stats{text-align:center;padding:16px 24px 32px;color:var(--t3);font-size:.78rem}

/* FOOTER */
.footer{background:var(--s);border-top:1px solid var(--b);padding:20px;text-align:center;font-size:.75rem;color:var(--t3)}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">🏛️ Actividades Culturales</div>
  <h1>Museos Virtuales<br><span>Instituto Superior Neumann</span></h1>
  <p>Explora las colecciones más importantes del mundo desde tu casa. Arte, historia, arqueología y cultura peruana al alcance de un clic.</p>
</div>

<div class="filtros">
  <button class="filtro-btn active" onclick="filtrar('todos', this)">Todos (24)</button>
  <button class="filtro-btn" onclick="filtrar('peru', this)">🇵🇪 Museos peruanos</button>
  <button class="filtro-btn" onclick="filtrar('internacional', this)">🌍 Internacionales</button>
</div>

<div class="grid" id="grid"></div>
<div class="stats" id="stats"></div>

<div class="footer">Instituto Superior Neumann · Actividades Culturales · <a href="/ejecutivo" style="color:var(--acc2);text-decoration:none">Dashboard</a></div>

let filtroActual = 'todos';

function filtrar(cat, btn) {
  filtroActual = cat;
  document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function renderGrid() {
  const lista = filtroActual === 'todos' ? museos : museos.filter(m => m.categoria === filtroActual);
  const grid = document.getElementById('grid');

  grid.innerHTML = lista.map(m => {
    const catLabel = m.categoria === 'peru' ? '🇵🇪 Museo peruano' : '🌍 Internacional';
    const catClass = m.categoria === 'peru' ? 'cat-peru' : 'cat-internacional';
    return `
      <div class="card" data-cat="${m.categoria}">
        <img class="card-img" src="${m.img}" alt="${m.nombre}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="card-img-placeholder" style="display:none">${m.emoji}</div>
        <div class="card-body">
          <div class="card-cat ${catClass}">${catLabel}</div>
          <div class="card-nombre">${m.nombre}</div>
          <div class="card-desc">${m.desc}</div>
          <a class="card-btn" href="${BASE}/r/${m.slug}" target="_blank" rel="noopener">
            🏛️ Visitar museo virtual
          </a>
        </div>
      </div>`;
  }).join('');

  document.getElementById('stats').textContent = `${lista.length} museo${lista.length !== 1 ? 's' : ''} disponible${lista.length !== 1 ? 's' : ''}`;
}

renderGrid();
</script>

</html>
