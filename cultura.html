<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>Museos Virtuales — Instituto Neumann</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--s:#1a2235;--s2:#212d42;--b:#2a3a52;
  --text:#e2e8f0;--t2:#94a3b8;--t3:#64748b;
  --acc:#8b5cf6;--acc2:#a78bfa;--green:#10b981;
}
html,body{min-height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}

/* HERO */
.hero{
  background:linear-gradient(135deg,#1a1040 0%,#0f1117 50%,#1a2235 100%);
  padding:60px 24px 48px;text-align:center;
  border-bottom:1px solid var(--b);
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(139,92,246,.15) 0%,transparent 70%);
}
.hero-badge{
  display:inline-block;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);
  color:var(--acc2);font-size:.72rem;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;padding:5px 14px;border-radius:20px;margin-bottom:20px;
}
.hero h1{font-size:2.4rem;font-weight:800;line-height:1.15;margin-bottom:12px;position:relative}
.hero h1 span{color:var(--acc2)}
.hero p{font-size:1rem;color:var(--t2);max-width:520px;margin:0 auto;line-height:1.7;position:relative}

/* FILTROS */
.filtros{display:flex;gap:10px;justify-content:center;padding:28px 24px 0;flex-wrap:wrap}
.filtro-btn{
  padding:7px 18px;border-radius:20px;font-size:.8rem;font-weight:600;
  cursor:pointer;border:1px solid var(--b);background:var(--s);color:var(--t2);
  transition:all .15s;font-family:'Inter',sans-serif;
}
.filtro-btn:hover,.filtro-btn.active{border-color:var(--acc);color:var(--acc2);background:rgba(139,92,246,.1)}

/* GRID */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:20px;padding:24px;max-width:1200px;margin:0 auto;
}

/* CARD */
.card{
  background:var(--s);border:1px solid var(--b);border-radius:16px;
  overflow:hidden;transition:transform .2s,border-color .2s;display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-3px);border-color:var(--acc)}

.card-img{
  width:100%;height:180px;object-fit:cover;display:block;
  background:var(--s2);
}
.card-img-placeholder{
  width:100%;height:180px;background:linear-gradient(135deg,var(--s2),var(--b));
  display:flex;align-items:center;justify-content:center;font-size:3rem;
}

.card-body{padding:18px 18px 14px;flex:1;display:flex;flex-direction:column}
.card-cat{
  font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  margin-bottom:8px;
}
.cat-peru{color:var(--green)}.cat-internacional{color:var(--acc2)}
.card-nombre{font-size:.95rem;font-weight:700;margin-bottom:8px;line-height:1.3}
.card-desc{font-size:.78rem;color:var(--t2);line-height:1.6;flex:1;margin-bottom:16px}

.card-btn{
  display:block;text-align:center;background:var(--acc);color:white;
  padding:10px 16px;border-radius:10px;text-decoration:none;font-size:.82rem;
  font-weight:600;transition:background .15s;
}
.card-btn:hover{background:var(--acc2);color:#1a1040}

/* STATS */
.stats{text-align:center;padding:16px 24px 32px;color:var(--t3);font-size:.78rem}

/* FOOTER */
.footer{background:var(--s);border-top:1px solid var(--b);padding:20px;text-align:center;font-size:.75rem;color:var(--t3)}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">🏛️ Actividades Culturales</div>
  <h1>Museos Virtuales<br><span>Instituto Superior Neumann</span></h1>
  <p>Explora las colecciones más importantes del mundo desde tu casa. Arte, historia, arqueología y cultura peruana al alcance de un clic.</p>
</div>

<div class="filtros">
  <button class="filtro-btn active" onclick="filtrar('todos', this)">Todos (24)</button>
  <button class="filtro-btn" onclick="filtrar('peru', this)">🇵🇪 Museos peruanos</button>
  <button class="filtro-btn" onclick="filtrar('internacional', this)">🌍 Internacionales</button>
</div>

<div class="grid" id="grid"></div>
<div class="stats" id="stats"></div>

<div class="footer">Instituto Superior Neumann · Actividades Culturales · <a href="/ejecutivo" style="color:var(--acc2);text-decoration:none">Dashboard</a></div>

<script>
const BASE = 'https://recreabot-neumann.vercel.app';

const museos = [
  // INTERNACIONALES
  { slug:'hermitage',        nombre:'Museo Hermitage',                  categoria:'internacional', emoji:'🎨', wiki:'Hermitage Museum',
    desc:'Uno de los museos más grandes del mundo con más de 3 millones de obras de arte e historia en San Petersburgo, Rusia.' },
  { slug:'prado',            nombre:'Museo del Prado',                  categoria:'internacional', emoji:'🖼️', wiki:'Museo del Prado',
    desc:'El principal museo de arte de España con obras maestras de Velázquez, Goya, El Greco y Rubens.' },
  { slug:'louvre',           nombre:'Louvre Museum',                    categoria:'internacional', emoji:'🏺', wiki:'Louvre',
    desc:'El museo más visitado del mundo, hogar de la Mona Lisa y miles de obras desde la antigüedad hasta el siglo XIX.' },
  { slug:'vaticano',         nombre:'Museos del Vaticano',              categoria:'internacional', emoji:'⛪', wiki:'Vatican Museums',
    desc:'Las colecciones pontificias con la Capilla Sixtina de Miguel Ángel y obras de Rafael y Leonardo da Vinci.' },
  { slug:'america',          nombre:'Museo de América',                 categoria:'internacional', emoji:'🌎', wiki:'Museo de América',
    desc:'Museo español especializado en las culturas y civilizaciones de América desde la prehistoria hasta la actualidad.' },
  { slug:'british',          nombre:'British Museum',                   categoria:'internacional', emoji:'🏛️', wiki:'British Museum',
    desc:'Dos millones de años de historia humana en Londres, con la Piedra Rosetta y momias egipcias entre sus tesoros.' },
  { slug:'orsay',            nombre:"Museo d'Orsay",                    categoria:'internacional', emoji:'🌸', wiki:'Claude Monet',
    desc:'El mejor museo impresionista del mundo con obras de Monet, Renoir, Degas y Van Gogh en París.' },
  { slug:'frida-kahlo',      nombre:'Museo Frida Kahlo',                categoria:'internacional', emoji:'🌺', wiki:'Frida Kahlo Museum',
    desc:'La Casa Azul de Ciudad de México, hogar de la icónica pintora mexicana y testigo de su vida y obra.' },
  { slug:'air-space',        nombre:'Smithsonian Air and Space',        categoria:'internacional', emoji:'🚀', wiki:'National Air and Space Museum',
    desc:'El museo más visitado de EE.UU. con naves espaciales reales, aviones históricos y la historia de la aviación.' },
  { slug:'met',              nombre:'The Metropolitan Museum of Art',   categoria:'internacional', emoji:'🗽', wiki:'Metropolitan Museum of Art',
    desc:'El Met de Nueva York alberga más de 5,000 años de arte de todo el mundo en una de las colecciones más importantes del planeta.' },
  { slug:'chichen-itza',     nombre:'Chichén Itzá',                     categoria:'internacional', emoji:'🏯', wiki:'Chichen Itza',
    desc:'Recorre virtualmente la majestuosa ciudad maya, una de las siete maravillas del mundo moderno.' },
  { slug:'van-gogh',         nombre:'Museo Van Gogh',                   categoria:'internacional', emoji:'🌻', wiki:'Van Gogh Museum',
    desc:'Amsterdam celebra la vida y obra del genio holandés con la mayor colección de pinturas de Van Gogh del mundo.' },
  // PERUANOS
  { slug:'gastronomia-peruana', nombre:'Casa de la Gastronomía Peruana', categoria:'peru', emoji:'🍽️', wiki:'Ceviche',
    desc:'Descubre la riqueza y diversidad de la gastronomía peruana, patrimonio cultural de la nación.' },
  { slug:'cultura-peruana',  nombre:'Museo Nacional de la Cultura Peruana', categoria:'peru', emoji:'🏺', wiki:'Nazca Lines',
    desc:'Colección de arte popular, textiles, cerámica y expresiones culturales de todas las regiones del Perú.' },
  { slug:'cajamarca',        nombre:'Cuarto de Rescate — Cajamarca',   categoria:'peru', emoji:'👑', wiki:'Atahualpa',
    desc:'El lugar histórico donde el Inca Atahualpa prometió llenar una habitación de oro y plata a cambio de su libertad.' },
  { slug:'chan-chan',         nombre:'Museo de Sitio Chan Chan',         categoria:'peru', emoji:'🏜️', wiki:'Chan Chan',
    desc:'La ciudad de barro más grande de América precolombina, capital del Imperio Chimú en La Libertad.' },
  { slug:'sipan',            nombre:'Museo Tumbas Reales de Sipán',     categoria:'peru', emoji:'⚰️', wiki:'Lord of Sipán',
    desc:'El descubrimiento arqueológico más importante de América en el siglo XX: las tumbas del Señor de Sipán.' },
  { slug:'huallamarca',      nombre:'Museo de Sitio de Huallamarca',    categoria:'peru', emoji:'🔺', wiki:'Huaca Huallamarca',
    desc:'Pirámide prehispánica en el corazón de San Isidro, Lima, con más de 1,500 años de historia.' },
  { slug:'muna',             nombre:'MUNA Museo Nacional del Perú',     categoria:'peru', emoji:'🇵🇪', wiki:'Machu Picchu',
    desc:'El museo nacional más importante del Perú con colecciones que abarcan toda la historia del país.' },
  { slug:'arqueologia-peru', nombre:'Museo Nacional de Arqueología',    categoria:'peru', emoji:'🏛️', wiki:'Moche culture',
    desc:'La colección arqueológica más completa del Perú con piezas de todas las culturas precolombinas.' },
  { slug:'chavin',           nombre:'Museo Nacional Chavín',            categoria:'peru', emoji:'🗿', wiki:'Chavín de Huántar',
    desc:'La cultura Chavín, primera gran civilización andina, con sus misteriosas cabezas clavas de más de 3,000 años.' },
  { slug:'pachacamac',       nombre:'Museo de Sitio Pachacamac',        categoria:'peru', emoji:'☀️', wiki:'Pachacamac',
    desc:'El gran santuario y oráculo de la costa central del Perú, venerado por múltiples culturas durante más de mil años.' },
  { slug:'tawantinsuyu',     nombre:'Museo Virtual del Tawantinsuyu',   categoria:'peru', emoji:'🌄', wiki:'Inca Empire',
    desc:'Recorre el Imperio Inca, el más grande de América precolombina, su organización, arquitectura y legado cultural.' },
  { slug:'tucume',           nombre:'Museo Túcume',                     categoria:'peru', emoji:'🔺', wiki:'Túcume',
    desc:'El valle de las pirámides en Lambayeque con 26 pirámides truncas construidas por la cultura Lambayeque.' },
];

let filtroActual = 'todos';

function filtrar(cat, btn) {
  filtroActual = cat;
  document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
  cargarImagenes();
}

function renderGrid() {
  const lista = filtroActual === 'todos' ? museos : museos.filter(m => m.categoria === filtroActual);
  const grid = document.getElementById('grid');

  grid.innerHTML = lista.map(m => {
    const catLabel = m.categoria === 'peru' ? '🇵🇪 Museo peruano' : '🌍 Internacional';
    const catClass = m.categoria === 'peru' ? 'cat-peru' : 'cat-internacional';
    return `
      <div class="card" data-slug="${m.slug}" data-cat="${m.categoria}">
        <div class="card-img-placeholder" id="ph-${m.slug}">${m.emoji}</div>
        <img class="card-img" id="img-${m.slug}" src="" alt="${m.nombre}" style="display:none">
        <div class="card-body">
          <div class="card-cat ${catClass}">${catLabel}</div>
          <div class="card-nombre">${m.nombre}</div>
          <div class="card-desc">${m.desc}</div>
          <a class="card-btn" href="${BASE}/r/${m.slug}" target="_blank" rel="noopener">
            🏛️ Visitar museo virtual
          </a>
        </div>
      </div>`;
  }).join('');

  document.getElementById('stats').textContent = `${lista.length} museo${lista.length !== 1 ? 's' : ''} disponible${lista.length !== 1 ? 's' : ''}`;
}

async function cargarImagen(museo) {
  try {
    const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(museo.wiki)}`);
    if (!r.ok) return;
    const data = await r.json();
    const src = data.thumbnail?.source;
    if (!src) return;
    const img = document.getElementById(`img-${museo.slug}`);
    const ph  = document.getElementById(`ph-${museo.slug}`);
    if (!img) return;
    img.onload = () => { img.style.display = 'block'; if (ph) ph.style.display = 'none'; };
    img.onerror = () => {};
    img.src = src;
  } catch(e) {}
}

function cargarImagenes() {
  const lista = filtroActual === 'todos' ? museos : museos.filter(m => m.categoria === filtroActual);
  lista.forEach(m => cargarImagen(m));
}

renderGrid();
cargarImagenes();
</script>
</body>
</html>
